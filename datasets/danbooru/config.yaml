    - skirt
  scene_tags:
    - simple_background
    - city_street
    - forest
    - studio_background
    - stage
    - street
    - indoors
    - outdoors
  action_bucket_tags:
    - dancing
    - fighting_stance
    - dynamic_pose
    - action_pose
    - jumping
    - kicking
    - high_kick
    - squatting
    - crouching
    - all_fours
    - bent_over
    - standing_on_one_leg
    - stretching
    - holding_weapon
    - holding_sword
    - holding_gun
    - dual_wielding
  # Sampling weight per anatomy bucket (tunable knob).
  default_bucket_weights:
    hands_visible: 0.14
    hand_focus: 0.10
    action_pose: 0.16
    running: 0.08
    walking: 0.10
    kneeling: 0.10
    standing_front: 0.07
    feet_visible: 0.07
    sitting_full_body: 0.07
    arms_visible: 0.08
    standing_side: 0.03
