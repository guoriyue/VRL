# Danbooru anime / safety tag taxonomy for in-place dataset generation.
#
# Single source of truth for the anime-tag vocabularies and bucket weights used
# by vrl/scripts/data/danbooru.py. Extracted from module-level ALL_CAPS constants
# so the filter / bucket vocabulary can be reviewed and tuned (e.g. by data
# curators) without editing Python. The script loads this at import time and
# exposes the same constant names (EXCLUDE_TAGS, POSE_TAGS, SAFETY_RISK_TAGS, ...).
#
# On load (see danbooru.py _load_taxonomy): list-valued *_tags / *_labels become
# set or tuple to match prior runtime types; subject_tags / pose_tags /
# default_bucket_weights stay dict. Order is preserved for readable diffs.

anatomy:
  # Tags that disqualify a full-body anatomy candidate.
  exclude_tags:
    - cropped
    - portrait
    - upper_body
    - cowboy_shot
    - multiple_girls
    - multiple_boys
    - text
    - watermark
    - lowres
  # Excludes tolerated when the bucket is specifically hand-focused.
  hand_focus_allowed_exclude_tags:
    - upper_body
    - cowboy_shot
  # Subject tag -> prompt phrase. Keys also drive SUBJECT_PROMPT_TAGS.
  subject_tags:
    "1girl": single anime girl
    "1boy": single anime boy
  # Pose tag -> prompt phrase.
  pose_tags:
    standing: standing
    walking: walking
    running: running
    sitting: sitting
    kneeling: kneeling
    dancing: dancing
    fighting_stance: fighting stance
    dynamic_pose: dynamic action pose
    action_pose: action pose
    jumping: jumping
    kicking: kicking
    high_kick: high kick
    squatting: squatting
    crouching: crouching
    all_fours: on all fours
    bent_over: bent over
    standing_on_one_leg: standing on one leg
    stretching: stretching
  hand_tags:
    - hands
    - hand
    - hand_up
    - outstretched_arm
    - arms_up
    - arms_behind_back
    - waving
    - holding
    - hand_focus
    - reaching
    - spread_fingers
    - open_hand
    - clenched_hand
    - clenched_hands
    - interlocked_fingers
    - finger_gun
    - peace_sign
    - v
    - salute
  # Subset of hand_tags that marks a hand-focused composition.
  hand_focus_bucket_tags:
    - hand_focus
    - spread_fingers
    - open_hand
    - clenched_hand
    - clenched_hands
    - interlocked_fingers
    - finger_gun
    - peace_sign
