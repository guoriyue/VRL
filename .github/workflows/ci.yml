name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"  # nightly: same targets, warm cache check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lock:
    name: Locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv.lock is the single dependency source; Bazel exports from it.
      - name: Verify lockfile
        run: uv lock --check

  bazel:
    name: Bazel lint, config and CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'uv.lock', 'third_party/countgd/requirements.txt') }}
          restore-keys: bazel-${{ runner.os }}-

      # Everything the default test suite covers: ruff, config lint, dead-flag
      # audit, per-package pytest lanes (`not e2e and not slow_test`), the local
      # Ray cluster lane and the torchrun launch check. GPU and real-weight lanes
      # are `manual`; they run on a GPU host with --config=gpu.
      - name: bazel test //...
        run: bazel test //... --test_output=errors

      - name: Entry points resolve from runfiles
        run: |
          bazel run //:vrl_train -- --help
          bazel run //:vrl_reward_service -- --help

  package:
    name: Build and install package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build package
        run: uv build

      - name: Rebuild wheel from source distribution
        run: |
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          uv build --wheel --out-dir "$RUNNER_TEMP/from-sdist" "$sdist"

      - name: Verify installed wheel outside the repository
        run: |
          uv sync --frozen
          wheel=$(find "$RUNNER_TEMP/from-sdist" -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .venv/bin/python --no-deps \
            --target "$RUNNER_TEMP/wheel-site" "$wheel"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-site" \
            "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from importlib import resources
          from importlib.metadata import distribution
          from pathlib import Path

          import vrl
          from vrl.config.loading import list_bundled_configs, load_config
          from vrl.models.families.registry import FAMILY_REGISTRY

          install_root = Path("wheel-site").resolve()
          module_path = Path(vrl.__file__).resolve()
          assert module_path.is_relative_to(install_root), module_path

          aesthetic_asset = resources.files("vrl.rewards.assets").joinpath(
              "aesthetic_predictor_v2_5.pth"
          )
          assert aesthetic_asset.is_file(), aesthetic_asset
          with aesthetic_asset.open("rb") as handle:
              assert handle.read(1), aesthetic_asset

          config_paths = list_bundled_configs()
          stale_prefixes = (
              "experiment/ar/",
              "experiment/diffusion/",
              "model/ar/",
              "model/diffusion/",
              "sampling/ar/",
          )
          assert not [path for path in config_paths if path.startswith(stale_prefixes)]

          cfg = load_config("experiment/sd3_5/online_grpo_ocr")
          assert cfg.trainer.entrypoint

          installed_files = {
              str(path) for path in distribution("visual-rl").files or ()
          }
          registry_paths = []
          for entry in FAMILY_REGISTRY.values():
              registry_paths.extend((entry.executor_cls, entry.gatherer_cls))
              for field_name in (
                  "model_cls",
                  "replay_cls",
                  "config_cls",
                  "config_builder",
                  "replay_runtime_builder",
              ):
                  value = getattr(entry.family_build, field_name, None)
                  if value:
                      registry_paths.append(value)
          for import_path in registry_paths:
              module = import_path.partition(":")[0]
              relative = module.replace(".", "/")
              assert (
                  f"{relative}.py" in installed_files
                  or f"{relative}/__init__.py" in installed_files
              ), import_path

          scripts = {
              entry.name: entry.value
              for entry in distribution("visual-rl").entry_points
              if entry.group == "console_scripts"
          }
          assert scripts["vrl-train"] == "vrl.scripts.train:main"
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-rl-dist
          path: dist/*
