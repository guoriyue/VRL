name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"  # nightly: full suite incl. slow_test (Ray) tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra cosmos
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable third_party

      # The vendored wrapper is installed after the frozen project sync because
      # it is a source-checkout asset, not published visual-rl metadata. Invoke
      # the environment directly so a second exact project sync cannot remove it.
      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Validate configs
        run: .venv/bin/python -m vrl.config.lint

      # Fast PR/push subset: excludes e2e (real weights) and slow_test (Ray spin-up).
      # GPU-marked tests skip on this CPU runner via tests/conftest.py.
      - name: Unit tests (fast subset)
        run: .venv/bin/pytest -m "not e2e and not slow_test" -q

  nightly:
    name: Full test suite (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only on schedule or manual dispatch — keeps PRs fast, runs slow_test nightly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lock
        run: |
          uv sync --frozen --extra dev --extra cosmos
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable third_party

      # The quality job already owns the fast suite. Nightly exercises only the
      # slow Ray lane so every scheduled minute adds coverage instead of rerunning
      # the same tests; e2e remains opt-in until a real-weight GPU lane exists.
      - name: Unit tests (slow lane)
        run: .venv/bin/pytest -m slow_test -q

  source-install:
    name: Source install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv installs the checked-out source as an editable project by default.
      # This is the supported repository contract; the repo is not yet a
      # standalone wheel because configs and vendored assets live beside vrl/.
      - name: Install source from lock
        run: |
          uv sync --frozen
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable third_party

      - name: Resolve quickstart config
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          import ltx_core
          import vrl
          from vrl.config import load_config

          repository = Path.cwd().resolve()
          source = Path(vrl.__file__).resolve()
          if not source.is_relative_to(repository):
              raise RuntimeError(f"visual-rl is not installed from this checkout: {source}")
          vendored_source = Path(ltx_core.__file__).resolve()
          if not vendored_source.is_relative_to(repository / "third_party"):
              raise RuntimeError(f"ltx_core is not installed from the vendored source: {vendored_source}")

          config = load_config("experiment/diffusion/sd3_5/online_grpo_ocr")
          if config.trainer.entrypoint != "vrl.scripts.diffusion.train:train_diffusion_grpo":
              raise RuntimeError("quickstart config resolved an unexpected trainer entrypoint")
          PY
