name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'review/**']
  schedule:
    - cron: "0 7 * * *"  # nightly: full suite incl. slow_test (Ray) tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lock:
    name: Locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile
        run: uv lock --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --frozen --only-group lint

      - name: Ruff lint
        run: uv run --no-sync ruff check .

  config:
    name: Config contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --frozen --group test --extra cosmos

      - name: Validate config contracts
        run: |
          uv run --no-sync python -m vrl.config.lint
          uv run --no-sync pytest tests/config -q

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: |
          uv sync --frozen --group test --extra cosmos
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable third_party

      # Fast PR/push subset: excludes e2e (real weights) and slow_test (Ray spin-up).
      # GPU-marked tests skip on this CPU runner via tests/conftest.py.
      - name: Unit tests (fast subset)
        run: uv run --no-sync pytest -m "not e2e and not slow_test" -q

  nightly:
    name: Full test suite (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only on schedule or manual dispatch — keeps PRs fast, runs slow_test nightly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: |
          uv sync --frozen --group test --extra cosmos
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --editable third_party

      # Full suite incl. slow_test (Ray) tests. e2e still opt-in (needs GPU + real
      # weights); gpu/distributed tests skip until dedicated lanes opt into them.
      - name: Unit tests (full)
        run: uv run --no-sync pytest -m "not e2e" -q

  package:
    name: Build and install package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build package
        run: uv build

      - name: Rebuild wheel from source distribution
        run: |
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          uv build --wheel --out-dir "$RUNNER_TEMP/from-sdist" "$sdist"

      - name: Verify installed wheel outside the repository
        run: |
          uv sync --frozen
          wheel=$(find "$RUNNER_TEMP/from-sdist" -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .venv/bin/python --no-deps \
            --target "$RUNNER_TEMP/wheel-site" "$wheel"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-site" \
            "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from importlib import resources
          from importlib.metadata import distribution
          from pathlib import Path

          import vrl
          from vrl.config.loading import list_bundled_configs, load_config
          from vrl.models.families.registry import FAMILY_REGISTRY

          install_root = Path("wheel-site").resolve()
          module_path = Path(vrl.__file__).resolve()
          assert module_path.is_relative_to(install_root), module_path

          aesthetic_asset = resources.files("vrl.rewards.assets").joinpath(
              "sac+logos+ava1-l14-linearMSE.pth"
          )
          assert aesthetic_asset.is_file(), aesthetic_asset
          with aesthetic_asset.open("rb") as handle:
              assert handle.read(1), aesthetic_asset

          config_paths = list_bundled_configs()
          stale_prefixes = (
              "experiment/ar/",
              "experiment/diffusion/",
              "model/ar/",
              "model/diffusion/",
              "sampling/ar/",
          )
          assert not [path for path in config_paths if path.startswith(stale_prefixes)]

          cfg = load_config("experiment/sd3_5/online_grpo_ocr")
          assert cfg.trainer.entrypoint

          installed_files = {
              str(path) for path in distribution("visual-rl").files or ()
          }
          registry_paths = []
          for entry in FAMILY_REGISTRY.values():
              registry_paths.extend((entry.executor_cls, entry.gatherer_cls))
              for field_name in (
                  "model_cls",
                  "replay_cls",
                  "config_cls",
                  "config_builder",
                  "replay_runtime_builder",
              ):
                  value = getattr(entry.family_build, field_name, None)
                  if value:
                      registry_paths.append(value)
          for import_path in registry_paths:
              module = import_path.partition(":")[0]
              relative = module.replace(".", "/")
              assert (
                  f"{relative}.py" in installed_files
                  or f"{relative}/__init__.py" in installed_files
              ), import_path

          scripts = {
              entry.name: entry.value
              for entry in distribution("visual-rl").entry_points
              if entry.group == "console_scripts"
          }
          assert scripts["vrl-train"] == "vrl.scripts.train:main"
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-rl-dist
          path: dist/*
