name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"  # nightly: full suite incl. slow_test (Ray) tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cosmos]"

      - name: Ruff lint
        run: ruff check .

      # Fast PR/push subset: excludes e2e (real weights) and slow_test (Ray spin-up).
      # GPU-marked tests skip on this CPU runner via tests/conftest.py.
      - name: Unit tests (fast subset)
        run: pytest -m "not e2e and not slow_test" -q

  nightly:
    name: Full test suite (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only on schedule or manual dispatch — keeps PRs fast, runs slow_test nightly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cosmos]"

      # Full suite incl. slow_test (Ray) tests. e2e still opt-in (needs GPU + real
      # weights); gpu/distributed tests skip until dedicated lanes opt into them.
      - name: Unit tests (full)
        run: pytest -m "not e2e" -q

  package:
    name: Build package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-rl-dist
          path: dist/*
