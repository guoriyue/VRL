# v5 of the structure / realism / detail judge against a GPT reference.
# Changes from qwen3vl32b_pairwise_detail_v4.yaml:
# - `composition` replaces `camera`. The user means composition as layered depth
#   and tension, not lens or vantage point: a foreground element framing or
#   overlapping the subject, a distinct midground and background, scale contrast,
#   diagonals and asymmetric balance. The v4 camera question (fisheye, extreme
#   angles) moved 0.344 -> 0.361 in 30 rounds because the policy never produces
#   those views, so it had nothing to rank.
# - fidelity extends the v4 anti-duplication clause to the pattern trained
#   policies drift into: one large subject ringed by smaller copies or icons
#   (collage / sticker-sheet layout). The composition question names the same
#   layout as a collage, so its scale-contrast term cannot reward it.
host: 127.0.0.1
port: 8318
model_name: vlm-preference-qwen3vl32b
model_version: Qwen/Qwen3-VL-32B-Instruct-FP8@4bf2c2f3
artifact_roots:
  - ../../../outputs
  - /mnt/nvme/outputs
  - /mnt/nvme/data/external
max_concurrency: 1
max_pending_requests: 256
max_cached_requests: 8192
max_request_bytes: 1073741824
generation_overlap_safe: true
worker_config:
  model_factory: vrl.rewards.models.qwen3vl_preference:Qwen3VLPreferenceRewardModel
  device: cuda:0
  judge_model: Qwen/Qwen3-VL-32B-Instruct-FP8
  judge_revision: 4bf2c2f3
  judge_max_side: 896
  questions_per_forward: 3  # five whole-image questions in one forward OOM at 896 px on 44 GiB
  local_files_only: true
  reference_key: judge_reference
  checklist_key: judge_checklist
  both_orders: true
  data_root: /mnt/nvme/data/external
  criteria:
    - name: structure
      weight: 2.0
      answer: compare
      question: >-
        Compare structural correctness: hands with five fingers, faces and bodies with
        normal proportions, objects with coherent geometry and perspective, legible text
        where text was requested, no merged, missing, extra or twisted parts.
    - name: natural
      weight: 2.0
      answer: compare
      question: >-
        Both images were made for the description "{prompt}". Compare how much each looks
        like a genuine work in the medium the description implies (a real photograph, an
        actual painting, a real drawing) made by a skilled human: believable light and
        shadow, natural materials, restrained color, the imperfections of the real medium;
        plastic smoothness, airbrushed skin, over-brightening, over-saturation, glow halos
        and a generic 3D-render or AI-illustration look count against an image.
    - name: fidelity
      weight: 1.5
      answer: compare
      question: >-
        Compare how faithfully each image realizes the description "{prompt}": the
        requested subject, action and setting all present, every style and mood
        qualifier respected, idioms read by their meaning (an "animal print" is a
        pattern, not the animal). When the description asks for one subject, showing
        it more than once counts against an image: copies, sticker sheets, character
        or turnaround sheets, tiled grids, and above all one large subject surrounded
        by several smaller versions of itself or small related icons scattered around
        it (a collage or sticker-sheet layout). Unrelated clutter also counts against.
    - name: composition
      weight: 1.0
      answer: compare
      question: >-
        Compare composition as one coherent scene: depth built from distinct layers (a
        foreground element that frames or overlaps the subject, the subject in the
        midground, a readable background of the setting behind it) and visual tension
        (strong diagonals, scale contrast between near and far, asymmetric balance, a
        subject placed off-center with purpose). A flat image where the subject sits
        alone in front of a plain or blurred backdrop, centered, with nothing in front
        of or around it counts against an image unless the description asks for that.
        A large subject with small copies, miniatures or decorative icons floating
        around it is a collage, not layering, and counts against an image. Judge only
        composition, not color, detail or realism.
    - name: elements
      weight: 1.5
      answer: yesno
      checklist: true
      question: >-
        Look at Image 1 only. Does it clearly and recognizably show {item}?
    - name: detail
      weight: 0.5
      answer: compare
      question: >-
        Compare the quality of fine detail across the two images: sharp, physically plausible and coherent texture that belongs to the depicted
        material (skin, fur, fabric, wood, stone, foliage, brushwork), crisp edges without
        halos. Dense or repetitive micro-pattern, mesh-like or bramble-like filler, noise,
        smearing and waxy smoothness all count against an image.
