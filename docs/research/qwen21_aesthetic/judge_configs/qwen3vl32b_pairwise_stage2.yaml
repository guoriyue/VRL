# Stage-2 variant of the pairwise judge: the same Qwen3-VL-32B service, with the
# criteria weighted toward structural correctness and rendering defects (the
# detail stage of the Seedream recipe) and the overall-appeal question kept at
# half weight so stage-1 gains are not traded away. Launch:
#
#   CUDA_VISIBLE_DEVICES=3 python -m vrl.rewards.service.server \
#     --config docs/research/qwen21_aesthetic/judge_configs/qwen3vl32b_pairwise_stage2.yaml
host: 127.0.0.1
port: 8318
model_name: vlm-preference-qwen3vl32b
model_version: Qwen/Qwen3-VL-32B-Instruct-FP8@4bf2c2f3
artifact_roots:
  - ../../../outputs
  - /mnt/nvme/outputs
max_concurrency: 1
max_pending_requests: 256
max_cached_requests: 8192
max_request_bytes: 1073741824
generation_overlap_safe: true
worker_config:
  model_factory: vrl.rewards.models.qwen3vl_preference:Qwen3VLPreferenceRewardModel
  device: cuda:0
  judge_model: Qwen/Qwen3-VL-32B-Instruct-FP8
  judge_revision: 4bf2c2f3
  judge_max_side: 1024
  local_files_only: true
  reference_key: judge_reference
  both_orders: true
  data_root: /mnt/nvme/data/external
  criteria:
    - name: overall
      weight: 0.5
      answer: yesno
      question: >-
        Is Image 1 better than Image 2 as a finished picture: more pleasing composition,
        more natural and well-controlled lighting, more harmonious colors without an
        exaggerated color cast or washed-out brightness, and more refined detail?
    - name: structure
      weight: 1.0
      answer: yesno
      question: >-
        Is Image 1 better than Image 2 in structural correctness: hands with five fingers,
        faces and bodies with normal proportions, objects with coherent geometry, and no
        merged, missing, extra or twisted limbs or parts?
    - name: clean
      weight: 1.0
      answer: yesno
      question: >-
        Is Image 1 freer than Image 2 of rendering defects such as noise or grain, smudges,
        garbled text, floating fragments, purposeless tangled wires or cables, and
        meaningless clutter that the description did not call for?
