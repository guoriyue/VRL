# GenEval prompt metadata plus external GenEval scorer.
data:
  manifest: datasets/geneval/train.jsonl
  eval_manifest: datasets/geneval/test.jsonl

reward:
  components:
    geneval: 1.0
  kwargs:
    geneval:
      evaluator: import_path
      import_path: ""
      timeout_s: 120.0
      artifact_dir: ${trainer.output_dir}/geneval_artifacts
      debug_dir: ${trainer.output_dir}/geneval_reward_debug
