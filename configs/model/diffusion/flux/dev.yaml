# FLUX.1-dev MMDiT (12B, guidance-distilled) — checkpoint, LoRA, compile, memory.
# Sampling shape and denoise defaults live under configs/sampling/.
model:
  family: flux
  executor:
    chunk_passthrough_keys: [text_ids]
  path: black-forest-labs/FLUX.1-dev

  memory:
    # Sliced/tiled VAE decode: the image VAE conv stack OOMs on batched decode
    # at scale (same scale gate as sd3_5); slicing decodes per-image.
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 16
    alpha: 32
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out

  torch_compile:
    enable: true
    mode: default
