# Wan 2.2 A14B I2V — two-stage MoE (high-noise transformer + low-noise transformer_2).
# Both experts are LoRA-trained; routing is deterministic by timestep (boundary_ratio
# from the checkpoint, ~0.9). Unlike Wan 2.1 I2V, the 2.2 transformer has image_dim=None
# (no CLIP image cross-attention), so the add_*_proj LoRA targets are dropped.
model:
  family: wan_2_1_i2v
  task_variant: i2v
  path: Wan-AI/Wan2.2-I2V-A14B-Diffusers
  reference_image: ""
  # 2x ~14B experts do not co-reside on one 32 GB card; sequential CPU offload is
  # the single-GPU path (per outputs/wan_i2v_spike). Multi-GPU sharding is the
  # production fix.
  enable_sequential_cpu_offload: true

  memory:
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    # 2.2 I2V has no image cross-attention (image_dim=None) — only self/text-cross
    # attention projections exist on both experts.
    target_modules:
      - to_k
      - to_out.0
      - to_q
      - to_v

  torch_compile:
    enable: false
    mode: default
