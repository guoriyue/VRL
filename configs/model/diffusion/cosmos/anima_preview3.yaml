# Anima Preview3 single-file Cosmos Predict2 Text2Image checkpoint.
# Replay/trainer loading needs only transformer_path. Full generation
# additionally loads text_encoder_path, vae_path, and the two local tokenizer
# directories below.
model:
  family: cosmos-predict2-anima
  path: /home/mingfeiguo/Desktop/anima-inference/models
  transformer_path: /home/mingfeiguo/Desktop/anima-inference/models/diffusion_models/anima-preview3-base.safetensors
  text_encoder_path: /home/mingfeiguo/Desktop/anima-inference/models/text_encoders/qwen_3_06b_base.safetensors
  vae_path: /home/mingfeiguo/Desktop/anima-inference/models/vae/qwen_image_vae.safetensors
  qwen_tokenizer_path: /home/mingfeiguo/Desktop/anima-inference/ComfyUI/comfy/text_encoders/qwen25_tokenizer
  t5_tokenizer_path: /home/mingfeiguo/Desktop/anima-inference/ComfyUI/comfy/text_encoders/t5_tokenizer
  scheduler_shift: 3.0

  use_lora: true
  lora:
    rank: 32
    alpha: 16
    path: ""
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out

  torch_compile:
    enable: false
    mode: default
