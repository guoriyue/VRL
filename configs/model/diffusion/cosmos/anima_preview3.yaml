# Anima Preview3 single-file Cosmos Predict2 Text2Image checkpoint.
# `model.path` is the Anima artifact source. It may be a Hugging Face repo id
# or a filesystem directory with diffusion_models/, text_encoders/, and vae/.
# Replay/trainer loading needs only the transformer checkpoint. Full generation
# additionally loads the Qwen text encoder, Qwen Image VAE, and the two explicit
# tokenizer sources below; it must not depend on a ComfyUI checkout.
model:
  family: cosmos-predict2-anima
  path: circlestone-labs/Anima
  transformer_path: ""
  text_encoder_path: ""
  vae_path: ""
  qwen_tokenizer_path: Qwen/Qwen2.5-0.5B
  t5_tokenizer_path: google-t5/t5-base
  scheduler_shift: 3.0

  use_lora: true
  lora:
    rank: 32
    alpha: 16
    path: ""
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out

  torch_compile:
    enable: false
    mode: default
