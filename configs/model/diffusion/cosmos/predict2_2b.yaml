# Cosmos Predict2 2B Video2World — checkpoint + compile only.
# Sampling shape and denoise defaults live under configs/sampling/.
# LoRA removed 2026-06-10: GRPO runs full-parameter fine-tuning
# (enable_full_finetune), sized for multi-GPU training.
model:
  family: cosmos-predict2
  path: nvidia/Cosmos-Predict2-2B-Video2World

  # Tiled VAE encode/decode: trades a little latency for peak memory, and is
  # the encode-path unlock for native 1280x704x93f on a single 32GB card.
  memory:
    vae_decode:
      tiling: true

  torch_compile:
    enable: false
    mode: default

  # Reference image for global Video2World conditioning. Empty string fails
  # fast in the trainer; zero-conditioning is not a valid training objective.
  # For per-sample conditioning, set cosmos.reference_mode=per_sample and put
  # reference_image in each JSONL manifest row.
  reference_image: ""
