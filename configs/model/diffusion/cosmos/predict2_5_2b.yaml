# Cosmos Predict2.5 2B PredictBase for DiffusionNFT RL.
#
# Full-parameter post-training (paper §4.2.2 regime) is the target; LoRA was
# removed 2026-06-10. NOTE: the current DiffusionNFT implementation still
# needs the LoRA default/previous adapter pair for its three-branch forward
# (enable_full_finetune raises), so this recipe cannot launch until the
# full-finetune NFT/GRPO path lands with multi-GPU training — prerequisites
# tracked in docs/sprints/SPRINT_multi_gpu_training.md.
model:
  family: cosmos-predict2.5
  path: nvidia/Cosmos-Predict2.5-2B
  revision: diffusers/base/post-trained
  skip_text_encoder: false

  torch_compile:
    enable: false
    mode: default
