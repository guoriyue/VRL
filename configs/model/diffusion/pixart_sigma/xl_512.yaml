# PixArt-Sigma XL-2 512-MS (epsilon DDPM DiT + SDXL KL-VAE) — checkpoint, LoRA.
# Non-flow family: pair with sampling.sde_type: ddim (the family rebuilds a
# DDIMScheduler from the shipped DPM-Solver beta config for RL log-probs).
model:
  family: pixart_sigma
  executor:
    max_sequence_length: 300
  path: PixArt-alpha/PixArt-Sigma-XL-2-512-MS

  use_lora: true
  lora:
    rank: 16
    alpha: 32
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0

  torch_compile:
    enable: false
    mode: default
