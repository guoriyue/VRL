# LlamaGen t2i_XL_stage1_256 — llama-style autoregressive image-token
# generator (FoundationVision). 775M GPT-XL, 16x16 token grid -> 256 px via
# the VQ-16 tokenizer; prompts conditioned through frozen flan-t5-xl features.
# Sampling defaults (image_token_num / image_size / guidance_scale /
# temperature / top_k / top_p) live in configs/sampling/ar/*.yaml.
model:
  family: llamagen
  path: peizesun/llamagen_t2i
  dtype: bfloat16

  # Checkpoint files inside `path` (HF repo or local dir) and the frozen text
  # encoder. Defaults match LlamaGenConfig; listed here for discoverability.
  gpt_ckpt: t2i_XL_stage1_256.pt
  vq_ckpt: vq_ds16_t2i.pt
  gpt_model: GPT-XL
  t5_path: google/flan-t5-xl

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    dropout: 0.0
    init: gaussian
    # The vendored LlamaGen GPT uses fused llama-style projection names.
    target_modules:
      - wqkv
      - wo
