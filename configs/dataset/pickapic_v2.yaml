# Pick-a-Pic v2 preference-pair dataset (HuggingFace).
# Used by Diffusion-DPO recipes.
data:
  loader: pickapic_preference
  source: huggingface
  dataset_name: yuvalkirstain/pickapic_v2
  cache_dir: ""
  split: train
  max_train_samples: null
  preprocessing:
    random_crop: false
    horizontal_flip: true
    resolution: 0                  # 0 → derive from sampling.height
  sampler:
    shuffle: true
    drop_last: true
    dataloader_num_workers: 4
