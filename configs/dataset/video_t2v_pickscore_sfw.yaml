# Source-backed text-to-video prompt manifest for video RL production runs.
# The prompt rows and provenance are imported from Flow-GRPO's PickScore SFW
# manifests. Wan T2V consumes prompt-only rows; no reference_image is required.
data:
  loader: prompt_manifest
  manifest: datasets/pickscore_sfw/train.txt
  eval_manifest: datasets/pickscore_sfw/test.txt
  source_report: datasets/pickscore_sfw/report.json
  task_type: text_to_video
  preprocessing:
    format: text
    target_text: none
    media_type: video
  sampler:
    type: random_without_replacement
