# Janus-Pro-R1 AR sampling preset: 384 px, 24x24 image-token grid.
sampling:
  image_token_num: 576
  image_size: 384
  cfg_weight: 5.0
  temperature: 0.9
  ar_scheduler_batch_size: null
  max_reflect_len: 80
  r1:
    final_image_policy: always_generate  # always_generate | use_selfcheck
    train_segments:
      initial_image: true
      selfcheck_text: false
      final_image: true
