# Reflective AR image-token sampling preset: 384 px, 24x24 image-token grid.
sampling:
  image_token_num: 576
  image_size: 384
  guidance_scale: 5.0
  temperature: 0.9
  ar_scheduler_batch_size: null
  max_reflect_len: 80
  r1:
    # final_image_policy is set once in rollout (configs/base/rollout/ar_r1.yaml);
    # the collector resolves it rollout-first, so it is not duplicated here.
    train_segments:
      initial_image: true
      selfcheck_text: false
      final_image: true
