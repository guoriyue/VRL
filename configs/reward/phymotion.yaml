# PhyMotion human-dynamics reward (OPTIONAL, external environment).
# PhyMotion recovers SMPL meshes and scores motion in MuJoCo on three axes:
# kinematic / contact / dynamic. The SMPL+MuJoCo stack is heavy and
# license-encumbered, so it is NOT a base VRL dependency. The upstream code is
# vendored at third_party/PhyMotion (submodule); set up its conda env per its
# README, then point phymotion_cmd at the bridge CLI. The command template must
# contain {video} and {output} slots and write a JSON of the axes to {output}.
distributed:
  resources:
    reward:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1
  reward:
    cpus_per_worker: 4.0
    placement_strategy: STRICT_PACK
    max_inflight_batches: 1

reward:
  components:
    phymotion: 1.0
  kwargs:
    phymotion:
      execution: pool
      reward_name: phymotion   # logical tag (request label)
      score_key: overall
      media_type: video
      artifact_format: mp4
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
      worker_config:
        # REQUIRED: external PhyMotion command (run in the PhyMotion env). Example:
        #   phymotion_cmd: "python vrl/scripts/eval/phymotion_score.py --video {video} --output {output}"
        phymotion_cmd: ""
        cwd: ""
        timeout_s: 1200
