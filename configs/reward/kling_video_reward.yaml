# Kling VideoReward for world-model RL.
distributed:
  resources:
    reward:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1
      # share_with_rollout is the placement decision; the release lifecycle
      # flags (release_before_reward_model / release_after_score /
      # release_after_collect) derive from it automatically in
      # resolve_distributed_resources and are no longer set here.
      share_with_rollout: true
  reward:
    cpus_per_worker: 4.0
    placement_strategy: STRICT_PACK
    max_inflight_batches: 1

reward:
  components:
    kling_video_reward: 1.0
  kwargs:
    kling_video_reward:
      inference_runtime: ray
      reward_name: KlingTeam/VideoReward@main
      score_key: overall_reward
      scheduling: sync
      media_type: video
      artifact_format: tensor
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
      worker_config:
        model_path: ""
        dtype: bfloat16
        local_files_only: true
