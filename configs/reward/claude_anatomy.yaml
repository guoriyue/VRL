# Rubric-driven Claude anatomy judge reward.
#
# Reuses claude_image_qa with the rubric markdown injected as the
# prompt template. To change scoring criteria, edit
# configs/reward/rubrics/anatomy_v1.md — no code change needed.
#
# Uses Haiku (cheaper) by default — Sonnet was overkill for the
# constrained rubric task and burned tokens 4x faster.
reward:
  components:
    claude_image_qa: 1.0
  kwargs:
    claude_image_qa:
      prompt_template_file: configs/reward/rubrics/anatomy_v1.md
      command:
        - claude
        - -p
        - --input-format
        - stream-json
        - --output-format
        - stream-json
        - --verbose
        - --model
        - haiku
        - --tools
        - ""
        - --no-session-persistence
      timeout_s: 300.0
      max_concurrency: 16
      # When the judge refuses or returns unparseable output, log the case
      # for manual review and assign this score. Default 0.0 → GRPO sees a
      # strong negative advantage on refused images so the policy learns
      # to avoid them. Override only if you've audited the log and confirmed
      # the refusals are false positives.
      refusal_score: 0.0
      refusal_log_dir: outputs/claude_anatomy_refusals
