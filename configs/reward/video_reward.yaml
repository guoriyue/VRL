# Video-level reward for world-model RL.
distributed:
  resources:
    reward:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1
      share_with_rollout: true
  reward:
    cpus_per_worker: 4.0
    placement_strategy: STRICT_PACK
    max_inflight_batches: 1
    release_after_score: true

reward:
  components:
    video_reward: 1.0
  kwargs:
    video_reward:
      inference_runtime: ray
      reward_name: cosmos_reason1
      score_key: overall_reward
      scheduling: sync
      media_type: video
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      timeout_s: 60.0
      debug_dir: ${trainer.output_dir}/reward_debug
      worker_config:
        scorer: import_path
        import_path: ${oc.env:VIDEO_REWARD_SCORER,""}
        model_path: ${oc.env:VIDEO_REWARD_MODEL_PATH,""}
        dtype: ${oc.env:VIDEO_REWARD_DTYPE,"bfloat16"}
        reward_model_version: ${oc.env:VIDEO_REWARD_MODEL_VERSION,"cosmos-reward-default"}
