# GenEval reward adapter. The actual evaluator must be provided by import path.
reward:
  components:
    geneval: 1.0
  kwargs:
    geneval:
      evaluator: import_path
      import_path: ""
      timeout_s: 120.0
      artifact_dir: ${trainer.output_dir}/geneval_artifacts
      debug_dir: ${trainer.output_dir}/geneval_reward_debug
