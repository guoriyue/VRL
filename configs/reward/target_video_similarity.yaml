# DEAD: pixel-L1 reward, RETIRED -- do not use in new recipes.
# This is `1 - 64x64 pixel L1`; its optimum is a blurred temporal mean, so RL
# collapses the world model into a mean predictor. The SPRINT S4 probe measures a
# discrimination gap of only ~4% (exact 0.994 vs blur/static/shuffle ~0.98). Use
# configs/reward/{target_dino_similarity,motion_dynamics}.yaml instead.
# See SPRINT_future_reward S1.
#
# (Kept for back-compat / probe reproduction only.) Reads target_video or
# target_image from rollout metadata, compares generated frames against target
# media using low-resolution RGB features, and returns: target_similarity /
# target_sequence_similarity / target_final_frame_similarity /
# target_temporal_similarity.
reward:
  components:
    target_video_similarity: 1.0
  kwargs:
    target_video_similarity:
      reward_name: target_video_similarity
      score_key: target_similarity
      worker_config:
        num_frames: 8
        feature_size: 64
        sequence_weight: 0.5
        final_weight: 0.3
        temporal_weight: 0.2
