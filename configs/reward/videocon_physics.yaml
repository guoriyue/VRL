# VideoCon-Physics reward (videophysics/videocon_physics, mPLUG-Owl-Video 7B).
# Custom architecture: model code is vendored under third_party/mplug_owl_video/.
# Scores Yes/No entailment for "Does the video follow physical commonsense?".
distributed:
  resources:
    reward:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1
      # Release lifecycle flags derive from share_with_rollout in
      # resolve_distributed_resources; only the placement decision lives here.
      share_with_rollout: true
  reward:
    cpus_per_worker: 4.0
    placement_strategy: STRICT_PACK
    max_inflight_batches: 1

reward:
  components:
    videocon_physics: 1.0
  kwargs:
    videocon_physics:
      inference_runtime: ray
      reward_name: videophysics/videocon_physics@main
      score_key: physical_commonsense
      scheduling: sync
      media_type: video
      artifact_format: mp4
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
      worker_config:
        model_path: ""
        dtype: bfloat16
        num_frames: 32
