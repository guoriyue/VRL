# Aesthetic reward with an NSFW safety penalty for image RL.
reward:
  components:
    aesthetic: 1.0
    nsfw_safety: 0.5
  kwargs:
    aesthetic:
      model_name: openai/clip-vit-large-patch14
    nsfw_safety:
      model_name: ${oc.env:NSFW_SAFETY_MODEL_NAME,"Falconsai/nsfw_image_detection"}
      classifier_device: ${oc.env:NSFW_SAFETY_DEVICE,"cpu"}
      threshold: 0.35
      penalty_scale: 1.0
      max_penalty: 1.0
      image_sample_count: 1
      aggregation: max
