# DINOv2 perceptual-anchor reward for Video2World (SPRINT_future_reward S3).
#
# Per-frame frozen-DINOv2 cosine plus an order-sensitive temporal term (cosine of
# consecutive-frame embedding deltas), comparing generated frames to target_video /
# target_image from metadata. Semantic features are invariant to the blur / temporal-mean
# collapse that makes pixel-L1 reward-hackable, so this is the drop-in successor to the
# retired target_video_similarity -- but only as a LOW-WEIGHT anchor (it still imitates a
# single recorded future). Local CPU/GPU; no separate reward GPU pool.
#
# These weights pass vrl.scripts.eval.future_reward_discrimination_probe (gap_ratio ~0.30,
# temporal-mean ~0.25 cosine below exact). A low temporal_weight FAILS the probe.
reward:
  components:
    target_dino_similarity: 1.0
  kwargs:
    target_dino_similarity:
      reward_name: target_dino_similarity
      score_key: target_dino_similarity
      worker_config:
        num_frames: 16
        sequence_weight: 0.4
        final_weight: 0.2
        temporal_weight: 0.4
