# Online continuous-token AR GRPO recipe.
defaults:
  - /base/algorithm/token_grpo
  - /base/actor
  - /base/rollout/ar_continuous
  - /base/distributed/ray_rollout_colocated_single_gpu
  - /base/rollout/orchestration/strict
  - /base/trainer


trainer:
  # All AR families dispatch to the shared AR GRPO recipe; the family
  # difference lives in the registry entry, not in a custom entrypoint.
  entrypoint: vrl.scripts.ar.train:train_ar_grpo
