# Wan 2.1 T2V family GRPO recipe: family dispatch + the rollout shape every
# T2V experiment shares. Per-run tuning (lr, KL, SDE type, compile) stays in
# the experiments — the three T2V runs genuinely differ there (ocr is
# flow_grpo-parity shaped, kling/physics are video-reward shaped).
defaults:
  - /recipe/online/diffusion_grpo

trainer:
  entrypoint: vrl.scripts.diffusion.wan_2_1.train:train_wan_2_1_grpo

rollout:
  n_samples_per_prompt: 8
  # Wan rolls out through its native denoise path; set by every wan experiment.
  denoise_mode: native
