# Optional PyTorch profiler overlay.
# Keep base experiments profiler-free by default; compose this file only for
# short diagnostic runs.
trainer:
  profile: true
  torch_profiler:
    enabled: true
    activities:
      - cpu
      - cuda
    record_shapes: true
    profile_memory: true
    with_stack: false
    with_flops: false
    skip_first: 0
    max_steps: 1

rollout:
  torch_profiler:
    enabled: true
    activities:
      # Rollout traces can explode during autoregressive generation. Keep the
      # default focused on CUDA kernels; use explicit overrides for CPU/memory
      # deep dives.
      - cuda
    record_shapes: false
    profile_memory: false
    with_stack: false
    with_flops: false
    skip_first: 0
    max_steps: 1
