distributed:
  backend: ray
  resources:
    visible_devices: auto
    cross_node: true
    trainer:
      num_gpus: 1
    rollout:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1
    allow_overlap: false

  rollout:
    cpus_per_worker: 4.0
    placement_strategy: SPREAD
    max_inflight_chunks_per_worker: 1
    sync_trainable_state: lora_only
    release_after_collect: false
