# Single-GPU colocated Ray rollout preset for workstation validation runs.
#
# COLOCATED = trainer + rollout (+ a shared reward) live on the SAME GPU and
# TIME-SHARE it in turn (never at the same instant):
#     collect (rollout generates) -> train (backward) -> weight sync -> repeat.
#
# This preset uses `allow_overlap: true` (the `auto` rollout pool): on a 1-GPU box
# trainer and rollout both land on GPU 0 (colocated); on a box WITH a spare GPU,
# `auto` prefers the spare (disaggregated). To FORCE colocation regardless of spares,
# or to make the rollout resident, use the per-role `gpu_pool` grammar (mirrors
# reward.gpu_pool) — see SPRINT_gpu_pool_grammar_unification.md:
#
#   distributed:
#     resources:
#       rollout:
#         gpu_pool: trainer        # borrow the trainer GPU = colocated (no allow_overlap needed)
#         memory_fraction: 0.4     # optional: resident worker capped at 40%; omit = on-demand
#
# on_demand vs persistent are DERIVED, not literal keys:
#   on_demand (no memory_fraction): between phases the rollout worker is released and
#     the trainer model offloads to CPU during collect, so each phase owns ~the whole
#     GPU and NO memory split is needed. Cost: the worker reloads the model each cycle.
#   persistent/resident (memory_fraction set): the worker STAYS on the GPU (no reload)
#     but shares memory with the trainer, so memory_fraction caps its share.
# Rule of thumb: keep on_demand; go resident only if the per-cycle reload is too slow.
distributed:
  resources:
    visible_devices: auto
    trainer:
      num_gpus: 1
    rollout:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1
    # auto pool: colocate on the trainer GPU when there's no spare (single-GPU box),
    # else take the spare. Set rollout.gpu_pool: trainer to force colocation.
    allow_overlap: true

  rollout:
    cpus_per_worker: 4.0
    max_inflight_chunks_per_worker: 1
    # Chunk->worker binding: round_robin binds at plan time; dynamic binds at
    # dispatch time (pull + LPT by estimated cost). Equivalent for 1 worker.
    chunk_placement_strategy: round_robin
    sync_trainable_state: true
