# Trainer lifecycle / IO.
#
# Only experiment decisions live here: required keys are declared ??? and the
# repo-wide total_epochs value. Infra-knob defaults (save_freq, log_freq, seed,
# profile, resume_*, debug, precision_drift_guard) live on the dataclasses in
# vrl/trainers/core/types.py — base YAML must not restate them.
#
# Profiling is off in the baseline. To profile a run, compose the
# /profile/torch_profiler preset — all torch_profiler tuning keys live
# there, not here (code defaults in vrl/utils/profiling.py otherwise).
#
# trainer.rollout_orchestration is supplied by the /base/rollout/orchestration
# defaults group (strict by default; override with
# /base/rollout/orchestration=continuous).
trainer:
  entrypoint: ???
  total_epochs: 10000
  output_dir: ???
