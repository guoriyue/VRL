# Trainer lifecycle / IO / debug
trainer:
  entrypoint: ???
  total_epochs: 10000
  save_freq: 50
  log_freq: 1
  output_dir: ???
  seed: 0
  profile: false
  torch_profiler:
    enabled: false
    output_dir: ""
    activities:
      - cpu
      - cuda
    record_shapes: true
    profile_memory: true
    with_stack: false
    with_flops: false
    skip_first: 0
    max_steps: 1
  resume_from: ""
  resume_strict: true

  debug:
    first_step: false
    grad_split: false

  precision_drift_guard:
    mode: auto
    max_batches: 1
    max_timestep_checks: 3
    max_abs_log_ratio: 0.001
    max_ratio_abs_dev: 0.001
    fail_on_nonfinite: true

# trainer.rollout_orchestration is supplied by the /base/rollout/orchestration
# defaults group (strict by default; override with
# /base/rollout/orchestration=continuous).
