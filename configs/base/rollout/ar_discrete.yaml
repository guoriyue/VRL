# AR discrete-token rollout — Janus-Pro categorical image-token sampling.
# Sampling shape (image_token_num / image_size / guidance_scale) lives in
# configs/sampling/ar/* so it travels with the resolution preset.
rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 8
  temperature: 1.0
  max_text_length: 256
