# Janus-Pro-1B OCR GRPO — AR image RL scored by rapidocr edit-distance.
defaults:
  - /recipe/online/ar_discrete_token_grpo
  - /model/ar/janus_pro/1b
  - /sampling/ar/discrete_image_384_576tok
  - /reward/ocr
  - /dataset/ocr

algorithm:
  eps_clip: 0.2
  init_kl_coef: 0.01
  kl_estimator: k2

actor:
  optim:
    lr: 1.0e-4

trainer:
  entrypoint: vrl.scripts.ar.janus_pro.train:train_janus_pro_ocr_grpo
  output_dir: outputs/janus_pro_1b_ocr_grpo
  debug:
    first_step: false
