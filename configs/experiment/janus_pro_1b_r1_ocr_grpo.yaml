# Janus-Pro-1B + Janus-Pro-R1-style OCR GRPO mechanism-level run.
defaults:
  - /base/algorithm/token_grpo_multisegment
  - /base/actor
  - /base/rollout/ar_r1
  - /base/distributed/ray_rollout_single_gpu
  - /base/trainer
  - /model/janus_pro/1b
  - /sampling/janus_r1_384_576tok

reward:
  components:
    ocr: 1.0
  kwargs:
    ocr:
      debug_dir: ""

data:
  manifest: datasets/ocr/train.txt

actor:
  optim:
    lr: 1.0e-4

trainer:
  entrypoint: vrl.scripts.janus_pro.train:train_janus_pro_r1_ocr_grpo
  output_dir: outputs/janus_pro_1b_r1_ocr_grpo
  total_epochs: 80
  save_freq: 10
  debug:
    # Multi-segment old log-probs are kept per segment; the legacy first-step
    # scalar parity check is for single-trajectory token GRPO only.
    first_step: false

rollout:
  n_samples_per_prompt: 2
  rollout_batch_size: 1

eval:
  fixed:
    enabled: true
    interval_epochs: 40
    output_dir: ${trainer.output_dir}/fixed_eval
    prompts:
      - A clean white sign with large black text that reads "JANUS R1".
      - A storefront window sticker that clearly says "OPEN 24".
      - A red book cover with the title "TOKEN RL".
      - A blue street sign that reads "MARS AVE".
      - A coffee cup label with the word "LATTE".
      - A museum placard that reads "ART 2026".
      - A classroom poster with the text "READ MORE".
      - A shipping box label that clearly says "FRAGILE".
