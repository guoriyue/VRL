# Wan 2.1 1.3B T2V + production video reward GRPO on motion-grounded prompts.
# reward.kwargs.kling_video_reward.reward_name is the Hugging Face model id.
# Set worker_config.model_path to use a local checkpoint instead of downloading.
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/wan_2_1/1_3b
  - /sampling/video/240p_33f
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/kling_video_reward
  - /dataset/videophy

actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1

algorithm:
  kl_coef: 0.004

rollout:
  n_samples_per_prompt: 8
  rollout_batch_size: 1
  sample_batch_size: 8   # sbs=4 GPM still leaves SM occupancy at ~18%; keep one prompt per reward request.
  denoise_compile:
    enable: true
    mode: default
  denoise_mode: native
  noise_level: 0.7
  sde:
    type: cps

trainer:
  entrypoint: vrl.scripts.diffusion.wan_2_1.train:train_wan_2_1_grpo
  output_dir: outputs/wan_1_3b_kling_video_reward
  save_freq: 20

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

production:
  kling_video_reward:
    enabled: true
    report_path: outputs/wan_video_production_report.md
