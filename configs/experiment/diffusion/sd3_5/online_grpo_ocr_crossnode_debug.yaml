# SD 3.5 + OCR GRPO - cross-node continuous debug recipe.
#
# Purpose: bring the change-verify cycle from ~60 min down to <= 5 min for
# orchestration-class changes. Keeps the full Ray cross-node code path
# (SPREAD placement, real trainer + rollout actors) but shrinks the per-step
# cost so a 3-epoch run finishes in ~5 min including warmup.
#
# Usage:
#   RAY_ADDRESS=<head>:6379 CUDA_VISIBLE_DEVICES=0 vrl-train \
#     --config experiment/diffusion/sd3_5/online_grpo_ocr_crossnode_debug \
#     trainer.rollout_orchestration.continuous.max_stale_policy_versions=1
#
# See SPRINT_continuous_rollout_debug_harness.md for gate definitions.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/sd3_5/medium
  - /sampling/image/512           # overridden below to 128x128
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/ocr
  - /dataset/ocr
  - /base/distributed/ray_rollout_cross_node
  - /base/rollout/orchestration/continuous

precision: bf16

sampling:
  height: 128
  width: 128
  # 4 denoise steps (was 10/28) - 2.5-7x denoise cost reduction.
  num_steps: 4

rollout:
  # 2 images per group, 2 groups per step - 16x fewer pixels vs. baseline.
  n: 2
  rollout_batch_size: 2
  sample_batch_size: 2

actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 1

algorithm:
  init_kl_coef: 0.04
  global_std: true

trainer:
  entrypoint: vrl.scripts.diffusion.sd3_5.train:train_sd3_5_grpo
  output_dir: outputs/sd3_5_ocr_grpo_crossnode_debug
  total_epochs: 3
  save_freq: 9999    # no checkpoints during debug runs
  profile: true
  debug:
    first_step: true

  rollout_orchestration:
    continuous:
      # Allow up to 4 groups in flight so the rollout actor stays busy across
      # multiple steps. Raise max_stale_policy_versions=1 at launch time to
      # enable real overlap (default 0 = behavior-equivalent to on-policy).
      max_inflight_groups: 4
      max_ready_groups: 16
      max_stale_policy_versions: 0

eval:
  enable: false
