# SD 3.5 Medium + GenEval GRPO.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/sd3_5/medium
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/geneval
  - /reward/geneval

precision: bf16

sampling:
  max_sequence_length: 128

actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

algorithm:
  init_kl_coef: 0.04
  global_std: true

rollout:
  n: 8
  rollout_batch_size: 8
  sample_batch_size: 8

eval:
  enable: true
  freq: 60
  manifest: datasets/geneval/test.jsonl
  max_prompts: 16
  num_steps: 40
  sample_batch_size: 8
  noise_level: 0.0
  seed: 20260504
  use_ema: true

trainer:
  entrypoint: vrl.scripts.diffusion.sd3_5.train:train_sd3_5_grpo
  output_dir: outputs/sd3_5_geneval_grpo
  save_freq: 60
  debug:
    first_step: true

model:
  torch_compile:
    enable: false
