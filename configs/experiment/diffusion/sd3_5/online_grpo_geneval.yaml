# SD 3.5 Medium + GenEval GRPO.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/sd3_5/medium
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/geneval
  - /reward/geneval

precision: bf16

sampling:
  max_sequence_length: 128

actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

algorithm:
  kl_coef: 0.04
  global_std: true

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  sample_batch_size: 16

trainer:
  entrypoint: vrl.scripts.diffusion.sd3_5.train:train_sd3_5_grpo
  output_dir: outputs/sd3_5_geneval_grpo
  save_freq: 60
  debug:
    first_step: true

model:
  torch_compile:
    enable: true   # launch-bound profile (P0 trace): elementwise 47%, 1M kernels/step
