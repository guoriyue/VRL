# Anima Preview3 + anatomy GRPO.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/cosmos/anima_preview3
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/anime_anatomy_structure
  - /dataset/anime_anatomy

sampling:
  max_sequence_length: 128

actor:
  optim:
    lr: 5.0e-5
  ema:
    enable: false
  ppo_epochs: 1
  gradient_accumulation_steps: 4

algorithm:
  init_kl_coef: 0.0

rollout:
  n: 8
  rollout_batch_size: 8
  sample_batch_size: 8
  sde:
    type: sde

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_anima_grpo
  output_dir: outputs/anima_preview3_anatomy_grpo
  save_freq: 100
  log_freq: 1
