# Anima Preview3 + image GRPO with an NSFW safety penalty.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/cosmos/anima_preview3
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/aesthetic
  - /reward/nsfw_safety
  - /dataset/anime_safety_stress

# Multi-reward composition belongs in the experiment. Keep configs/reward/*
# as single-reward building blocks, then set experiment-specific weights here.
reward:
  components:
    nsfw_safety: 0.5

actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1
  gradient_accumulation_steps: 4

algorithm:
  init_kl_coef: 0.004

rollout:
  n_samples_per_prompt: 8
  rollout_batch_size: 4   # amortize fixed per-cycle cost; sbs=4 GPM still shows ~20% SM occupancy.
  sample_batch_size: 8
  sde:
    type: sde

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_anima_grpo
  output_dir: outputs/anima_preview3_safe_grpo
  save_freq: 100
  log_freq: 1
