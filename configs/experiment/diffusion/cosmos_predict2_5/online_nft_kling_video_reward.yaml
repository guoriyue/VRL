# Cosmos Predict2.5 2B + DiffusionNFT + video reward on motion-grounded prompts.
# Keep this out of README as a recommended recipe until real training proves
# non-flat reward, global_step > 0, generated artifacts, and changed LoRA weights.
defaults:
  - /recipe/online/diffusion_nft
  - /model/diffusion/cosmos/predict2_5_2b
  - /sampling/video/512p_93f
  - /sampling/denoise/10_step_no_cfg
  - /reward/kling_video_reward
  - /dataset/videophy

actor:
  optim:
    lr: 3.0e-4
  ppo_epochs: 1
  gradient_accumulation_steps: 1
  timestep_fraction: 0.99
  ema:
    enable: true
    decay: 0.9
    update_interval: 1

rollout:
  n: 2
  rollout_batch_size: 1
  sample_batch_size: 1
  noise_level: 0.7
  sde:
    type: cps
  same_latent: false

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict25_diffusion_nft
  output_dir: outputs/cosmos_predict2_5_2b_diffusionnft
  total_epochs: 1
  save_freq: 20
  log_freq: 1

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

production:
  kling_video_reward:
    enabled: true
    report_path: outputs/cosmos_world_model_production_report.md

eval:
  prompts_file: datasets/videophy/eval.txt
  seeds: 1
