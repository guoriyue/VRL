# Cosmos Predict2.5 2B + DiffusionNFT + Kling video reward.
# Hyperparameters track cosmos-rl's cosmos-predict2-5-2b-720-nft.toml; vrl's
# DiffusionNFT/actor defaults already match it except for the fields set below.
defaults:
  - /recipe/online/diffusion_nft
  - /model/diffusion/cosmos/predict2_5_2b
  - /sampling/video/512p_93f
  - /sampling/denoise/10_step_no_cfg
  - /reward/kling_video_reward
  - /dataset/videophy

precision: bf16

actor:
  optim:
    lr: 3.0e-4
  ppo_epochs: 1
  gradient_accumulation_steps: 1
  timestep_fraction: 0.99
  ema:
    enable: true
    decay: 0.9
    update_interval: 1

rollout:
  n_samples_per_prompt: 12                     # advantage group size; the n samples are forwarded
                            # together, so this is the main single-GPU memory knob
  rollout_batch_size: 6     # prompts/step (cosmos-rl mini_batch)
  sample_batch_size: 1
  noise_level: 0.7
  sde:
    type: cps
  same_latent: false

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict25_diffusion_nft
  output_dir: outputs/cosmos_predict2_5_2b_diffusionnft
  total_epochs: 10
  save_freq: 5
  log_freq: 1

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

production:
  kling_video_reward:
    enabled: true
    report_path: outputs/cosmos_world_model_production_report.md

