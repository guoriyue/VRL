# DiffusionNFT correctness-validation run on FLUX (ported interface, Phase B).
#
# DiffusionNFT is likelihood-free forward-process RL: no log-prob, no ratio. It
# softly splits samples into positive/negative sets by optimality and regresses
# reward-weighted flow-matching MSE, using a frozen previous-policy adapter
# (SPRINT_diffusion_nft_validation). The NFT model interface was cosmos-only;
# Phase A ported it to FLUX (diffusion_nft_prepare_transformer_input +
# previous-policy adapter + sync), exercised by tests/models/diffusion/flux/
# test_diffusion_nft_interface.py. This is Phase B: the learning validation.
#
# NFT-specific correctness judgements (highest signal first):
#   1. lr=0 advantage-flip invariant (debug.first_step) — separates "weak signal"
#      from "garbage signal" (previous adapter not synced / scheduler drift),
#   2. negative-branch ablation collapse — drop the negative branch and reward
#      should fail to rise (the paper's cleanest self-check), and
#   3. fixed-eval reward rises in the right direction.
#
# Reward = pickscore, NOT the sprint's first-choice geneval (geneval is not
# runnable here — see online_flow_dppo_pickscore_validation.yaml header).
# pickscore is a legitimate single-reward NFT task in its own right and all-local.
#
# Short-probe run (the chosen validation depth):
#   CUDA_VISIBLE_DEVICES=0 vrl-train \
#     --config experiment/diffusion/flux/online_diffusion_nft_pickscore_validation \
#     trainer.total_epochs=30 trainer.eval.freq=5 trainer.save_freq=9999
# Negative-branch ablation control: set algorithm.nft_beta very small or run the
# paired ablation (the negative branch should be what makes reward rise).
defaults:
  - /recipe/online/diffusion_nft       # strict on-policy (NFT requires max_stale=0) + colocated
  - /model/diffusion/flux/dev
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/pickscore          # geneval fallback (all-local CLIP-H + PickScore_v1)
  - /dataset/pickscore_sfw
  - _self_

precision: bf16
sampling: { height: 256, width: 256, num_steps: 10, max_sequence_length: 64 }

actor:
  optim: { lr: 1.0e-4 }        # LoRA; cosmos NFT measured 1e-4 (paper full-param is 3e-5)
  gradient_checkpointing: true

algorithm:                     # cosmos-RL DiffusionNFT parity knobs (base/algorithm/diffusion_nft)
  nft_beta: 1.0
  advantage_scale: 5.0
  kl_coef: 1.0
  weight_copy_decay: 0.0
  global_std: false

rollout:
  n_samples_per_prompt: 16     # paper uses 24; 16 = single-GPU floor
  rollout_batch_size: 8
  sample_batch_size: 1
  noise_level: 0.7
  sde: { window_range: [0, 10] }

trainer:
  entrypoint: vrl.scripts.diffusion.flux.train:train_flux_diffusion_nft
  output_dir: outputs/flux_diffusion_nft_pickscore_validation
  total_epochs: 256            # paper trains 256 updates
  save_freq: 32
  debug: { first_step: true }  # the NFT lr=0 advantage-flip invariant
  eval: { enabled: true, freq: 32, samples_per_prompt: 2, max_prompts: 32, seed: 20260621 }

model: { torch_compile: { enable: false } }
