# Cosmos Predict2 2B Video2World + GRPO — FULL-PARAMETER on a single 32GB card.
#
# WHY full-param: project_first_trustworthy_curve diagnosed LoRA gradients as too small
# (~2e-4) for the reward to move; full-param gives the larger gradient the diagnosis calls
# for. The blocker was memory: fp32 Adam state for a 2B DiT is ~16GB and OOMs a 32GB card.
#
# How it fits now: actor.optim.optim_8bit=true (bitsandbytes AdamW8bit) cuts Adam state
# ~8->2 bytes/param. 8-bit quantizes the OPTIMIZER STATE, not the forward, so old_log_prob
# and rollout/replay logprobs are unchanged — safe on the RL policy path (verified the
# AdamW8bit path on RTX 5090 sm_120). Two memory levers stack:
#   - optim_8bit: true     -> ~16GB fp32 Adam state -> ~4GB int8
#   - 240p_33f video       -> activations are the OTHER big term; even with 8-bit Adam,
#                             512p_93f peaks ~31.8GB (LoRA rollout). 240p/33f is ~13% of
#                             that token count, which is what leaves room for full-param
#                             backward + grads on 32GB.
#   - gradient_checkpointing: true
#
# REQUIRES Video2World conditioning (reference image). Run one of:
#   global:     ... model.reference_image=/path/to/reference.png
#   per-sample: ... cosmos.reference_mode=per_sample  (JSONL rows with reference_image)
#
# MEMORY SMOKE FIRST (confirm full-param 240p_33f fits before the long curve):
#   CUDA_VISIBLE_DEVICES=0 vrl-train \
#     --config experiment/diffusion/cosmos_predict2/online_grpo_fullparam_8bit_240p \
#     model.reference_image=/path/to/ref.png \
#     trainer.total_epochs=2 trainer.eval.enabled=false trainer.save_freq=9999
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/240p_33f          # smallest video shape — keeps full-param activations on 32GB
  - /sampling/denoise/35_step_cfg_7
  - /reward/kling_video_reward        # local HF model, no API key
  - /dataset/drawbench_train_192

model:
  use_lora: false                     # FULL-PARAMETER (-> apply_full_finetune in the runtime builder)

actor:
  optim:
    lr: 2.0e-5                         # full-param wants a lower LR than LoRA's 1e-4 (paper §4.2.2 ~1e-5)
    optim_8bit: true                  # the enabler: int8 Adam state -> full-param 2B fits on 32GB
  gradient_checkpointing: true
  ppo_epochs: 4                       # engages the trust-region clip (1 -> clip_fraction==0, flat curve)

algorithm:
  clip_ratio: 1.0e-3
  kl_coef: 0.0

rollout:
  n_samples_per_prompt: 8
  rollout_batch_size: 1
  sample_batch_size: 1
  sde: { type: cps }
  same_latent: false

cosmos:
  reference_mode: global              # global | per_sample (see header)

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_pred2_2b_fullparam_8bit_240p
  total_epochs: 300
  save_freq: 50
  debug: { first_step: true }
  eval: { enabled: true, freq: 25, samples_per_prompt: 2, max_prompts: 32, seed: 20260621 }
