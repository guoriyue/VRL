# Cosmos Predict2 2B Video2World + GRPO on public full LeRobot DROID target clips.
#
# This is the non-smoke DROID recipe. Build the dataset with (the action path now
# also emits metadata['target_actions'] for the IDM reward -- SPRINT_future_reward S2):
#   python -m vrl.scripts.data.setup video-world-targets --repo-id lerobot/droid_1.0.1 --name droid_full_targets --limit 1000 --eval-limit 64 --camera observation.images.exterior_1_left
#
# Reward = a ZERO-TRAINING runnable DEFAULT: DINOv2 perceptual anchor + RAFT motion guard
# (both pretrained, both pass the SPRINT_future_reward S4 probe). Retired pixel-L1
# target_video_similarity (SPRINT S1). NOT a committed training reward -- compose any
# /reward/* building block per experiment. Instruction-grounded action-following is
# designed in SPRINT_future_reward S3 (an inverse-dynamics reward) but not shipped.
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/240p_33f
  - /sampling/denoise/35_step_cfg_7
  - /reward/target_dino_similarity
  - /reward/motion_dynamics
  - /dataset/droid_full_target_v2w

model:
  use_lora: false

actor:
  optim:
    lr: 2.0e-5
    optim_8bit: true
  gradient_checkpointing: true
  ppo_epochs: 4

algorithm:
  clip_ratio: 1.0e-3
  kl_coef: 0.0

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 1
  samples_per_chunk: 4
  sde: { type: cps }
  same_latent: false

distributed:
  rollout:
    # Single-worker software pipeline: hide each chunk's GPU->CPU copy + host packing
    # behind the next chunk's denoise (bit-exact -> old_log_prob unchanged, RL-safe;
    # auto no-op on >1 worker). Needs >=2 chunks: n_samples=8 / samples_per_chunk=4
    # gives exactly 2 (the sweet spot). ~20% single-card rollout speedup. NOTE: this is
    # distributed.rollout.pipelined (the Ray worker config), NOT the top-level rollout.
    pipelined: true

cosmos:
  reference_mode: per_sample

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_pred2_droid_full_target_240p
  total_epochs: 300
  save_freq: 50
  debug: { first_step: true }
  eval: { enabled: true, freq: 25, samples_per_prompt: 2, max_prompts: 64, seed: 20260628 }

reward:
  # Zero-training default: DINOv2 anchor (main here) + RAFT motion guard. With idm absent,
  # dino carries the signal -- the weaker "imitate one recording" regime (SPRINT S6), fine
  # for a baseline curve. Override per experiment (this is a default, not a commitment).
  components:
    target_dino_similarity: 1.0
    motion_dynamics: 0.2
