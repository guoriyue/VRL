# Cosmos Predict2 2B Video2World + GRPO — FULL-PARAMETER, per-sample robotic
# reference images, on a single 32GB card.
#
# WHY this config exists: SPRINT_cosmos_predict2_2b_trustworthy_curve §3.5 flagged that
# the "real reference image" path (per_sample, matching first-frame + caption from robot
# data) had no full-param variant — online_grpo_v2w_reference.yaml is LoRA + 704p_93f,
# whose activations do not fit full-param on 32GB and which contradicts the full-param 240p
# thesis. This is that missing variant: it stacks the trustworthy-curve fix set onto the
# robotic per_sample data so the run is BOTH on-domain (robot first-frame conditions a
# robot-task prompt) and memory-feasible for full-parameter training.
#
# Memory levers (same as online_grpo_fullparam_8bit_240p):
#   - use_lora: false + optim_8bit  -> full-param 2B fits (int8 Adam state ~4GB vs fp32 ~16GB)
#   - 240p_33f                       -> activations are the other big term; 704p_93f peaks
#                                       ~31.8GB even for LoRA rollout, so full-param needs the
#                                       small shape (240p/33f is ~13% of that token count)
#   - gradient_checkpointing: true
#
# Reference conditioning: per_sample. Each JSONL row in the video_world_v2w manifest carries
# its own reference_image (droid first frame) paired with the matching task prompt, so the
# conditioning frame and the prompt agree — unlike global mode's fixed-frame + unrelated prompt.
#
# DATA NOTE: data/external/video_world/manifests/robot_train.jsonl currently ships SMOKE-sized
# (few rows). That is enough to validate the loop and measure SM occupancy / throughput, but a
# trustworthy learning curve needs the manifest scaled up first (video-world-bridge --limit N).
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/240p_33f          # smallest video shape — keeps full-param activations on 32GB
  - /sampling/denoise/35_step_cfg_7
  - /reward/kling_video_reward        # local HF model (KlingTeam/VideoReward), no API key
  - /dataset/video_world_v2w          # per-sample robot first-frame + matching prompt

model:
  use_lora: false                     # FULL-PARAMETER (-> apply_full_finetune in the runtime builder)

actor:
  optim:
    lr: 2.0e-5                         # full-param wants a lower LR than LoRA's 1e-4 (paper §4.2.2 ~1e-5)
    optim_8bit: true                  # the enabler: int8 Adam state -> full-param 2B fits on 32GB
  gradient_checkpointing: true
  ppo_epochs: 4                       # engages the trust-region clip (1 -> clip_fraction==0, flat curve)

algorithm:
  clip_ratio: 1.0e-3
  kl_coef: 0.0

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 1
  samples_per_chunk: 1
  sde: { type: cps }
  same_latent: false

cosmos:
  reference_mode: per_sample          # robot first-frame per row (see header); not global fixed-frame

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_pred2_2b_v2w_fullparam_8bit_240p
  total_epochs: 300
  save_freq: 50
  debug: { first_step: true }
  eval: { enabled: true, freq: 25, samples_per_prompt: 2, max_prompts: 32, seed: 20260621 }

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4
