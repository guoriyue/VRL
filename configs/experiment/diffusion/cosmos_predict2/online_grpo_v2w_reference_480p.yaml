# Cosmos Predict2 2B Video2World + GRPO at the native 480P variant (832x480, 93 frames).
#
# WHY: the cached default checkpoint is the 720P variant, which generates GARBAGE below
# 704p (verified 2026-06-27: 240p/480p with the 720p weights collapse to rainbow noise —
# OOD resolution). The 480P weights ship only in NVIDIA native .pt format; they were
# converted to diffusers and saved under model.path below. At its NATIVE clip length
# (93 frames) the 480P checkpoint generates COHERENT video; 480p_33f still showed
# artifacts (frame count OOD), so keep num_frames=93.
#
# Rollout cost: 480p_93f is ~2.25x fewer tokens than 704p_93f (52x30 vs 80x44 tok/frame,
# same 12 latent frames) -> proportionally cheaper rollout, coherent. Stack denoise-step
# and CFG reductions (20_step_cfg_5_0 / 20_step_no_cfg) for more.
#
# Reproduce the converted checkpoint: download model-480p-16fps.pt from
# nvidia/Cosmos-Predict2-2B-Video2World and run the diffusers cosmos converter
# (transformer_type=Cosmos-2.0-Diffusion-2B-Video2World), reusing the 720p
# vae/text_encoder/tokenizer/scheduler. 567/567 transformer keys map exactly.
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/480p_33f          # bucket gives 832x480; num_frames overridden to native 93 below
  - /sampling/denoise/35_step_cfg_7
  - /reward/kling_video_reward
  - /dataset/video_world_v2w

model:
  # Converted native-480p transformer + shared 720p vae/text_encoder/tokenizer (see header).
  path: /home/mingfeiguo/Desktop/vrl2/VRL/checkpoints/cosmos_predict2_2b_v2w_480p_diffusers

sampling:
  num_frames: 93                      # native clip length — 33f is OOD for the 480P weights (artifacts)
  fps: 16

actor:
  optim: { lr: 1.0e-4 }
  ppo_epochs: 1

algorithm:
  clip_ratio: 1.0e-3
  kl_coef: 0.0

cosmos:
  reference_mode: per_sample

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 1
  samples_per_chunk: 1
  sde: { type: cps }
  same_latent: false

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_pred2_2b_v2w_480p
  total_epochs: 300
  save_freq: 50
  debug: { first_step: true }
  eval: { enabled: true, freq: 25, samples_per_prompt: 2, max_prompts: 32, seed: 20260621 }

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4
