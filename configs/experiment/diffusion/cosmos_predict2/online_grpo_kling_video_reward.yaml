# Cosmos Predict2 2B Video2World + GRPO (single-GPU Ray rollout backend).
# This recipe requires real Video2World conditioning. Use either:
#   1. global mode: override model.reference_image=/path/to/reference.png
#   2. per-sample mode: set cosmos.reference_mode=per_sample and use JSONL rows:
#      {"prompt": "...", "reference_image": "path/to/frame.png"}
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/704p_93f
  - /sampling/denoise/35_step_cfg_7
  - /reward/kling_video_reward
  - /dataset/drawbench_train_192

# Cosmos source defaults: lr=1e-5, beta=0.004, eps_clip=1e-3, n=4, ppo_epochs=1.
actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1

algorithm:
  eps_clip: 1.0e-3
  init_kl_coef: 0.004

rollout:
  n: 8
  rollout_batch_size: 1
  sample_batch_size: 1   # 512p93f peaks ~31.8GB at sbs=1; CFG doubles the transformer batch — no sample-batch headroom on 32GB (scale gate OOM 2026-06-10)
  sde:
    type: cps
  same_latent: false

cosmos:
  reference_mode: global   # global | per_sample

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_pred2_2b_grpo
  save_freq: 100
  log_freq: 1

# Cosmos-specific eval / sanity-gate config. eval.eval_only=true switches the
# driver into trained-vs-base comparison mode (no training); with LoRA removed
# (2026-06-10) it requires a full-model checkpoint via trainer.resume_from.
