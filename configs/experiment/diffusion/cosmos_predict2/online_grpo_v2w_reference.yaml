# Cosmos Predict2 2B Video2World + GRPO with per-sample reference images.
# Production readiness is proven by source-backed data plus run artifacts, not by filename.
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/704p_93f
  - /sampling/denoise/35_step_cfg_7
  - /reward/kling_video_reward
  - /dataset/video_world_v2w

actor:
  optim:
    lr: 1.0e-4
  ppo_epochs: 1

algorithm:
  clip_ratio: 1.0e-3
  # Keep the loss-side KL off until reward movement is established. With the
  # current Kling score scale, beta=0.004 dominates the GRPO policy signal and
  # produces flat reward curves even when rewards and advantages are non-zero.
  kl_coef: 0.0

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 1
  samples_per_chunk: 1   # 512p93f peaks ~31.8GB at sbs=1; CFG doubles the transformer batch — no sample-batch headroom on 32GB (scale gate OOM 2026-06-10)
  sde:
    type: cps
  same_latent: false

cosmos:
  reference_mode: per_sample

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_predict2_v2w_kling_video_reward
  save_freq: 20
  debug:
    first_step: true

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4
