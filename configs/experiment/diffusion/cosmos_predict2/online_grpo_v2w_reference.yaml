# Cosmos Predict2 2B Video2World + GRPO with per-sample reference images.
# Production readiness is proven by source-backed data plus run artifacts, not by filename.
defaults:
  - /recipe/online/diffusion_grpo
  - /model/diffusion/cosmos/predict2_2b
  - /sampling/video/704p_93f
  - /sampling/denoise/35_step_cfg_7
  - /reward/kling_video_reward
  - /dataset/video_world_v2w

actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1

algorithm:
  eps_clip: 1.0e-3
  init_kl_coef: 0.004

rollout:
  n: 4
  rollout_batch_size: 1
  sample_batch_size: 1
  sde:
    type: cps
  same_latent: false

cosmos:
  reference_mode: per_sample

trainer:
  entrypoint: vrl.scripts.diffusion.cosmos.train:train_cosmos_predict2_grpo
  output_dir: outputs/cosmos_predict2_v2w_kling_video_reward
  save_freq: 20
  log_freq: 1

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

