[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rl"
version = "0.1.0"
description = "Visual generation RL infrastructure across model families, policy steps, and generation regimes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.5.0",          # CausVid requires torch.nn.attention.flex_attention
    "triton>=3.0.0",
    "numpy>=1.26.0",
    "einops>=0.7.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.24.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "pillow>=10.0.0",      # core image IO (vrl/utils/media.py + model/data paths)
    "pydantic>=2",
    # Walked by every training path — declared explicitly instead of leaning on a
    # pre-baked .venv.
    "ray>=2.9.0",          # distributed rollout/reward backend
    "safetensors>=0.4.0",  # weight loading (cosmos/anima, janus, FSDP save)
]

[dependency-groups]
lint = [
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiohttp>=3.10.0",
    "python-Levenshtein>=0.27.0",
]

[project.optional-dependencies]
cosmos = [
    "diffusers>=0.37.1,<0.40",
    # GLM-Image first ships in Transformers 5.13; tiny-real CPU parity tests
    # exercise the upstream implementation rather than a local stand-in.
    "transformers>=5.13.0,<6",
    "accelerate>=0.30.0",
    "sentencepiece>=0.2.0",
    "peft>=0.11.0",          # LoRA adapters for denoise- and token-step model families
    "torchvision>=0.20.0",   # CausVid/Wan and diffusers video/image transforms
    "easydict>=1.13",         # pinned CausVid/Wan config objects
    "ftfy>=6.2.0",            # pinned CausVid/Wan tokenizer cleanup
]
# Video reward scoring. Covers Kling VideoReward / Qwen2-VL, VideoScore2 and
# UnifiedReward-2.0 (Qwen2.5-VL, trust_remote_code), validated against the same
# Transformers 5 runtime as the model-family CPU contract tests.
# Kling loads a LoRA via peft; UnifiedReward-2.0 samples frames with opencv.
# PhyMotion's SMPL+MuJoCo backend is external by design (vendored under
# third_party/) and intentionally absent here.
# decord is REQUIRED, not optional: every video reward decodes through
# qwen_vl_utils.process_vision_info, whose backend order is torchcodec > decord >
# torchvision. torchvision removed `io.read_video` in 0.22, so the torchvision
# fallback raises AttributeError on any version this floor allows, and torchcodec
# needs system FFmpeg shared libraries that are not a declared dependency. decord
# bundles its own FFmpeg, so it is the only backend that works from a plain
# `uv sync --extra reward`.
reward = [
    "transformers>=5.13.0,<6",
    "peft>=0.11.0",
    "qwen-vl-utils>=0.0.10",
    "decord>=0.6.0",
    "torchvision>=0.17.0",
    "opencv-python-headless>=4.9.0",
]
# Async client/server transport for operator-owned reward inference. Keep this
# separate from the model stack so a trainer that only calls a remote service
# does not need Transformers, PEFT, or video-model dependencies installed.
reward-service = [
    "aiohttp>=3.10.0",
]
# Dataset preparation / scraping under vrl/scripts/data.
data = [
    "datasets>=2.18.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "av>=12.0.0",            # video-world parquet -> mp4 bridge
]
ocr = [
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.0",
    "python-Levenshtein>=0.27.0",
]
pose = [
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.8.0",
]
pose-gpu = [
    "huggingface-hub>=0.24.0",
    "onnxruntime-gpu>=1.24.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "opencv-python>=4.8.0",
]
# OPTIONAL token-image accelerator (Janus-Pro, NextStep). Token families run in the
# main env without this via sampling.attention_backend=torch_native; the extra
# adds vLLM's internal KV/paged-attention kernels
# (vrl/nn/kernels/attention/vllm_paged.py) and the blockwise-fp8 path
# (vrl/nn/quantization/fp8.py). vLLM pins its own Torch ABI, so keep this
# accelerator in a dedicated environment instead of co-installing it with the
# diffusers model/reward stack. The public extra keeps its historical ar-vllm name.
# NOTE: the kernels are optional, but vLLM's CuMemAllocator is a hard requirement
# for shared-GPU memory parking (sleep_offload) in both the rollout worker and the
# in-process reward runtime — those paths fail loud without it. The conflicts below
# keep the ABI isolated, so shared-GPU run envs install vllm directly (--no-deps)
# rather than through this extra. See README "Shared-GPU topologies".
ar-vllm = [
    "vllm>=0.21.0,<0.22",
]
# Fixed video-eval suite extras (vrl/scripts/eval/video_reward_suite.py). VBench
# is PyPI-packaged so it is a dependency here; the other motion-eval benchmarks
# (VMBench, DynamicEval) ship no packaging and are vendored as submodules under
# third_party/ — run their CLIs and fold results in via --merge-json.
videoeval = [
    "vbench==0.1.5",
]
# Full-param 8-bit Adam optimizer states (actor.optim.optim_8bit). int8 Adam state
# via bitsandbytes lets a full-param 2B DiT fit a single 32GB card where fp32 Adam
# state OOMs. Quantizes the optimizer state only (not the forward) → RL-safe:
# old_log_prob / train-inference consistency are untouched. Opt-in heavy CUDA
# wheel, kept out of [cosmos]/CI so plain denoise-model installs stay lean.
optim8bit = [
    "bitsandbytes>=0.43.0",
]
# GPU performance probes under vrl/scripts/perf. NVML GPM (gpm_sampler.py) reports
# SM-level counters such as utilization, occupancy, and tensor/DRAM activity. These
# counters explain execution but do not, by themselves, prove recoverable throughput.
perf = [
    "nvidia-ml-py>=12.0.0",
]

[project.scripts]
vrl-train = "vrl.scripts.train:main"
vrl-reward-service = "vrl.rewards.service.server:main"

[tool.uv]
# VBench 0.1.5 hard-pins transformers==4.33.2. Keep evaluation in a dedicated
# environment instead of weakening the model/reward runtimes' newer transformers
# contract. uv uses these conflicts to lock both valid environments explicitly.
conflicts = [
    [{ extra = "videoeval" }, { extra = "cosmos" }],
    [{ extra = "videoeval" }, { extra = "reward" }],
    [{ extra = "videoeval" }, { extra = "ar-vllm" }],
    # vLLM pins the torch/CUDA ABI and is intentionally isolated from the
    # diffusers runtime even when the resolver can select matching versions.
    [{ extra = "ar-vllm" }, { extra = "cosmos" }],
    [{ extra = "ar-vllm" }, { extra = "reward" }],
    # The CPU and GPU ONNX runtimes install the same shared libraries.
    [{ extra = "pose" }, { extra = "pose-gpu" }],
]

[tool.setuptools.packages.find]
include = ["vrl*"]

[tool.setuptools.package-data]
"vrl.config.presets" = ["**/*.yaml", "**/*.yml", "**/*.md"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 99
# Vendored upstream code (VideoPhy/VideoCon) is not held to our lint rules.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "TC001", # keep type-only imports explicit in small modules
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["vrl"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "e2e: end-to-end tests requiring GPU and real model weights (opt-in via WM_RUN_REAL_MODEL_TESTS=1)",
    "slow_test: heavy/slow tests (e.g. Ray spin-up); excluded from the fast PR subset, run nightly",
    "gpu: requires a CUDA device; runs locally / on a future GPU runner and auto-skips on the CPU CI runner via tests/conftest.py",
    "rollout_preview: opt-in few-shot production rollout from an experiment config",
    "distributed: tests requiring an explicit distributed lane (run with --distributed or VRL_RUN_DISTRIBUTED_TESTS=1)",
    "optional: optional tests that are automatically skipped, include --optional to run them",
    "real_cover: this test uses a double for something it cannot run in-process; arg 1 names the real-lane test that covers it for real ('path::test', 'path::Class::test', or a bare test file) and needs why=, or is None for a tracked gap that needs why= plus an on-disk tracked_in=. It records where the real counterpart LIVES, not that it ran — a gpu/e2e target can still be skipped on any given host, so read the lane printed by --real-cover-report. tests/architecture/test_real_cover_labels.py fails on a target that does not exist or does not live in a real lane",
]
