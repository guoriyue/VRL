[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rl"
version = "0.1.0"
description = "Visual generation RL infrastructure stack across autoregressive image generation, diffusion, and world models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.2.0",
    "triton>=3.0.0",
    "numpy>=1.26.0",
    "einops>=0.7.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.24.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "pillow>=10.0.0",      # core image IO (vrl/utils/media.py + model/data paths)
    "pydantic>=2",
    # Walked by every training path — declared explicitly instead of leaning on a
    # pre-baked .venv.
    "ray>=2.9.0",          # distributed rollout/reward backend
    "safetensors>=0.4.0",  # weight loading (cosmos/anima, janus, FSDP save)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "python-Levenshtein>=0.27.0",
    "ruff>=0.4.0",
]
cosmos = [
    "diffusers>=0.31.0",
    "transformers>=4.40.0,<5",
    "accelerate>=0.30.0",
    "sentencepiece>=0.2.0",
    "peft>=0.11.0",          # LoRA adapters for diffusion/AR model families
    "torchvision>=0.17.0",   # diffusers cosmos transformer + preference data transforms
]
# Video reward scoring. Covers Kling VideoReward / Qwen2-VL, VideoScore2 and
# UnifiedReward-2.0 (Qwen2.5-VL, trust_remote_code, transformers>=4.49).
# qwen_vl_utils pulls torchvision for its decode path; Kling loads a LoRA via peft;
# UnifiedReward-2.0 samples frames with opencv. PhyMotion's SMPL+MuJoCo backend is
# external by design (vendored under third_party/) and intentionally absent here.
reward = [
    "transformers>=4.49.0,<5",
    "peft>=0.11.0",
    "qwen-vl-utils>=0.0.10",
    "torchvision>=0.17.0",
    "opencv-python-headless>=4.9.0",
]
# Dataset preparation / scraping under vrl/scripts/data.
data = [
    "datasets>=2.18.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "av>=12.0.0",            # video-world parquet -> mp4 bridge
]
ocr = [
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.0",
    "python-Levenshtein>=0.27.0",
    "rapidocr-onnxruntime>=1.3.0",
]
pose = [
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.8.0",
]
pose-gpu = [
    "huggingface-hub>=0.24.0",
    "onnxruntime-gpu>=1.24.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "opencv-python>=4.8.0",
]
# OPTIONAL AR-image accelerator (Janus-Pro, NextStep). AR families run in the
# main env without this via sampling.attention_backend=torch_native; the extra
# only adds vLLM's internal KV/paged-attention kernels
# (vrl/nn/kernels/attention/vllm_paged.py) and the blockwise-fp8 path
# (vrl/nn/quantization/fp8.py). The vLLM wheel is ABI-locked to an exact torch,
# so DO NOT co-install with [cosmos] — it clashes with the rest of the stack's
# floating torch/torchvision/CUDA wheels (the ARAttentionUnavailable raised at
# import time is exactly this ABI mismatch). Install it in its own venv, the way
# the repo already ships vllm-omni at .venvs/vllm-omni.
ar-vllm = [
    "torch==2.11.0",
    "vllm>=0.21.0,<0.22",
]
# Fixed video-eval suite extras (vrl/scripts/eval/video_reward_suite.py). VBench
# is PyPI-packaged so it is a dependency here; the other motion-eval benchmarks
# (VMBench, DynamicEval) ship no packaging and are vendored as submodules under
# third_party/ — run their CLIs and fold results in via --merge-json.
videoeval = [
    "vbench>=0.1.5",
]
# Full-param 8-bit Adam optimizer states (actor.optim.optim_8bit). int8 Adam state
# via bitsandbytes lets a full-param 2B DiT fit a single 32GB card where fp32 Adam
# state OOMs. Quantizes the optimizer state only (not the forward) → RL-safe:
# old_log_prob / train-inference consistency are untouched. Opt-in heavy CUDA
# wheel, kept out of [cosmos]/CI so plain diffusion installs stay lean.
optim8bit = [
    "bitsandbytes>=0.43.0",
]

[project.scripts]
vrl-train = "vrl.scripts.train:main"

[tool.setuptools.packages.find]
include = ["vrl*"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 99
# Vendored upstream code (VideoPhy/VideoCon) is not held to our lint rules.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "TC001", # keep type-only imports explicit in small modules
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["vrl"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "e2e: end-to-end tests requiring GPU and real model weights (opt-in via WM_RUN_REAL_MODEL_TESTS=1)",
    "slow_test: heavy/slow tests (e.g. Ray spin-up); excluded from the fast PR subset, run nightly",
    "gpu: requires a CUDA device; runs locally / on a future GPU runner and auto-skips on the CPU CI runner via tests/conftest.py",
    "distributed: tests requiring an explicit distributed lane (run with --distributed or VRL_RUN_DISTRIBUTED_TESTS=1)",
    "optional: optional tests that are automatically skipped, include --optional to run them",
]
