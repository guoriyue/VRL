[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rl"
version = "0.1.0"
description = "Visual generation RL infrastructure stack across autoregressive image generation, diffusion, and world models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.2.0",
    "triton>=3.0.0",
    "numpy>=1.26.0",
    "einops>=0.7.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.24.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.4.0",
]
cosmos = [
    "diffusers>=0.31.0",
    "transformers>=4.40.0,<5",
    "accelerate>=0.30.0",
    "sentencepiece>=0.2.0",
]
ocr = [
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.0",
    "python-Levenshtein>=0.27.0",
    "rapidocr-onnxruntime>=1.3.0",
]
pose = [
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.8.0",
]
pose-gpu = [
    "huggingface-hub>=0.24.0",
    "onnxruntime-gpu>=1.24.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "opencv-python>=4.8.0",
]
ar-vllm = [
    "torch==2.11.0",
    "vllm>=0.21.0,<0.22",
]

[project.scripts]
vrl-train = "vrl.scripts.train:main"

[tool.setuptools.packages.find]
include = ["vrl*"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "TC001", # keep type-only imports explicit in small modules
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["vrl"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "e2e: end-to-end tests requiring GPU and real model weights (opt-in via WM_RUN_REAL_MODEL_TESTS=1)",
]
