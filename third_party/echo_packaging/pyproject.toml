# Editable-install wrapper that exposes the JoyAI-Echo submodule's three
# un-packaged src trees (ltx_core / ltx_pipelines / ltx_distillation) as real
# importable packages, so the main repo needs NO sys.path injection code.
#   pip install -e third_party/echo_packaging
# Re-run after `git submodule update --init`. Upstream ships no packaging, hence
# this thin shim lives here in third_party, not in vrl/.
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joyai-echo-vendored"
version = "0.0.0"
description = "Path-only wrapper exposing the vendored JoyAI-Echo packages."

[tool.setuptools.packages.find]
where = [
    "../joyai_echo/ltx-core/src",
    "../joyai_echo/ltx-pipelines/src",
    "../joyai_echo/ltx-distillation/src",
]
include = ["ltx_core*", "ltx_pipelines*", "ltx_distillation*"]
