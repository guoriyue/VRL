# Editable-install wrapper exposing the videophy submodule's un-packaged
# ``mplug_owl_video`` module as a real importable package, so the main repo
# needs NO sys.path injection code.
#   pip install -e third_party/videophy_packaging
# Re-run after `git submodule update --init`. Same rationale as
# third_party/echo_packaging.
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videophy-vendored"
version = "0.0.0"
description = "Path-only wrapper exposing the vendored mplug_owl_video package."

[tool.setuptools.packages.find]
where = ["../videophy/videocon/training/pipeline_video"]
include = ["mplug_owl_video*"]
