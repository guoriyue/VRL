# Operator-owned CPU CountGD service for text-conditioned object counting.
#
# CPU placement avoids allocating memory on the generator's GPU. The service
# automatically advertises generation_overlap_safe for an explicit CPU device.
#
# Bazel builds the qualified runtime (pinned upstream source + patch, Space
# assets, and the CountGD dependency hub from third_party/countgd/requirements.txt)
# and launches the service on it:
#
#   bazel run //third_party/countgd:reward_service -- \
#     --config vrl/config/reward_service/countgd.yaml
#
# To point the reward model at a tree elsewhere, set worker_config.source_dir.
host: 127.0.0.1
port: 8311
model_name: countgd
model_version: CountGD@b6f362b3f5cd20db4a171faa410dfed8f2f466d8+protocol-a22646e78242bc9122a032fb9075d1ca8b175de751bd1a75e910a28994472d51

# HTTP artifacts are integrity-checked paths on the shared local filesystem.
# Relative roots are resolved against this configuration file, not the shell cwd.
artifact_roots:
  - ../../../outputs

max_concurrency: 1
max_pending_requests: 16
max_cached_requests: 1024
generation_overlap_safe: false

worker_config:
  model_factory: vrl.rewards.models.countgd:CountGDModel
  reward_model_version: ${model_version}
  device: cpu
