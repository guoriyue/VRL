# Pairwise judge for the structure / realism / detail objective against a strong
# reference image (GPT image of the same prompt, metadata.judge_reference).
# `detail` is judged on a 2x2 grid of native-resolution crops (k-th crop vs k-th
# crop, both orders, averaged) so texture reaches the judge at full scale; the
# other criteria see the whole images. Prompt fidelity at 1.5: against a GPT
# reference the judge separates off-prompt rollouts (missing or swapped main
# subject) more cleanly than any other criterion, and the user ranks accuracy
# with structure and realism.
#
#   CUDA_VISIBLE_DEVICES=3 python -m vrl.rewards.service.server \
#     --config vrl/config/reward_service/qwen3vl32b_pairwise_detail.yaml
host: 127.0.0.1
port: 8318
model_name: vlm-preference-qwen3vl32b
model_version: Qwen/Qwen3-VL-32B-Instruct-FP8@4bf2c2f3
artifact_roots:
  - ../../../outputs
  - /mnt/nvme/outputs
max_concurrency: 1
max_pending_requests: 256
max_cached_requests: 8192
max_request_bytes: 1073741824
generation_overlap_safe: true
worker_config:
  model_factory: vrl.rewards.models.vlm_preference:VLMPreferenceRewardModel
  device: cuda:0
  judge_model: Qwen/Qwen3-VL-32B-Instruct-FP8
  judge_revision: 4bf2c2f3
  judge_max_side: 1024
  local_files_only: true
  reference_key: judge_reference
  both_orders: true
  data_root: /mnt/nvme/data/external
  criteria:
    - name: structure
      weight: 2.0
      answer: yesno
      question: >-
        Is Image 1 better than Image 2 in structural correctness: hands with five fingers,
        faces and bodies with normal proportions, objects with coherent geometry and
        perspective, legible text where text was requested, and no merged, missing, extra
        or twisted parts?
    - name: natural
      weight: 2.0
      answer: yesno
      question: >-
        Both images were made for the description "{prompt}". Does Image 1 look more like a
        genuine work in the medium the description implies (a real photograph, an actual
        painting, a real drawing), made by a skilled human, than Image 2? Genuine means
        believable light and shadow, natural materials, restrained color, and the
        imperfections of the real medium; count against an image plastic smoothness,
        airbrushed skin, over-brightening, over-saturation, glow halos, and the generic
        look of a 3D render or AI illustration when the description did not ask for one.
    - name: detail
      weight: 1.0
      answer: yesno
      crops: 2
      question: >-
        These are matching regions cut from two larger images. Does the region from Image 1
        show more convincing fine detail than the one from Image 2: sharp, physically
        plausible texture (skin pores, fur strands, fabric weave, wood grain, foliage,
        brushwork), crisp edges without halos, and no smeared, waxy, noisy or repetitive
        patterns?
    - name: fidelity
      weight: 1.5
      answer: yesno
      question: >-
        Does Image 1 follow the description "{prompt}" more faithfully than Image 2,
        including every style and mood qualifier it contains, the requested subject,
        action and setting?
