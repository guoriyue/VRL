# Operator-owned Kling VideoReward service for the generation/reward overlap
# acceptance gate (docs/sprints/info/SPRINT_video_rollout_stage_overlap.md).
#
# This is NOT a hydra preset — it is the standalone service process's own config,
# passed with `--config`. It lives outside vrl/config/presets/ so the trainer
# config loader never picks it up.
#
# Launch on a four-GPU host, pinning the service to physical GPU 3 so it is
# disjoint from the three colocated trainer/rollout ranks (physical GPUs 0-2):
#
#   CUDA_VISIBLE_DEVICES=3 \
#     .venv/bin/vrl-reward-service \
#       --config vrl/config/reward_service/kling_overlap_gate.yaml
#
# CUDA_VISIBLE_DEVICES is how the physical disjointness is actually enforced;
# `device: cuda:0` below is the device *within* that masked view. The wire
# protocol carries no GPU UUIDs, so generation_overlap_safe is an operator
# assertion the service cannot verify for itself.
host: 127.0.0.1
port: 8300
model_name: kling-overlap-gate
model_version: KlingTeam/VideoReward@main

# Trainer and service share this filesystem; reward artifacts move as paths, not
# bytes. Must be absolute and already exist, and must contain the trainer's
# reward artifact_dir.
artifact_roots:
  - /home/ubuntu/VRL/outputs

# One in-flight scoring call: Kling VideoReward is a single learned judge on one
# GPU, so concurrency above 1 would only queue inside the model. The pending cap
# bounds admission so a producer that outruns scoring gets explicit 429
# backpressure instead of unbounded queue growth.
max_concurrency: 1
max_pending_requests: 8
max_cached_requests: 1024

# The acceptance gate's entire premise: scoring may overlap generation because
# this service owns a GPU no trainer or rollout worker can touch.
generation_overlap_safe: true

worker_config:
  model_factory: vrl.rewards.models.kling_video_reward:KlingVideoRewardModel
  reward_model_name: KlingTeam/VideoReward@main
  reward_model_version: KlingTeam/VideoReward@main
  device: cuda:0
  dtype: bfloat16
  local_files_only: true
  min_frame_pixels: 200704
