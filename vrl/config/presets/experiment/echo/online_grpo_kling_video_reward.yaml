# JoyAI-Echo video GRPO on motion-grounded prompts with a production video reward.
# Single-shot, video-only flow-matching RL (audio + cross-shot memory are Echo
# inference features, not on the RL path). Echo is a ~24GB transformer + Gemma-12B
# encoder: this needs an 80GB-class card even with LoRA + gradient checkpointing.
defaults:
  - /recipe/online/denoise_grpo
  - /model/echo/release
  - /reward/kling_video_reward
  - /dataset/videophy

# Echo-safe shape: H/W divisible by 32, frames = 1 + 8*k. 256x256, 25 frames.
# guidance_scale=1.0 because the DMD checkpoint bakes guidance in (no CFG branch).
model:
  video_height: 256
  video_width: 256

sampling:
  width: ${model.video_width}
  height: ${model.video_height}
  num_frames: 25
  num_steps: 16
  guidance_scale: 1.0
  fps: 24

actor:
  optim:
    lr: 1.0e-4              # LoRA wants higher LR than full-param's 1e-5
  gradient_checkpointing: true
  # >1 reuses each rollout batch for several optimizer steps so the GRPO drift
  # mechanisms are non-degenerate (see the flux algo-validation sprint note).
  # ACCEPTANCE GATE: confirm clip_fraction / approx_kl are non-trivial across epochs
  # in the run logs. If clip_fraction ~0, the policy isn't moving and ppo_epochs is
  # just scaling effective lr — the win region for the ref-noise-pred cache and for
  # ppo_epochs both vanish; fix the signal (lr / full-param) before reading the curve.
  ppo_epochs: 4

algorithm:
  kl_coef: 0.004

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 1
  samples_per_generation_batch: 1
  noise_level: 0.7
  sde:
    type: flow_grpo

trainer:
  output_dir: outputs/echo_kling_video_reward
  save_freq: 20

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4
