# Cross-node (2 servers x 1 GPU each) variant of the Cosmos Predict2.5 + Kling
# DiffusionNFT run. Splits the run across two hosts over a Ray cluster:
#
#   node A (head/driver) : the single_process trainer AND the in-process Kling
#                          reward model. Its GPU is held OUT of Ray's scheduling
#                          pool (`ray start --head --num-gpus=0`); topology injects
#                          a CuMem phase lease so training reclaims it after score.
#   node B (worker)      : the rollout worker on node B's one GPU
#                          (`ray start --address=<head>:6379 --num-gpus=1`).
#
# Setup + launch commands:
#   docs/training_examples/online_nft_kling_video_reward_cross_node/README.md
#
# Rewards score in-process on the DRIVER (node A), so this config deliberately
# declares no reward resource token. With no reward reservation the local reward
# follows the rank-local trainer device; token 1 remains rollout-only. A config
# that assigns reward.devices=[1] now fails before model loading because cross-node
# tokens cannot name a driver-local CUDA device. The trainer+Kling memory fit on
# node A remains a deployment requirement for this two-host layout.
defaults:
  - /experiment/cosmos_predict2_5/online_nft_kling_video_reward

distributed:
  resources:
    # The one switch that drives the whole 2-host topology. When true the run-
    # level placement owner auto-uses SPREAD (bundles across nodes), validates
    # GPUs by (node_ip, gpu_id) pairs instead of bare ordinals, and skips the
    # head-local trainer reservation so the head can run with --num-gpus=0. No
    # separate placement_strategy key is needed -- it is derived from this flag
    # (vrl/ray/placement.py GlobalRayPlacementOwner._strategy).
    cross_node: true
    # Trainer (head GPU) and rollout (node B GPU) are physically disjoint hosts,
    # so no same-card overlap permission is needed.
    allow_overlap: false
    # GPU "ids" here are budget TOKENS, not physical devices (cross_node): the
    # real rollout placement is by node (which host you `ray start` on).
    #   token 0 -> head/driver node A's card (held out of Ray: --num-gpus=0)
    #   token 1 -> worker node B's rollout card (2 GPUs total)
    trainer:
      num_gpus: 1
    rollout:
      devices: [1]
      gpus_per_worker: 1.0
      num_workers: 1
    reward:
      # Override /reward/kling_video_reward's local-GPU reservation. In cross-node
      # mode non-trainer ordinals are remote Ray budget tokens, while Kling runs
      # inside the driver; an empty reservation makes the factory use node A's
      # rank-local trainer device instead.
      devices: []
      num_gpus: 0
      num_workers: auto
