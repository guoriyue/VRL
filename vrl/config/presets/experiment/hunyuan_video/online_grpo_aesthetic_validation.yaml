# HunyuanVideo 13B + aesthetic GRPO — first-landing validation recipe.
# GPU parity gates: (1) one 17-frame generation vs diffusers
# HunyuanVideoPipeline at same prompt/seed/steps; (2) debug.first_step asserts
# rollout logprob == replay.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/hunyuan_video/13b
  - /sampling/video/320p_17f
  - /sampling/denoise/10_step_distilled_6
  - /dataset/videophy
  - /reward/aesthetic


actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 4
  samples_per_generation_batch: 2

trainer:
  output_dir: outputs/hunyuan_video_aesthetic_grpo
  save_freq: 60
  debug:
    first_step: true
