# CogVideoX-2b + aesthetic GRPO — first-landing validation recipe.
# Non-flow family: rollout.sde.type=ddim routes rollout/replay log-probs
# through the DDIM eta-SDE (vrl/math/denoise/ddim.py).
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/cogvideox/2b
  - /sampling/video/240p_33f
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/videophy
  - /reward/aesthetic


actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  sde:
    type: ddim
  n_samples_per_prompt: 8
  prompts_per_batch: 4
  samples_per_chunk: 2

trainer:
  output_dir: outputs/cogvideox_aesthetic_grpo
  save_freq: 60
  debug:
    first_step: true
