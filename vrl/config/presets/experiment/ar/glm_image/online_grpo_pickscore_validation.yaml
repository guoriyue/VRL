# GLM-Image 9B AR prior + PickScore GRPO — first-landing training validation.
# RL trains ONLY the 9B AR section (LoRA); the 7B DiT decode is frozen rollout
# postprocess whose output feeds the reward. Native 1024px = 1280 prior
# tokens per image — the campaign-verified geometry; drop image_height/width
# (multiples of 32) if rollout cost needs trimming. No AR-side CFG for this
# family (plain sampling; there is no guidance_scale knob).
defaults:
  - /recipe/online/ar_discrete_token_grpo
  - /model/ar/glm_image/9b
  - /sampling/ar/glm_image_1024
  - /reward/pickscore
  - /dataset/drawbench_train_192


algorithm:
  kl_coef: 0.01
  kl_estimator: k2

actor:
  optim:
    lr: 1.0e-4

rollout:
  microbatch_size: 1
  host_memory_budget_fraction: 0.9

trainer:
  output_dir: outputs/glm_image_pickscore_grpo
  debug:
    first_step: true
