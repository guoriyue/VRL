# SD 3.5 Medium + OCR GRPO
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/sd3_5/medium
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/ocr
  - /dataset/ocr


actor:
  optim:
    lr: 3.0e-4
  # Flow-GRPO SD3 OCR 1GPU parity: 8 batches/epoch, accum=8//2 → 2 updates/epoch.
  prompts_per_collection: 2

rollout:
  # GPM active samples at n/sbs=8 still show ~20% SM occupancy; VAE tiling is on.
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_generation_batch: 16

trainer:
  output_dir: outputs/sd3_5_ocr_grpo
  save_freq: 60
  debug:
    first_step: true
  replay_parity:
    # Bitwise under model.fused_kernels (two-model probe on the pickscore
    # sibling, LoRA B ~ N(0, 0.01), generation batch 16 replayed as batch 1:
    # max |delta logprob| 0, 5090, 2026-11-11); the gate holds that at every update.
    max_abs_logprob_diff: 1.0e-6

model:
  # Batch-invariant linears and LoRA adapters on both roles: the 16-sample
  # rollout replayed one sample at a time otherwise drifts by 7e-3 to 9e-3 per
  # step once the LoRA has left zero. The fused kernels and torch.compile are
  # alternatives (vrl/config/validation.py); Flow-GRPO SD3 does not compile
  # during GRPO either.
  fused_kernels: true
  torch_compile:
    enable: false
