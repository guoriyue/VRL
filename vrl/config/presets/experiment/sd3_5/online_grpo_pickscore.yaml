# SD 3.5 Medium + PickScore SFW GRPO.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/sd3_5/medium
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/pickscore_sfw
  - /reward/pickscore


actor:
  optim:
    lr: 3.0e-4
  prompts_per_collection: 2

algorithm:
  kl_coef: 0.01

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_generation_batch: 16

trainer:
  output_dir: outputs/sd3_5_pickscore_grpo
  save_freq: 60
  debug:
    first_step: true
  replay_parity:
    # Bitwise under model.fused_kernels (two-model probe, LoRA B ~ N(0, 0.01),
    # generation batch 16 replayed as batch 1: max |delta logprob| 0, 5090,
    # 2026-11-11); the gate holds that at every update.
    max_abs_logprob_diff: 1.0e-6

model:
  # Batch-invariant linears and LoRA adapters on both roles. The 16-sample
  # rollout replayed one sample at a time otherwise drifts by 7e-3 to 9e-3 per
  # step once the LoRA has left zero (bitwise before the first update, so the
  # first-update gate never saw it), which puts ~45% of the ratios outside the
  # 1e-4 clip band every update. The fused kernels and torch.compile are
  # alternatives (vrl/config/validation.py); compile stays off here.
  fused_kernels: true
  torch_compile:
    enable: false
