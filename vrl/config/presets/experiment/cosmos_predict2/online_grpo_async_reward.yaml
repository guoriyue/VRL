# Cosmos Predict2 2B Video2World + GRPO — async-reward overlap across 3 GPUs.
#
# REQUIRES >= 3 VISIBLE GPUs. This recipe combines three things that already
# exist in the codebase but no single config wired together before:
#   (1) continuous rollout orchestration (/base/rollout/orchestration/continuous
#       + trainer.rollout_orchestration.continuous.max_inflight_groups=2): a
#       background producer keeps per-prompt groups in flight while the trainer
#       drains homogeneous-policy ready groups.
#   (2) reward on a DEDICATED GPU disjoint from rollout
#       (distributed.resources.reward.devices: [2]): the reward model uses a
#       GPU that does NOT overlap rollout's GPU.
#   (3) cosmos full-param 8-bit training at 480p-native (720p weights are
#       garbage at 240p/480p; see SPRINT_config_correctness_audit).
#
# GPU TOPOLOGY — use >= 3 visible GPUs: trainer GPU0, rollout GPU1, reward GPU2,
# all disjoint. Both rollout and reward pin their own device; an unpinned role
# would share the trainer (rollout) or rollout (reward) GPU instead.
#   - fewer than 3 GPUs: does NOT resolve (the pinned devices lie outside
#     visible_devices). Continuous rollout requires a disjoint rollout GPU;
#     shared-GPU recipes use strict phase handoff instead. Drop
#     reward.devices to share the rollout GPU with phase-separated scoring.
#
# WHY the dedicated reward GPU is load-bearing for throughput: when reward shares
# rollout's GPU, the topology derives park_rollout_for_reward=True (rollout
# must step off so reward can run), serializing reward(N) after rollout(N).
# Disjoint reward devices make reward_shared_with_rollout False, so
# park_rollout_for_reward resolves False and the reward model stays resident —
# reward(N) overlaps an already-submitted rollout(N+1) on its own card. That hides the
# measured ~14% reward stage instead of paying it on the critical path.
#
# Usage (>= 3 GPUs):
#   CUDA_VISIBLE_DEVICES=0,1,2 vrl-train \
#     --config experiment/cosmos_predict2/online_grpo_async_reward \
#     data.preprocessing.reference_image=/path/to/ref.png
defaults:
- /recipe/online/cosmos_predict2_grpo
- /model/cosmos/predict2_2b
- /sampling/video/480p_33f            # 480p-native; 240p is OOD -> rainbow garbage (SPRINT_config_correctness_audit)
- /sampling/denoise/35_step_cfg_7
- /reward/kling_video_reward          # local HF model, no API key
- /dataset/drawbench_train_192_reference_image
- /base/rollout/orchestration/continuous

model:
  use_lora: false                     # FULL-PARAMETER (-> apply_full_finetune); 480p full-param needs FSDP/multi-GPU
  path: checkpoints/cosmos-predict2-2b-480p-16fps-diffusers   # 480p-native weights (720p weights = garbage at 480p)
  revision: null
  torch_compile:
    enable: false

distributed:
  resources:
    rollout:
      devices: [1]                    # rollout on its own GPU, disjoint from trainer
    reward:
      device: gpu
      devices: [2]                    # reward on a DISJOINT GPU -> async overlap

actor:
  optim:
    lr: 2.0e-5                         # full-param wants a lower LR than LoRA's 1e-4 (paper §4.2.2 ~1e-5)
    optim_8bit: true                  # the enabler: int8 Adam state -> full-param 2B fits on 32GB
  gradient_checkpointing: true
  ppo_epochs: 4                       # engages the trust-region clip (1 -> clip_fraction==0, flat curve)

rollout:
  samples_per_generation_batch: 4


trainer:
  output_dir: outputs/cosmos_pred2_2b_async_reward_480p
  total_epochs: 300
  save_freq: 50
  debug: {first_step: true}

  rollout_orchestration:
    continuous:
      max_inflight_groups: 2          # >=2: keep rollout(N+1) producing while reward(N) scores
      max_stale_policy_versions: 1
