# Qwen-Image OCR GRPO — single-GPU smoke recipe (validation + naive profiling).
#
# Smallest end-to-end probe: tiny resolution, few denoise steps, 1 sample/chunk,
# LoRA-only. Proves the family runs encode -> prepare -> denoise -> decode ->
# reward -> LoRA grad on one card. Qwen-Image is ~20B; bf16/fp16/fp32 weights are
# expected to exceed 32 GB (record peak + the budget, do not fake a pass).
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 vrl-train \
#     --config experiment/qwen_image/online_grpo_smoke_single_gpu
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/qwen_image/base
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/ocr
  - /dataset/ocr
  - _self_


sampling:
  height: 256
  width: 256
  num_steps: 4
  max_sequence_length: 64

actor:
  optim:
    lr: 1.0e-4
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

rollout:
  n_samples_per_prompt: 2
  prompts_per_batch: 2
  samples_per_chunk: 1
  # Clamp the SDE window to the 4-step budget (base preset is [0,10]); must live
  # under rollout.sde, not sampling.
  sde:
    window_range: [0, 4]

trainer:
  output_dir: outputs/qwen_image_ocr_grpo_smoke_single_gpu
  total_epochs: 1
  save_freq: 9999
  profile: true
  debug:
    first_step: true

model:
  torch_compile:
    enable: false
