# HunyuanImage-2.1 17B + PickScore GRPO — first-landing validation recipe.
# GPU parity gates (run before trusting curves): (1) one generation vs
# diffusers HunyuanImagePipeline at same prompt/seed/steps — expect small
# divergence after step 5 because VRL uses classic CFG while the pipeline's
# AdaptiveProjectedMixGuidance switches to APG (see the model.py docstring);
# (2) debug.first_step asserts rollout logprob == replay.
# VRAM: 17B bf16 = ~34.9 GB, above a single 32 GB 5090 — run multi-GPU or
# land the fp8/offload plan first (see model/diffusion/hunyuan_image/17b).
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/hunyuan_image/17b
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/pickapic_v2
  - /reward/pickscore


actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  # 17B + separate-CFG double forward: small chunks.
  samples_per_chunk: 2

trainer:
  output_dir: outputs/hunyuan_image_pickscore_grpo
  save_freq: 60
  debug:
    first_step: true
