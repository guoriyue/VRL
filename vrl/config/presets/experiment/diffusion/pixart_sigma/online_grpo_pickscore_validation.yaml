# PixArt-Sigma XL-2 512-MS + PickScore GRPO — first-landing validation recipe.
# Non-flow family: sampling.sde_type=ddim routes rollout/replay log-probs
# through the DDIM eta-SDE (vrl/math/diffusion/ddim.py); the family builds the
# DDIM from the shipped DPM-Solver beta config (pixart_ddim_scheduler).
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/pixart_sigma/xl_512
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/pickapic_v2
  - /reward/pickscore


sampling:
  max_sequence_length: 300
  sde_type: ddim

actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_chunk: 16

trainer:
  output_dir: outputs/pixart_sigma_pickscore_grpo
  save_freq: 60
  debug:
    first_step: true
