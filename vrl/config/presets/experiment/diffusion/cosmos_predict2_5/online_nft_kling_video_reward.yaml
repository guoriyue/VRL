# Cosmos Predict2.5 2B + DiffusionNFT + Kling video reward.
# The Cosmos-Predict2.5 RL paper uses 20 diffusion steps per generated output,
# then trains on ten evenly spaced conditional-probability slices.
defaults:
  - /recipe/online/diffusion_nft
  - /model/diffusion/cosmos/predict2_5_2b
  - /sampling/video/512p_93f
  - /sampling/denoise/20_step_no_cfg
  - /reward/kling_video_reward
  - /dataset/videophy


# Compile-both: compile the DiT for BOTH train replay and rollout denoise. The
# model block is read by the trainer AND inherited by the rollout worker, so this
# one switch compiles both paths. Keep rollout and replay on the same kernels;
# bf16 one-sided compile made the two sides' velocity differ by ~5e-2 in probes,
# the worst case for rollout/train logprob drift.
# Why compile-both is the parity-safe choice: both paths run the SAME compiled
# kernel -> bit-identical -> zero compile-induced drift. Measured fp32 forward
# parity ~2e-6 and 1.31x rollout / 1.33x train (RTX 5090,
# SPRINT_compile_defaults_and_parity_audit + SPRINT_compile_rollout_lifecycle.md
# §4.3/§4.4). mode=default is the only LoRA+grad-ckpt-safe mode
# (reduce-overhead/CUDA-graph collides). FINAL GATE: confirm the live logprob
# drift guard <= 0.01 on the real run (lifecycle P3); if it drifts, fall back to
# compile-neither (enable:false), NOT rollout-only.
model:
  torch_compile:
    enable: true
    mode: default

actor:
  optim:
    # Paper §4.2.2 trains full-param at 3e-5 (2B). This recipe is LoRA (full-param
    # post-training needs a separate previous-policy path + multi-GPU), and LoRA
    # adapters need a higher LR to move the policy — 1e-4 measured on the
    # 2026-06-13 single-GPU cosmos+Kling run (3e-5 gave grad_norm ~0.05-0.12 and
    # flat reward). Dial back toward 3e-5 if approx_kl / logprob_abs_diff drift.
    lr: 1.0e-4
  ppo_epochs: 1
  timestep_fraction: 0.5
  ema:
    enable: true
    decay: 0.9
    update_interval: 1

rollout:
  # Paper-shaped RL batch: 8 outputs per input condition and 32 input
  # conditions per optimizer update. Generation still uses samples_per_chunk=1
  # so rollout denoising can stream on limited memory.
  n_samples_per_prompt: 8
  prompts_per_batch: 32
  # Stream the optimizer-target batch one prompt group at a time so host RAM
  # holds ~1 group instead of all 32 (derives gradient_accumulation_steps=32).
  microbatch_size: 1
  # Fail fast if one streamed group already uses >90% of host RAM instead of
  # OOMing minutes into rollout (0.0 disables the guard).
  host_memory_budget_fraction: 0.9
  samples_per_chunk: 1
  noise_level: 0.7
  sde:
    type: cps
  # Rollout denoise compile is handled by the top-level `model.torch_compile`
  # block (compile-both): the rollout worker inherits the model block.

trainer:
  entrypoint: vrl.scripts.diffusion.train:train_diffusion_online
  output_dir: outputs/cosmos_predict2_5_2b_diffusionnft
  # Paper §4.2.2: "trained for 256 steps with a batch size of 32." Each epoch
  # here = one optimizer update over the prompts_per_batch=32 target batch, so
  # 256 epochs = the paper's 256 parameter updates. The 2026-06-13/06-16 runs
  # stopped at 10-14 updates and saw only noise — far too few. Override to a
  # smaller value for a quick smoke.
  total_epochs: 256
  # 8 checkpoints across the run (e32,e64,...,e256) for a fixed-prompt reward
  # curve via vrl/scripts/eval/cosmos_predict25_kling_eval.py.
  save_freq: 32
  # First-step NFT lr=0 invariant: flipping advantages must not change the loss.
  # Cheap (one step-0 check) and it separates "weak signal" from "garbage signal"
  # (e.g. previous adapter not synced / scheduler drift) before a long run.
  debug:
    first_step: true
  # Evaluate saved checkpoints separately with the held-out manifest and fixed seeds.

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

production:
  kling_video_reward:
    enabled: true
    report_path: outputs/cosmos_world_model_production_report.md
