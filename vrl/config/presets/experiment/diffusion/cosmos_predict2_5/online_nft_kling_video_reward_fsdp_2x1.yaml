# Symmetric colocated FSDP2 (2 servers x 1 GPU) variant of the Cosmos Predict2.5 +
# Kling DiffusionNFT run (SPRINT_multi_gpu_training.md Phase 4/6).
#
# Same per-rank-local symmetric-colocated topology as the DDP 2x1 variant: every
# server runs ONE torchrun rank = 1 trainer + the base recipe's single-GPU
# colocated rollout (and Kling reward) time-sharing its local GPU, all reading the
# SAME policy version. Ray and the rollout/reward workers are per-rank-LOCAL (each
# rank does its own ray.init() on its own card); there is NO shared Ray cluster.
# The two ranks draw DISJOINT prompt slices (genuine data parallelism), so 2 ranks
# = 2x the effective batch. Outputs (metrics / checkpoints / eval) are written by
# rank0 only — server A's disk.
#
# DDP vs FSDP2 here: DDP replicates the full module and all-reduces the (small
# LoRA) gradients; FSDP2 instead SHARDS params/grads/optimizer as DTensor across
# the 2 ranks and the per-layer all-gather / reduce-scatter crosses the network.
# For a 2B transformer + LoRA that fits on one card, DDP is the cheaper choice
# (SPRINT_symmetric_colocated_ddp.md) — this FSDP2 variant exists to validate the
# sharded path end-to-end (the only option once a model does NOT fit on one card,
# or for full-param training where there is no frozen base to redundantly gather).
# NOTE: cross-node FSDP all-gathers params over the network EVERY forward, so it is
# slower than DDP for this fits-on-one-card LoRA model; the value is correctness +
# readiness, not throughput.
#
# Launch (run on BOTH servers; same --master_addr = server A's reachable IP):
#   # server A (rank 0, the output node):
#   HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
#     torchrun --nnodes=2 --node_rank=0 --nproc_per_node=1 \
#       --master_addr=<A_IP> --master_port=29500 -m vrl.scripts.train \
#       --config experiment/diffusion/cosmos_predict2_5/online_nft_kling_video_reward_fsdp_2x1
#   # server B (rank 1): same command with --node_rank=1
# or use docs/training_examples/online_nft_kling_video_reward_fsdp_2x1/fsdp_2x1_launch.sh
#
# Do NOT `ray start` a shared cluster — each rank's local ray.init() must own its
# own GPU. NCCL needs the two servers to reach each other on --master_port and the
# NCCL ports (set NCCL_SOCKET_IFNAME / GLOO_SOCKET_IFNAME if multi-homed).
#
# Unsupported with fsdp in this first version (all fail-fast at build_strategy):
#   - actor.ema.enable=true        (DTensor-aware EMA not implemented)
#   - trainer.resume_from=...      (FSDP2 optimizer state export/load not implemented)
#   - model.torch_compile.enable=true (unsound with reshard-after-forward all-gathers)
defaults:
  - /experiment/diffusion/cosmos_predict2_5/online_nft_kling_video_reward

distributed:
  # Flip ONLY the trainer to FSDP2; inherit the base single-GPU colocated resource
  # plan unchanged. world_size = num_nodes * gpus_per_node = 2 drives the sharded
  # forward/backward collectives (each rank still resolves its own local 1-GPU
  # rollout/reward plan).
  training:
    strategy: fsdp
    num_nodes: 2
    gpus_per_node: 1
    fsdp:
      mesh: ["dp_shard"]           # 1D ZeRO-3 across the 2 ranks (no HSDP at 2x1)
      # precision_policy=none (fp32 sharded master params), NOT actor (bf16 params).
      # This recipe uses activation checkpointing (actor.gradient_checkpointing, on
      # by default, and required — without it the 2B DiT at 480p/33f OOMs a 44GB
      # L40S). FSDP2 MixedPrecisionPolicy(param_dtype=bf16) casts the fp32 sharded
      # params to bf16 only inside its pre-forward hook; the gradient-checkpoint
      # recompute calls the block forward directly and BYPASSES that hook, so an op
      # not covered by the trainer's autocast (the attention matmul) runs bf16 in the
      # forward but fp32 in the recompute -> torch.utils.checkpoint CheckpointError
      # (saved bf16 vs recomputed fp32). With precision_policy=none the params stay
      # fp32 in both passes (consistent), and bf16 compute still comes from the
      # trainer's autocast (same as single_process / ddp). Keeping bf16 params under
      # FSDP+GC needs a deeper fix (apply the MP cast during recompute) — tracked as
      # a follow-up; this is the correct, standard FSDP2+checkpointing recipe.
      precision_policy: none       # fp32 master params; bf16 compute via trainer autocast
      reshard_after_forward: true  # ZeRO-3 (re-gather params each forward, lowest mem)
  resources:
    rollout:
      # Each rank colocates its rollout worker on its own (trainer) GPU — state the
      # intent explicitly via gpu_pool rather than the base preset's overlap
      # fallback. Same as the DDP variant.
      gpu_pool: trainer
    reward:
      # 2 GPUs total (1 per rank), no spare card: the Kling reward time-shares the
      # same card as rollout/trainer. Explicit `rollout` is fail-loud (see the DDP
      # variant's note).
      gpu_pool: rollout

actor:
  # FSDP2 + EMA is fail-fast in this first version (DTensor-aware EMA gather/update
  # not implemented — build_strategy raises). The base recipe enables EMA, so turn
  # it off here. EMA is an actor-side averaging knob, not the learning signal, so
  # dropping it does not change what FSDP validates (sharded forward/backward +
  # gathered weight sync). Re-enable once DTensor EMA lands (SPRINT §8/§10).
  ema:
    enable: false

model:
  # torch.compile (inductor graph capture) is unsound with FSDP2 fully_shard's
  # reshard-after-forward all-gathers — build_strategy fail-fasts if this is true.
  # Set it false in the config so the run is self-contained (the DDP variant passed
  # this as a launch override; FSDP requires it off).
  torch_compile:
    enable: false
