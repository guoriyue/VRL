# Cosmos Predict2.5 2B + GRPO + Kling video reward — the paper-algorithm recipe.
# The Cosmos-Predict2.5 RL paper (§4.2.2, p13) trains with GRPO; the sibling
# online_nft_kling_video_reward.yaml keeps the same paper-shaped rollout budget
# on DiffusionNFT. This config closes the "no predict2.5 GRPO recipe" gap from
# SPRINT_cosmos_predict25_rl_paper_parity §5.1.
#
# Known deviations from the paper (deliberate, documented there):
# - LoRA 1e-4 instead of full-param 3e-5: predict2.5 is LoRA-only in this repo
#   (apply_full_finetune raises) and full-param needs multi-GPU.
# - ppo_epochs 4 instead of a single pass: with ppo_epochs=1 the trust-region
#   clip is identically zero (ratio==1; flux algo validation measured
#   clip_fraction==0), so the GRPO mechanism would be dead.
# - No diffusion-loss regularizer: the paper uses one against reward hacking;
#   not implemented in this repo yet (open item in the parity sprint).
# Paper-shaped budget kept: 8 outputs x 32 conditions per update, 20 denoise
# steps no-CFG, 10 gradient timestep slices (timestep_fraction 0.5), 256 updates.
defaults:
  - /recipe/online/cosmos_predict25_grpo
  - /model/diffusion/cosmos/predict2_5_2b
  - /sampling/video/512p_93f
  - /sampling/denoise/20_step_no_cfg
  - /reward/kling_video_reward
  - /dataset/videophy

precision: bf16

# Compile-both: same rationale as the NFT sibling — rollout and train replay run
# the SAME compiled kernel, so compile adds zero rollout/train logprob drift
# (mode=default is the only LoRA+grad-ckpt-safe mode).
model:
  torch_compile:
    enable: true
    mode: default

actor:
  optim:
    # Paper §4.2.2 trains full-param at 3e-5 (2B). This recipe is LoRA, and LoRA
    # adapters need a higher LR to move the policy — 1e-4 measured on the
    # 2026-06-13 single-GPU cosmos+Kling run (3e-5 gave grad_norm ~0.05-0.12 and
    # flat reward). Dial back toward 3e-5 if approx_kl / logprob_abs_diff drift.
    lr: 1.0e-4
  # ppo_epochs=1 makes ratio==1 and clip_fraction==0 (trust region dead, flux
  # validation); 4 inner epochs make the GRPO clip actually engage.
  ppo_epochs: 4
  timestep_fraction: 0.5
  ema:
    enable: true
    decay: 0.9
    update_interval: 1

rollout:
  # Paper-shaped RL batch: 8 outputs per input condition (family recipe) and 32
  # input conditions per optimizer update. Generation still streams with
  # samples_per_chunk=1 on limited memory.
  prompts_per_batch: 32
  # NO streaming accumulation here (unlike the NFT sibling's microbatch_size=1):
  # streaming releases each microbatch after its backward, and ppo_epochs=4
  # must replay every microbatch across epochs — the trainer validation rejects
  # the combination outright. The cost is holding all 32 groups' rollout
  # tensors on host RAM for the update window.
  samples_per_chunk: 1
  noise_level: 0.7

trainer:
  output_dir: outputs/cosmos_predict2_5_2b_grpo
  # Paper §4.2.2: "trained for 256 steps with a batch size of 32." One epoch =
  # one optimizer update over the prompts_per_batch=32 target batch.
  total_epochs: 256
  save_freq: 32
  # First-step replay parity: rollout logprob must equal fresh replay logprob
  # before the first update — separates "weak signal" from "broken replay".
  debug:
    first_step: true
  # Inline fixed eval = the learning signal. Judge learning by eval_reward_mean
  # only; training reward_mean rotates prompts each epoch and is unreadable
  # (SPRINT_cosmos_kling_fixed_eval_signal). For a SHORT diagnostic run override
  # BOTH save_freq and eval.freq to ~3.
  eval:
    enabled: true
    freq: 32
    samples_per_prompt: 2
    max_prompts: 35           # full VideoPhy eval manifest
    seed: 20260614

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

production:
  kling_video_reward:
    enabled: true
    report_path: outputs/cosmos_world_model_production_report.md
