# Cosmos Predict2 2B Video2World + GRPO (single-GPU Ray rollout backend).
#
# This is the fixed-reference smoke/debug recipe. It is useful when a caller
# explicitly overrides data.preprocessing.reference_image, but it is not the production
# learning setup: one fixed reference image paired with unrelated text prompts
# gives Kling VideoReward little trainable signal. For source-backed training,
# use experiment/diffusion/cosmos_predict2/online_grpo_v2w_reference.
#
# This recipe requires:
#   data.preprocessing.reference_image=/path/to/reference.png
defaults:
- /recipe/online/cosmos_predict2_grpo
- /model/diffusion/cosmos/predict2_2b
- /sampling/video/704p_93f
- /sampling/denoise/35_step_cfg_7
- /reward/kling_video_reward
- /dataset/drawbench_train_192

data:
  preprocessing:
    conditioning: reference_image

# The upstream beta=0.004 KL prior is too strong for the current VRL
# loss-scale on Kling reward: local diagnostics showed the objective dominated
# by beta * KL while policy gradients stayed ~1e-4 and reward stayed flat.
actor:
  optim:
    lr: 1.0e-4
  ppo_epochs: 4                       # =1 makes clip_fraction identically 0 (dead trust-region, flat curve)

rollout:
  samples_per_chunk: 1   # 512p93f peaks ~31.8GB at sbs=1; CFG doubles the transformer batch — no sample-batch headroom on 32GB (scale gate OOM 2026-06-10)

trainer:
  output_dir: outputs/cosmos_pred2_2b_grpo
  save_freq: 20
  debug:
    first_step: true

# Cosmos-specific eval / sanity-gate config. eval.eval_only=true switches the
# driver into trained-vs-base comparison mode (no training); with LoRA removed
# (2026-06-10) it requires a full-model checkpoint via trainer.resume_from.
