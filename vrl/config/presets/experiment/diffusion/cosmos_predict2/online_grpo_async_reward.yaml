# Cosmos Predict2 2B Video2World + GRPO — async-reward overlap across 3 GPUs.
#
# REQUIRES >= 3 VISIBLE GPUs. This recipe combines three things that already
# exist in the codebase but no single config wired together before:
#   (1) continuous rollout orchestration (/base/rollout/orchestration/continuous
#       + trainer.rollout_orchestration.continuous.max_inflight_groups=2): a
#       background producer keeps per-prompt groups in flight while the trainer
#       drains homogeneous-policy ready groups.
#   (2) reward on a DEDICATED GPU disjoint from rollout
#       (distributed.resources.reward.gpu_pool: dedicated): the reward worker
#       takes a spare GPU that does NOT overlap rollout's GPU.
#   (3) cosmos full-param 8-bit training at 480p-native (720p weights are
#       garbage at 240p/480p; see SPRINT_config_correctness_audit).
#
# GPU TOPOLOGY — use >= 3 visible GPUs: trainer GPU0, rollout GPU1, reward GPU2,
# all disjoint. rollout.gpu_pool=dedicated takes a spare disjoint from the
# trainer; reward.gpu_pool=dedicated then takes a spare disjoint from rollout.
#   - 1 GPU: does NOT resolve. rollout=dedicated has no non-overlapping spare and
#     resolve_distributed_resources raises ("Not enough non-overlapping rollout
#     GPUs"). The single-GPU resident trick lives in the opposite recipe,
#     sd3_5/online_grpo_ocr_single_gpu_async_debug.yaml (gpu_pool=trainer +
#     memory_fraction pins rollout resident on the trainer card).
#   - 2 GPUs: resolves, but reward.gpu_pool=dedicated lands the reward worker
#     back on the TRAINER GPU (the only spare disjoint from rollout). The async
#     overlap below still holds (reward stays disjoint from rollout), but reward
#     now contends with the trainer's forward/backward instead of owning its own
#     card. Use 3+ GPUs for the full no-contention layout this recipe targets.
#
# WHY the dedicated reward GPU is load-bearing for throughput: when reward shares
# rollout's GPU, the topology derives release_rollout_before_reward=True (rollout
# must step off so reward can run), serializing reward(N) after rollout(N).
# Disjoint reward devices make reward_shared_with_rollout False, so
# release_rollout_before_reward resolves False and the reward lease is resident —
# reward(N) overlaps rollout(N+1) on its own card. That is what hides the
# measured ~14% reward stage instead of paying it on the critical path.
#
# Usage (>= 3 GPUs):
#   CUDA_VISIBLE_DEVICES=0,1,2 vrl-train \
#     --config experiment/diffusion/cosmos_predict2/online_grpo_async_reward \
#     model.reference_image=/path/to/ref.png
defaults:
- /recipe/online/cosmos_predict2_grpo
- /model/diffusion/cosmos/predict2_2b
- /sampling/video/480p_33f            # 480p-native; 240p is OOD -> rainbow garbage (SPRINT_config_correctness_audit)
- /sampling/denoise/35_step_cfg_7
- /reward/kling_video_reward          # local HF model, no API key
- /dataset/drawbench_train_192
- /base/rollout/orchestration/continuous

model:
  use_lora: false                     # FULL-PARAMETER (-> apply_full_finetune); 480p full-param needs FSDP/multi-GPU
  path: checkpoints/cosmos-predict2-2b-480p-16fps-diffusers   # 480p-native weights (720p weights = garbage at 480p)
  torch_compile:
    enable: false

distributed:
  resources:
    trainer:
      num_gpus: 1                     # trainer on GPU0
    rollout:
      num_gpus: 1
      gpu_pool: dedicated             # rollout on its own GPU (GPU1), disjoint from trainer
    reward:
      num_gpus: 1
      gpu_pool: dedicated             # reward on a DISJOINT spare GPU (GPU2) -> async overlap
      gpus_per_worker: 1.0
      num_workers: 1

actor:
  optim:
    lr: 2.0e-5                         # full-param wants a lower LR than LoRA's 1e-4 (paper §4.2.2 ~1e-5)
    optim_8bit: true                  # the enabler: int8 Adam state -> full-param 2B fits on 32GB
  gradient_checkpointing: true
  ppo_epochs: 4                       # engages the trust-region clip (1 -> clip_fraction==0, flat curve)

rollout:
  samples_per_chunk: 4

cosmos:
  reference_mode: global              # global | per_sample

trainer:
  output_dir: outputs/cosmos_pred2_2b_async_reward_480p
  total_epochs: 300
  save_freq: 50
  debug: {first_step: true}
  eval: {enabled: true, freq: 25, samples_per_prompt: 2, max_prompts: 32, seed: 20260621}

  rollout_orchestration:
    require_separate_gpus: true       # trainer/rollout/reward are disjoint GPUs here
    continuous:
      max_inflight_groups: 2          # >=2: keep rollout(N+1) producing while reward(N) scores
      max_ready_groups: 4
      max_stale_policy_versions: 1
      max_ready_bytes_mb: 4096
