# SANA 1.6B + aesthetic GRPO — small-model aesthetic improvement.
# Same validated seam as the pickscore recipe (GPU parity + first-step replay
# assert already passed for SANA); only reward and prompts differ. Aesthetic
# scores generated images alone (CLIP ViT-L/14 + bundled LAION MLP head), so a
# plain prompt manifest is enough — no preference pairs needed.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/sana/1600m
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/drawbench_train_192
  - /reward/aesthetic

precision: bf16

sampling:
  max_sequence_length: 300

actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_chunk: 16

trainer:
  output_dir: outputs/sana_aesthetic_grpo
  save_freq: 60
  debug:
    first_step: true
