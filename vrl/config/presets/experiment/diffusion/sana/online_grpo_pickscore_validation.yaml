# SANA 1.6B + PickScore GRPO — first-landing validation recipe.
# GPU parity gates (run before trusting curves): (1) one generation vs
# diffusers SanaPipeline at same prompt/seed/steps (pass the same
# complex_human_instruction to both sides — VRL defaults it OFF, the pipeline
# defaults it ON); (2) debug.first_step asserts rollout logprob == replay.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/sana/1600m
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/pickapic_v2
  - /reward/pickscore

# The SANA family build pins base transformer parameters to fp16; bf16 autocast
# avoids SDE activation overflow without changing that model invariant.

sampling:
  max_sequence_length: 300

actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4
  # Symmetric 8/8 chunk shape, same as online_grpo_aesthetic.yaml: SANA's bf16
  # kernels are batch-shape sensitive (16/1 measured 0.014 pre-update log-prob
  # drift > the 0.01 debug.first_step limit; 8/8 was bit-exact), so with the
  # hard parity gate below the 16/1 shape aborts at the first optimizer step.
  replay_samples_per_chunk: 8

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_chunk: 8

trainer:
  output_dir: outputs/sana_pickscore_grpo
  save_freq: 60
  debug:
    first_step: true
