# Wan 2.1 1.3B T2V + production video reward GRPO on motion-grounded prompts.
# reward.kwargs.kling_video_reward.reward_name is the Hugging Face model id.
# Set worker_config.model_path to use a local checkpoint instead of downloading.
defaults:
  - /recipe/online/wan_2_1_grpo
  - /model/diffusion/wan_2_1/1_3b
  - /sampling/video/240p_33f
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/kling_video_reward
  - /dataset/videophy

actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1

algorithm:
  kl_coef: 0.004

model:
  # Compile is a policy-transformer build choice. Keep rollout and train replay on
  # the same compiled kernels instead of one-sided compile.
  torch_compile:
    enable: true
    mode: default

rollout:
  prompts_per_batch: 1
  samples_per_chunk: 8   # sbs=4 GPM still leaves SM occupancy at ~18%; keep one prompt per reward request.
  noise_level: 0.7
  sde:
    type: cps

trainer:
  output_dir: outputs/wan_1_3b_kling_video_reward
  save_freq: 20

reward:
  kwargs:
    kling_video_reward:
      artifact_format: mp4

production:
  kling_video_reward:
    enabled: true
    report_path: outputs/wan_video_production_report.md
