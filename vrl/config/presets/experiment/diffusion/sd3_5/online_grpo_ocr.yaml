# SD 3.5 Medium + OCR GRPO
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/diffusion/sd3_5/medium
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /reward/ocr
  - /dataset/ocr


sampling:
  max_sequence_length: 128

actor:
  optim:
    lr: 3.0e-4
  # Flow-GRPO SD3 OCR 1GPU parity: 8 batches/epoch, accum=8//2 → 2 updates/epoch.
  gradient_accumulation_steps: 4

rollout:
  # GPM active samples at n/sbs=8 still show ~20% SM occupancy; VAE tiling is on.
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_chunk: 16

trainer:
  output_dir: outputs/sd3_5_ocr_grpo
  save_freq: 60
  debug:
    first_step: true

model:
  # Flow-GRPO SD3 doesn't compile during GRPO; also avoids recompiles when
  # zero-advantage filtering changes the replay microbatch size.
  torch_compile:
    enable: true   # launch-bound profile (P0 trace): elementwise 47%, 1M kernels/step
