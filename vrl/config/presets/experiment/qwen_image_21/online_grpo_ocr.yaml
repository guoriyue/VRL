# Qwen-Image-2.1 + OCR GRPO (Flow-GRPO OCR prompts; text rendering is the
# checkpoint's headline capability, so the verifiable OCR reward is the first
# RL target). Wide LoRA (r=256, all block projections) stands in for
# full-parameter training on one 32 GB card. true_cfg_scale defaults to 1.0 upstream, so the denoise preset
# is the no-CFG one: one transformer forward per step.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/qwen_image_21/lora_wide
  - /sampling/image/512
  - /sampling/denoise/10_step_no_cfg
  - /reward/ocr
  - /dataset/ocr


actor:
  optim:
    lr: 3.0e-4
    # int8 Adam state: the fp32 r=256 LoRA (671M params) would otherwise carry
    # 5.4 GB of moments beside its 2.7 GB weights + 2.7 GB grads on a 32 GB card.
    # Weights stay fp32 (the update is computed in fp32); only m/v are quantized.
    optim_8bit: true
  # Full activation checkpointing: one eager 512px replay forward without it
  # needs >12 GB of activations (dry run OOM at 29.15 GiB during the forward).
  gradient_checkpointing: full
  # Train on 5 of the 10 SDE steps per sample (the repo's usual choice for
  # compute-bound recipes, cf. cosmos 0.5 / sd3_5 0.2). The eager, checkpointed
  # replay costs ~4 forward-equivalents per sample-step: the 3-update dry run
  # measured 8.5-10.5 min of replay per 128-sample update at 0.99 against a
  # 3.5-4 min rollout.
  timestep_fraction: 0.5
  prompts_per_collection: 2

rollout:
  n_samples_per_prompt: 16
  # 6 groups x 16 = 96 samples per update: with timestep_fraction 0.5 this
  # lands one update at ~6 min on a 5090 (rollout ~2.6 min + replay ~3.2 min),
  # the budget for a same-day 60-update answer.
  prompts_per_batch: 6
  # 8 x 512px through the 7B transformer peaks at ~26 GB on the reference
  # pipeline; 16 would not fit beside LoRA training state on a 32 GB card.
  samples_per_generation_batch: 8
  # Full-noise SDE at 10 steps visibly degrades 2.1's text; 0.7 is the value
  # the repo's other image recipes converged on.
  noise_level: 0.7

trainer:
  output_dir: outputs/qwen_image_21_ocr_grpo
  save_freq: 60
  debug:
    first_step: true
