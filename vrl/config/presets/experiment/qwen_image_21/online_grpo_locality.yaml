# Fresh base-model run; the previous EditReward-only checkpoint is a control.
defaults:
  - /experiment/qwen_image_21/online_grpo_editreward
  - _self_

rollout:
  n_samples_per_prompt: 8

trainer:
  output_dir: outputs/qwen_image_21_locality_rl/main
  total_epochs: 20
  save_freq: 5

reward:
  inference:
    editreward:
      endpoint: http://127.0.0.1:8316
      expected_model: editreward-locality-v1
  kwargs:
    editreward:
      score_key: editreward_locality
