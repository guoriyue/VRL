# Wan 2.1 1.3B T2V + production video reward GRPO on motion-grounded prompts.
# reward.kwargs.kling_video_reward.reward_name is the Hugging Face model id.
# Set worker_config.model_path to use a local checkpoint instead of downloading.
defaults:
  - /recipe/online/wan_2_1_grpo
  - /model/wan_2_1/1_3b
  - /sampling/video/240p_33f
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/kling_video_reward
  - /dataset/videophy

actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1

algorithm:
  kl_coef: 0.004

model:
  # One block kernel and batch-invariant linears on both sides: the generation
  # batch below replays bitwise as the trainer's microbatch of 1 (1.3B, 240p x
  # 33f, LoRA off zero: max |dlogprob| 0; stock blocks 1.4e-1). Compile (off in
  # model/wan_2_1/1_3b) and the fused kernels are alternatives.
  fused_kernels: true

rollout:
  prompts_per_batch: 1
  samples_per_generation_batch: 8   # sbs=4 GPM still leaves SM occupancy at ~18%; keep one prompt per reward request.
  noise_level: 0.7
  sde:
    type: cps

trainer:
  output_dir: outputs/wan_1_3b_kling_video_reward
  save_freq: 20
  # Measured bitwise under the fused kernels: any drift is a different computation.
  replay_parity:
    max_abs_logprob_diff: 1.0e-6


