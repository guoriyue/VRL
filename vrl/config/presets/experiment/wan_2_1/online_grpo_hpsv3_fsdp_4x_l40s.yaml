# Wan 2.1 1.3B T2V + HPSv3 GRPO, ALL-RANK phase-cycled variant: four torchrun
# ranks each own one L40S and run every phase on it, Flash-GRPO style —
#   trainer parked -> Wan rollout (24 videos/rank) -> rollout parked
#   -> HPSv3 reward (rank-local 24 samples) -> reward parked -> FSDP trainer.
# All four GPUs are busy in rollout, reward, AND training; idle time shrinks to
# park/wake transitions. Strict on-policy is fully preserved (same 96-sample
# update statistics as the disaggregated online_grpo_hpsv3_4x_l40s preset:
# 6 prompt groups/rank x 4 ranks x G=4 = 96, global_std all-reduces across
# ranks). DDP cannot express this today (reducer-bucket collective parking is
# unimplemented; DDPStrategy rejects shared-GPU topologies), so the trainer is
# FSDP over the LoRA run — the same pattern the droid fullparam 4x-L4 recipe
# validated, with LoRA precedent from the I2V 14B FSDP acceptance.
#
# Memory: each 45GiB card time-shares ~17GB Wan pipeline / ~17GB HPSv3 / the
# checkpointed 81-frame replay; parked owners live in host RAM (4 ranks x ~34GB
# well inside 372GB). Reward weights load from instance-store NVMe (wiped on
# instance stop — re-download per the machine notes).
#
# Run a three-update acceptance before an unattended launch:
#   VRL_CUDA_RESIDUAL_BYTES_LIMIT_MIB=512 HF_HOME=/mnt/nvme/hf/huggingface \
#   torchrun --standalone --nproc_per_node=4 -m vrl.scripts.train \
#     --config experiment/wan_2_1/online_grpo_hpsv3_fsdp_4x_l40s \
#     trainer.total_epochs=3 \
#     trainer.output_dir=outputs/wan_hpsv3_flash_grpo/fsdp_smoke
defaults:
  - /recipe/online/wan_2_1_grpo
  - /model/wan_2_1/1_3b
  - /sampling/video/480x832_81f
  - /sampling/denoise/20_step_cfg_4_5
  - /dataset/flash_grpo_video
  - /reward/hpsv3
  - /base/distributed/training_fsdp

actor:
  optim:
    lr: 1.0e-4            # reference: train.learning_rate = 1e-4
  # All six prompt groups per streaming microbatch (GAS=1): per-sample replay
  # keeps GPU activations bounded regardless, and collecting the whole update
  # before one backward pass cuts phase park/wake transitions from 18 to 3 per
  # update. That is a stability requirement, not a tuning choice: at
  # microbatch_size=1 the cumem map/unmap churn (~50 transitions) wedged all
  # four GPUs with driver Xid 154 "Node Reboot Required" (2026-08-16, attempt
  # 8 of this smoke).
  microbatch_size: 6
  ppo_epochs: 1
  # Mechanism 1: train EXACTLY the rollout's stochastic step. The trained
  # subset is the recorded window, not a trainer-side draw, so
  # timestep_fraction must be 1.0 (the sde_window validation refuses any other
  # value). The earlier strided/0.51 pairing trained a FIXED even-indexed
  # subset every update, including the near-terminal step where cps collapses
  # std_dev_t — see the rollout block.
  timestep_selection: sde_window
  timestep_fraction: 1.0
  # Mandatory at this geometry: the 32,760-token replay backward OOM'd a
  # 44.4GiB L40S under compile-alone (measured 2026-08-16). Compile is scoped
  # to the rollout instead (see model.torch_compile).
  gradient_checkpointing: full
  ema:
    enable: true          # reference: EMAModuleWrapper(trainable_parameters,
    decay: 0.9            #   decay=0.9,
    update_interval: 8    #   update_step_interval=8)

algorithm:
  kind: flash_grpo        # rectified loss; the three mechanisms of arXiv:2605.15980
  # The paper's 1e-3. FlashGRPOConfig already defaults to it, but
  # recipe/online/denoise_grpo.yaml sets 1e-4 and a YAML value shadows a
  # dataclass default, so the paper value only takes effect when written here.
  # 1e-4 sits BELOW this recipe's rollout-vs-replay numeric drift: run50
  # measured pre_update_clip_fraction=0.78 before a single weight update, i.e.
  # the clip was gating on noise and randomly zeroing ~40% of the gradient.
  # Watch that metric on update 1 — it must start near zero.
  clip_ratio: 1.0e-3
  kl_coef: 0.0            # reference: no KL term; clip_ratio is the rail
  # Flash-GRPO normalizes with the std of the whole 96-sample update; under
  # FSDP this is the true cross-rank std (advantages.py all-reduces it).
  global_std: true

model:
  local_files_only: true
  torch_compile:
    enable: true
    # Rollout only: the FSDP2 trainer runs eager + gradient checkpointing,
    # both of which inductor refuses. Measured 446s -> 324s per 4-video group.
    scope: rollout
    mode: default

distributed:
  training:
    strategy: fsdp
    num_nodes: 1
    gpus_per_node: 4
    fsdp:
      mesh: ["dp_shard"]
      precision_policy: actor
      reshard_after_forward: true
      cpu_offload: false
  resources:
    # Each rank colocates its rollout worker on its own trainer GPU; the reward
    # then borrows the same rank-local card once both owners have parked.
    rollout:
      gpu_pool: trainer
  rollout:
    # Wan pipeline startup reads five T5 shards; 600s default killed a real
    # launch off EBS. Keep cold-start headroom even with the NVMe cache.
    worker_rpc_timeout_s: 1800

rollout:
  # Per-rank: 6 prompt groups x G=4 = 24 samples; x4 ranks = the paper's exact
  # 96-sample update (24 distinct prompts, 4 samples each).
  prompts_per_batch: 6
  n_samples_per_prompt: 4
  samples_per_generation_batch: 1
  # The window machinery lives on the SDE branch of the denoise loop; wan's
  # family default is 'native', which bypasses it. 'native' is not merely a
  # different sampler here: it stores the scheduler's DETERMINISTIC step as the
  # action and then scores it under the SDE proposal, so the "log-prob" is a
  # fixed quadratic in the model output rather than the density of a draw.
  # E[grad log pi] != 0 under it, and the negative-advantage branch has no
  # equilibrium. That is why run50 descended on its own objective.
  denoise_mode: sde
  # flow_grpo SDE at noise_level 1.0 is the reference parameterization
  # (std_dev_t = sigmas[1] * sigma) and its log-prob carries the 1/(2*sigma^2)
  # normalizer. cps omits that normalizer while compute_kl_divergence keeps it,
  # and cps derives std_dev_t from sigma_prev, which collapses to 2.7e-3 at the
  # near-terminal step — inflating the effective KL weight there by ~7e4.
  noise_level: 1.0
  sde:
    type: flow_grpo
    # Mechanisms 1+2: ONE stochastic step per trajectory, drawn once per
    # generation request so every sample of a prompt group shares it
    # (iso-temporal grouping). Reference: index ~ U{0..9}.
    window_size: 1
    window_range: [0, 10]
  # 24 trajectories x 81 frames per rank per update: bf16 host-side leaves or
  # host RAM becomes the wall before GPU memory does.
  trajectory_storage:
    dtype: bfloat16

reward:
  kwargs:
    hpsv3:
      worker_config:
        model_path: /mnt/nvme/models/HPSv3
        base_model_path: /mnt/nvme/models/Qwen2-VL-7B-Instruct
        local_files_only: true

trainer:
  output_dir: outputs/wan_hpsv3_flash_grpo/fsdp_run
  # The paper trains until manually stopped; stop on eval-sample quality, not
  # the curve (the reward has no temporal term).
  total_epochs: 300
  # ~2.2h per update measured; at 10 a crash costs a day of work. The LoRA +
  # optimizer checkpoint is tens of MB, so save every other update — crash-only
  # recovery (Xid 79 wedged this host once) is only as cheap as the last
  # complete checkpoint.
  save_freq: 2
  debug:
    first_step: true
