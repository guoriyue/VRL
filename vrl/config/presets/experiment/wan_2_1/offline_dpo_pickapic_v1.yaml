# Wan 2.1 1.3B + Diffusion-DPO (offline, Pick-a-Pic v1).
#
# Thin variant of offline_dpo_pickapic.yaml: the identical run pointed at the
# surviving pickapic-anonymous/pickapic_v1 mirror (the yuvalkirstain/pickapic_v2
# repo this project originally targeted was delisted — 404 on the Hub, 2026-06).
#
# Smoke vs full run differ by CLI override only (no separate file):
#   smoke  : ... data.split=train[:32] trainer.max_train_steps=15 trainer.log_interval=1
#   refine : ... data.split=train[:512] trainer.max_train_steps=1500 actor.optim.lr=1e-6
defaults:
  - /experiment/wan_2_1/offline_dpo_pickapic
  - /dataset/pickapic_v1

trainer:
  output_dir: outputs/wan_1_3b_dpo_pickapic_v1
