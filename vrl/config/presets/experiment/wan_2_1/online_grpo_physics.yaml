# Wan 2.1 1.3B GRPO targeting motion quality AND physical commonsense.
# Reward = 0.7 · Kling MQ z-score + 0.3 · VideoCon-Physics P(Yes).
# Prompts curated from VideoPhy's public benchmark (344 unique physics
# interaction captions; see dataset/videophy).
defaults:
  - /recipe/online/wan_2_1_grpo
  - /model/wan_2_1/1_3b
  - /sampling/video/240p_33f
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/kling_video_reward
  - /reward/videocon_physics
  - /dataset/videophy

actor:
  optim:
    lr: 1.0e-5
  ppo_epochs: 1

algorithm:
  kl_coef: 0.004

model:
  # Compile is a policy-transformer build choice. Keep rollout and train replay on
  # the same compiled kernels instead of one-sided compile.
  torch_compile:
    enable: true
    mode: default

rollout:
  prompts_per_batch: 1
  samples_per_generation_batch: 8   # sbs=4 GPM still leaves SM occupancy at ~18%; keep one prompt per reward request.
  # SDE knobs below are still used to score GRPO transition logprobs.
  noise_level: 0.7
  sde:
    type: cps

trainer:
  output_dir: outputs/wan_1_3b_physics
  save_freq: 20

# Final weighted combination — overrides the per-reward defaults each
# `/reward/...` import declared. Kling MQ at 0.7, VideoCon-Physics at 0.3.
reward:
  components:
    kling_video_reward: 0.7
    videocon_physics: 0.3
  kwargs:
    kling_video_reward:
      artifact_format: mp4
      score_key: motion_quality
    videocon_physics:
      artifact_format: mp4
      score_key: physical_commonsense
      # CuMem sleep is process-wide, so only Kling owns the shared GPU lease.
      # VideoCon remains part of the objective but executes explicitly on CPU;
      # this is a correctness-first throughput trade-off.
      worker_config:
        device: cpu

production:
  kling_video_reward:
    enabled: true
