# Wan 2.1 1.3B + OCR GRPO (flow_grpo general_ocr_wan2_1 parity)
defaults:
  - /recipe/online/wan_2_1_grpo
  - /model/wan_2_1/1_3b
  - /sampling/video/240p_33f
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/ocr
  - /dataset/ocr

actor:
  optim:
    lr: 1.0e-4
  # Stream the 4 video prompt-groups one at a time (derives
  # collections_per_update=4) so host RAM holds ~1 group's heavy video
  # replay trajectories instead of all 4 before backward. Gradient-identical to
  # full-batch (diffusion GRPO, global_std=false, ppo_epochs=1).
  prompts_per_collection: 1
  # Fail fast if one streamed group already uses >90% of host RAM (0.0 disables).
  host_memory_budget_fraction: 0.9

model:
  # One block kernel and batch-invariant linears on both sides: the generation
  # batch below replays bitwise as the trainer's microbatch of 1 (this recipe,
  # LoRA off zero: max |dlogprob| 0; stock blocks 1.4e-1).
  fused_kernels: true

rollout:
  prompts_per_batch: 4
  samples_per_generation_batch: 8   # GPM: sbs=4 leaves SM occupancy at ~18%; next safe T2V scale.

trainer:
  output_dir: outputs/wan_1_3b_ocr_grpo
  # Measured bitwise under the fused kernels: any drift is a different computation.
  replay_parity:
    max_abs_logprob_diff: 1.0e-6
  debug:
    first_step: true
