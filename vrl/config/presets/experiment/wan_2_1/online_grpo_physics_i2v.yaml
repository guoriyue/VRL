# Wan 2.1 14B I2V GRPO targeting motion quality and physical commonsense.
# Uses the same kling_video_reward + videocon_physics reward stack as the T2V route.
defaults:
  - /recipe/online/wan_2_1_i2v_grpo
  - /model/wan_2_1/i2v_14b
  - /sampling/video/480x832_81f
  - /sampling/denoise/20_step_cfg_5_0
  - /reward/kling_video_reward
  - /reward/videocon_physics
  - /dataset/videophy_i2v

actor:
  ppo_epochs: 1

model:
  # Compile is a policy-transformer build choice. This recipe opts into
  # compile-both locally while the shared I2V model default remains conservative.
  torch_compile:
    enable: true
    mode: default

rollout:
  samples_per_chunk: 4   # batch the denoise forward; sbs=1 left the GPU at 25% (smoke 2026-06-09)

trainer:
  total_epochs: 5
  output_dir: outputs/wan_i2v_14b_physics_smoke
  save_freq: 5

reward:
  components:
    kling_video_reward: 0.3
    videocon_physics: 0.7
  kwargs:
    kling_video_reward:
      artifact_format: mp4
      score_key: motion_quality
    videocon_physics:
      artifact_format: mp4
      score_key: physical_commonsense
      # CuMem sleep is process-wide, so only Kling owns the shared GPU lease.
      # VideoCon remains part of the objective but executes explicitly on CPU;
      # this is a correctness-first throughput trade-off.
      worker_config:
        device: cpu

production:
  kling_video_reward:
    enabled: false
