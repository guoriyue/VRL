# Mochi-1 10B + aesthetic GRPO — first-landing validation recipe.
# GPU parity gates: (1) one 19-frame generation vs diffusers
# MochiPipeline at same prompt/seed/steps; (2) debug.first_step asserts
# rollout logprob == replay.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/mochi/10b
  - /sampling/video/320p_19f
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/videophy
  - /reward/aesthetic


actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 4
  samples_per_chunk: 2

trainer:
  output_dir: outputs/mochi_aesthetic_grpo
  save_freq: 60
  debug:
    first_step: true
