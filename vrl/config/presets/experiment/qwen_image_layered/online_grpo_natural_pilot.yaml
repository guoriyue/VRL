# Pure-RL pilot on controlled photo-derived objects, with held-out photo gates.
defaults:
  - /experiment/qwen_image_layered/online_grpo_layered_grouping_fsdp_4x_l4

data:
  manifest: /mnt/nvme/layering_natural_20261025/data/train.jsonl

reward:
  kwargs:
    layered_grouping:
      grouping_mode: partition
      integrity_mode: reference
      integrity_weight: 1.0
      completion_weight: 0.0
      dump_dir: /mnt/nvme/layering_natural_20261025/rollouts

rollout:
  n_samples_per_prompt: 4

distributed:
  resources:
    trainer:
      parking:
        disk_directory: /mnt/nvme/layering_natural_20261025/trainer-parking

trainer:
  output_dir: /mnt/nvme/layering_natural_20261025/train
  total_epochs: 32
  save_freq: 2
