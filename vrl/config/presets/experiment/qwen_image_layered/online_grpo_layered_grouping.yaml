# Qwen-Image-Layered GRPO with the layered_grouping reward on one 32 GB card.
#
# Starts from a scene-family SFT adapter (model.lora.path, a PEFT directory from
# convert_adapter). Both the rollout worker and the trainer keep the bf16
# frozen blocks of the transformer on the host and stream them per call
# (model.offload, actor.offload), as the SFT recipe does: a resident fp8
# rollout already fills 30 GB before the first activation of a 10-layer
# 640x640 sequence, while the streamed policy needs ~4 GB, and the two
# processes share one page-cached copy of the weights. The rollout and the
# replay then also run the same bf16 numerics. Each manifest row sets its own
# layer budget (request_overrides.layers) and the reward's reference (object
# masks, truth layers or both; see /dataset/layered_coco).
#
# Usage (generation batch 1 leaves ~0.27 GB of CUDA runtime on the card after
# the rollout parks, over the default 256 MiB parking tolerance):
#   CUDA_VISIBLE_DEVICES=0 VRL_CUDA_RESIDUAL_BYTES_LIMIT_MIB=512 vrl-train \
#     --config experiment/qwen_image_layered/online_grpo_layered_grouping \
#     model.lora.path=<peft dir> trainer.output_dir=outputs/layered_grpo/<run>
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/qwen_image_layered/base
  - /sampling/denoise/10_step_no_cfg
  - /reward/layered_grouping
  - /dataset/layered_coco
  - _self_

sampling:
  width: 640
  height: 640
  num_steps: 10
  guidance_scale: 1.0
  layers: 9
  input_mode: rgb

model:
  offload: true
  # Rollout and replay run the same fused block kernels, so their log-probs
  # stay bitwise equal: one step 2011 -> 1582 s together with the
  # checkpointing and batch below (5090, 2026-11-02).
  fused_kernels: true
  use_lora: true
  lora:
    path: outputs/layered_v3_data/run_20261015/luma/peft/v3_seg3
    parameter_dtype: float32
  torch_compile:
    enable: false

actor:
  optim:
    lr: 5.0e-5
    # LoRA gradients are ~1e-5 here, so Adam's second moment sits far below the
    # default eps of 1e-8 and the update shrinks to ~0.3% of lr.
    eps: 1.0e-12
  prompts_per_collection: 1
  # Keep every block's attention output (0.1 GB per block per 10-layer
  # sample) and recompute the rest: the trainer's peak stays near 23 GB, and
  # the backward drops 648 -> 475 s a step with the fused kernels.
  gradient_checkpointing: selective_attention
  offload: true
  # Per sample, batch 1 costs what batch 2 does (60 streamed blocks: 7.8 s
  # forward + backward at batch 1 against 8.2 s at batch 2 with a 6 GB
  # attention budget), at half the activation memory.
  training_microbatch_size: 1
  # Train exactly the stochastic steps of the rollout window below.
  timestep_selection: sde_window
  timestep_fraction: 1.0

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 4
  # Equal to actor.training_microbatch_size, so each replay microbatch is one
  # generation batch's rows and the replay runs the rollout's exact GEMM
  # shapes (see trainer.replay_parity). Batch 1 costs no rollout time on the
  # 5090 (denoise 535 s vs 527 s at batch 2 for 32 samples).
  samples_per_generation_batch: 1
  # Noise only on the first 4 of the 10 steps: with noise on every step the
  # final layers were noise-dominated, while deterministic last steps keep them
  # clean and the samples still differ in how they group the objects.
  noise_level: 0.5
  sde:
    window_size: 4
    window_range: [0, 4]

# The local venv has no vLLM, so neither the rollout nor the reward can park
# through a CuMem pool: the rollout's device-resident parts move to the host
# between phases and the CPU reward is rebuilt per scoring phase.
distributed:
  resources:
    rollout:
      parking:
        mechanism: move
    reward:
      parking:
        mechanism: reload

trainer:
  output_dir: outputs/layered_grpo/coco_grouping
  total_epochs: 1000
  save_freq: 2
  # A generation batch replayed as a microbatch of its own size is bitwise:
  # |dlogprob| = 0 at every step, both in no-grad (full_sequence_probe) and
  # in the trainer's grad replay, at batch 2 (stock blocks, full
  # checkpointing, 2026-11-01) and batch 1 and 2 (fused blocks,
  # selective_attention, 2026-11-02). Generation batch 4 replayed as 2
  # drifted up to 2.9e-6 on the trained window steps. Any nonzero drift is
  # therefore a different computation and stops the run, including a
  # zero-advantage row dropped from the middle of a group, which shifts the
  # microbatch rows (actor.drop_zero_advantage; 0 of 109 groups in the
  # 2026-10/11 layered runs).
  replay_parity:
    max_abs_logprob_diff: 0.0
    every_update: true
