# LlamaGen GPT-XL (775M) + PickScore GRPO — first-landing training validation.
# The lightest AR family (256 tokens -> 256 px): the cheap end-to-end check
# that the generic AR GRPO path trains a vendored (non-HF) family. CFG's
# uncond branch is the checkpoint's learned null-caption embedding, and
# max_text_length is pinned to cls_token_num=120 by the runtime.
defaults:
  - /recipe/online/categorical_token_grpo
  - /model/llamagen/xl_256
  - /sampling/token/llamagen_image_256_256tok
  - /reward/pickscore
  - /dataset/drawbench_train_192


algorithm:
  kl_coef: 0.01
  kl_estimator: k2

actor:
  optim:
    lr: 1.0e-4

rollout:
  microbatch_size: 1
  host_memory_budget_fraction: 0.9

trainer:
  output_dir: outputs/llamagen_pickscore_grpo
  debug:
    first_step: true
