# Lumina-Image-2.0 2.6B + PickScore GRPO — first-landing validation recipe.
# GPU parity gates (run before trusting curves): (1) one generation vs
# diffusers Lumina2Pipeline at same prompt/seed/steps (leave system_prompt
# None on both sides so the pipeline default template applies to both);
# (2) debug.first_step asserts rollout logprob == replay.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/lumina2/2b
  - /sampling/image/512
  - /sampling/denoise/10_step_cfg_4_5
  - /dataset/pickapic_v2
  - /reward/pickscore


actor:
  optim:
    lr: 3.0e-4
  gradient_accumulation_steps: 4

rollout:
  n_samples_per_prompt: 16
  prompts_per_batch: 8
  samples_per_generation_batch: 16

trainer:
  output_dir: outputs/lumina2_pickscore_grpo
  save_freq: 60
  debug:
    first_step: true
