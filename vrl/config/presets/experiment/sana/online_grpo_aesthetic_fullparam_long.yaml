# SANA 1.6B full-parameter aesthetic GRPO — fresh 300-update curve.
#
# This is a fresh scientific run, not a continuation of the five-update systems
# pilot. It inherits the pilot's validated native-FP16/no-outer-autocast path,
# FP32 master weights, GradScaler, AdamW8bit moments, 1/1 rollout-replay batch
# parity, and strict backend-drift gates. The separate output directory preserves
# the pilot as immutable capacity/resume evidence.
defaults:
  - /experiment/sana/online_grpo_aesthetic_fullparam
  - /reward/aesthetic_revision
  - /reward/pickscore_revision
  - _self_

trainer:
  total_epochs: 300
  # Full-state checkpoints are 13 GB. Five-update publication bounds restart
  # loss while still preserving every preregistered 25-update eval point.
  save_freq: 5
  output_dir: outputs/sana_aesthetic_fullparam_long

reward:
  components:
    aesthetic: 1.0
    pickscore: 0.0
  kwargs:
    aesthetic:
      model_revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
    pickscore:
      device: cpu
      processor_revision: 1c2b8495b28150b8a4922ee1c8edee224c284c0c
      model_revision: a4e4367c6dfa7288a00c550414478f865b875800
