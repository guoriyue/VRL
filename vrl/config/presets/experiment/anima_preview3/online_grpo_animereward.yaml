# Anima Preview3 + image GRPO on anime prompts, judged by AnimeReward quality.
#
# Differs from online_grpo_aesthetic in the two things that decide whether this
# run can work at all:
#   - dataset: anime_anatomy, not drawbench. The aesthetic recipe trains on
#     general T2I prompts (LEGO men, "a black colored banana"), which is not
#     the target distribution for an anime model.
#   - reward: AnimeReward quality over HTTP. Measured on anima output, LAION
#     aesthetic and PickScore both score on-prompt anime and off-prompt
#     collapse identically (4.98 vs 5.01 / 0.829 vs 0.830), while AnimeReward
#     separates them at Cohen's d = 3.7. See docs/sprints/SPRINT_anima_rl_5090.md.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/cosmos/anima_preview3
  - /sampling/image/512
  # 20, not the recipe's 10. Measured on this model at a fixed seed: 10 steps
  # with the recipe's noise_level scores 0.211, 20 steps scores 0.600 -- the
  # 10-step rollout is undersampled to the point of a visible crystalline
  # texture, so GRPO was being asked to improve images the sampler had already
  # ruined. 20 recovers almost all of 30's quality (0.638) at 2/3 the rollout cost.
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/animereward_quality_http
  - /dataset/anime_anatomy

actor:
  optim:
    # 1e-5 (inherited from the aesthetic recipe) is a full-param rate. Run 2
    # measured grad_norm ~5e-3 with it, i.e. ~5e-8 of parameter movement per
    # step, and reward was flat across 10 epochs (slope +6e-4, noise). Every
    # other LoRA config in this repo uses 1e-4..3e-4 — see the droid LoRA
    # preset's note, "LoRA wants 1e-4, not full-param's 2e-5".
    lr: 1.0e-4
  ppo_epochs: 1
  gradient_accumulation_steps: 4
  # Pipeline fixes proven in experiment D (see SPRINT_anima_rl_5090.md): the
  # base actor's timestep_fraction 0.99 resolves to 19 of 20 trained steps and
  # silently drops the FINAL denoise step -- the one that produces the image;
  # 1.0 trains all 20. EMA off so the exported adapter IS the trained policy
  # instead of a 0.9-decay average the training curve never described.
  timestep_fraction: 1.0
  ema:
    enable: false

algorithm:
  kl_coef: 0.004
  # Matches the sibling aesthetic recipe's explicit per-prompt std rather than
  # the recipe-level global_std default.
  global_std: false
  # Recipe default is 1e-4, inherited from flow_grpo's SD3 setup. Measured on
  # Anima that is far too tight: run 1 logged ratio_abs_dev_mean = 6.1e-4, i.e.
  # 6x the threshold, so ~45% of every batch was clipped and approx_kl sat at
  # 1e-6 for four straight epochs (policy numerically frozen). Widened to just
  # above the observed update magnitude so typical steps pass and only genuine
  # outliers clip.
  clip_ratio: 3.0e-3

rollout:
  # 0.3, not the recipe's 0.7. At 0.7 the exploration noise dominates the image:
  # same prompt and seed, mean reward 0.214 vs 0.589 at 0.3. Crucially this does
  # NOT cost exploration -- within-group std, which is the only thing GRPO
  # consumes, went UP (0.032 -> 0.056) because the spread now reflects real
  # image differences instead of a noise floor that swamps them.
  noise_level: 0.3
  # 16, not 8. This is the knob that sets how many samples share one prompt's
  # advantage baseline, so it directly sharpens GRPO's within-group estimate --
  # the quantity the algorithm actually consumes (measured within-group reward
  # std 0.033 vs between-group 0.029). It is also the knob that fills the card:
  # generation peaked at 6.4 GiB of a 25 GiB budget with 8, and the marginal
  # cost per sample is small (5.8 GiB of that peak is the resident baseline).
  n_samples_per_prompt: 16
  # 4 prompts x 8 samples = 32 samples per update was too small to move a 2B
  # model: runs 2 and 3 both stayed flat after the trust region and the LoRA
  # learning rate were each fixed and verified. 16 prompts widens prompt
  # coverage per epoch too (4 prompts/epoch risks fitting a handful of prompts
  # rather than the distribution).
  prompts_per_batch: 16
  # The executor dispatches one prompt group at a time, so this bounds the
  # in-flight generation batch. Matched to n_samples_per_prompt so a whole group
  # generates in one dispatch instead of being split.
  samples_per_generation_batch: 16
  sde:
    type: flow_grpo

trainer:
  output_dir: outputs/anima_animereward_grpo
  # Frequent enough that a run which starts to hack the reward still leaves a
  # pre-hack checkpoint on disk to fall back to.
  save_freq: 10
