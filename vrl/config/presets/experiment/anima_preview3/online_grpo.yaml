# Anima LoRA execution contract, independent of reward and training data.
# Select those assets, learning rate, and output identity at launch. The single
# update default bounds initial verification; longer schedules are run overrides.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/cosmos/anima_preview3
  - /sampling/image/512
  - /sampling/denoise/20_step_cfg_4_5
  - _self_

reward: ???
data: ???

model:
  torch_compile:
    # Eager generation/replay at batch one is the measured parity-safe shape.
    enable: false

actor:
  optim:
    lr: ???
  max_norm: 0.1
  ppo_epochs: 1
  prompts_per_collection: 1
  training_microbatch_size: 1
  timestep_fraction: 1.0
  ema:
    # Export the policy being optimized, not a different averaged policy.
    enable: false

algorithm:
  kl_coef: 0.004
  global_std: false
  clip_ratio: 3.0e-3

rollout:
  # flow_grpo Eq.9 SDE exploration temperature, and the ONLY source of the
  # within-group diversity a policy gradient can act on: every sample also
  # draws its own initial latent, and that share of the reward spread is not
  # attributable to the policy. Anima ran at 0.3 from 2026-08-18 (it was
  # lowered to make rollouts resemble eval images) and every reward since then
  # produced a flat or declining curve. Measured on 8 fixed prompts x 16
  # samples with the deterministic sharpness reward: 0.3 falls 0.605 -> 0.518
  # over 6 updates (-3.0 SEM), 0.7 climbs 0.669 -> 0.844 over 10 (+7.7 SEM).
  # A rollout is not supposed to look like an eval sample; the injected noise
  # IS the action being graded.
  noise_level: 0.7
  n_samples_per_prompt: 8
  prompts_per_batch: 4
  samples_per_generation_batch: 1
  sde:
    type: flow_grpo

trainer:
  total_epochs: 1
  output_dir: ???
  save_freq: 1
  replay_parity:
    max_abs_logprob_diff: 1.0e-6
  precision_drift_guard:
    # Matching dtype labels alone do not establish on-policy replay parity.
    mode: fail
    max_timestep_checks: 3
    max_abs_log_ratio: 1.0e-6
    max_ratio_abs_dev: 1.0e-6
