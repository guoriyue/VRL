# Experiment D: give the FINAL denoise step gradient, and stop smoothing the
# exported checkpoint into something the training curve never described.
#
# Two defects found in the shared defaults while diagnosing why every run so far
# declines regardless of which reward drives it:
#
# 1. actor.timestep_fraction 0.99 (vrl/config/presets/base/actor.yaml:29) is a
#    compute-saving default inherited from flow_grpo's ~50-step SD3 setup. At
#    this config's num_steps: 20 it resolves to int(20*0.99) = 19 trained steps
#    and takes the strided branch, yielding indices 0..18 -- timestep 19, the
#    LAST step, the one that actually produces the image, never receives loss.
#    Dropping 1 of 50 steps is a rounding error; dropping the last of 20 means
#    the policy is never trained on the transition that determines the output.
#    1.0 trains all 20 (the `train_timestep_count >= num_timesteps` early return).
#
# 2. ema.decay 0.9 / update_interval 8 -- adapter artifacts are exported from EMA
#    weights (vrl/trainers/checkpointing.py:421-424), so every checkpoint
#    evaluated in this sprint was a heavily-smoothed average rather than the
#    policy its training curve described. The class's own default is 0.9999;
#    0.9 at an 8-step interval is aggressive enough that curve and checkpoint are
#    effectively different models. Disabled here so the evaluated weights ARE the
#    trained weights and the two measurements finally refer to the same thing.
#
# Reward composition is carried over from experiment C unchanged: PickScore
# drives (its within-group ranking tracks real defects, saturation rho +0.34 vs
# AnimeReward's +0.56) with AnimeReward as a low-weight anime-domain floor.
defaults:
  - /recipe/online/flow_matching_grpo
  - /model/cosmos/anima_preview3
  - /sampling/image/512
  - /sampling/denoise/20_step_cfg_4_5
  - /reward/animereward_quality_http
  # Supplies the PickScore identity and dtype; distributed.resources owns the
  # CUDA ordinal, so no device override here.
  - /reward/pickscore
  - /dataset/anime_anatomy

reward:
  components:
    pickscore: 1.0
    animereward_quality: 0.25

actor:
  optim:
    lr: 1.0e-4
  ppo_epochs: 1
  gradient_accumulation_steps: 4
  # THE variable under test. See (1) above.
  timestep_fraction: 1.0
  ema:
    # See (2) above: make the exported checkpoint the trained policy.
    enable: false

algorithm:
  kl_coef: 0.004
  global_std: false
  clip_ratio: 3.0e-3

rollout:
  noise_level: 0.3
  n_samples_per_prompt: 16
  prompts_per_batch: 16
  samples_per_generation_batch: 16
  sde:
    type: flow_grpo

trainer:
  output_dir: outputs/anima_pickscore_alltimesteps
  save_freq: 10
