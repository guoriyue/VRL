# Flow-matching SDE rollout — extends diffusion base with stochastic-sampling knobs.
# Used by SD 3.5 (flow_grpo paper Eq.9).
defaults:
  - /base/rollout/denoise

rollout:
  noise_level: 0.7              # flow-grpo Eq.9 SDE noise level
  samples_per_chunk: 8          # rollout chunk size when n > samples_per_chunk
  sde:
    type: flow_grpo             # source of truth for rollout + replay log-prob distribution
