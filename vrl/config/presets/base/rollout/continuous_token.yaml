# AR continuous-token rollout — NextStep-1 flow-matching token sampling.
# Sampling shape (image_token_num / image_size / num_steps / guidance_scale) lives in
# sampling/token/* so it travels with the resolution preset.
rollout:
  n_samples_per_prompt: 4
  prompts_per_batch: 4
  noise_level: 1.0              # final-step Gaussian std multiplier (SDE-from-ODE)
