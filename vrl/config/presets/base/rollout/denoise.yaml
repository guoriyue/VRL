# Rollout / sampling config for diffusion models — pure RL sampling knobs.
# Sampling shape (resolution / steps / guidance_scale / cfg flag) lives in
# sampling/{image,video} plus sampling/denoise.
rollout:
  n_samples_per_prompt: 4
  prompts_per_batch: 4
  denoise_mode: sde             # 'sde' keeps Flow-GRPO stochastic sampling.
  noise_level: 1.0
  samples_per_generation_batch: 1

  # Stochastic SDE sampling window (0 = SDE all steps; >0 = SDE only inside window).
  sde:
    type: flow_grpo
    window_size: 0
    window_range: [0, 10]

  # Rollouts are seedless: the collector draws every request's seed from the
  # checkpointed driver RNG, so group members start from different initial
  # latents. (One seed shared by a group with samples_per_generation_batch=1
  # would make them share the latent, since each batch re-seeds the
  # prepare_sampling generator with the same seed.)
