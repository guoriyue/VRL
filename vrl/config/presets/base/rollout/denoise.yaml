# Rollout / sampling config for diffusion models — pure RL sampling knobs.
# Sampling shape (resolution / steps / guidance_scale / cfg flag) lives in
# sampling/{image,video} plus sampling/denoise.
rollout:
  n_samples_per_prompt: 4
  prompts_per_batch: 4
  denoise_mode: sde             # 'sde' keeps Flow-GRPO stochastic sampling.
  noise_level: 1.0
  samples_per_chunk: 1

  # Stochastic SDE sampling window (0 = SDE all steps; >0 = SDE only inside window).
  sde:
    type: flow_grpo
    window_size: 0
    window_range: [0, 10]

  # Group-shared initial latent has no dedicated flag: a fixed sampling.seed with
  # samples_per_chunk=1 makes group members share the initial latent (each chunk
  # re-seeds the prepare_sampling generator with the same seed). The seed IS the
  # same-latent mechanism.
