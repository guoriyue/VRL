# Actor / training-loop config.
#
# Only experiment decisions live here (lr is ???; drop_zero_advantage and
# timestep_fraction are repo-wide choices that diverge from the dataclass
# "off" defaults, as is the ema block). All optimizer/clip/loop infra defaults
# live on the dataclasses in vrl/trainers/core/types.py — base YAML must not
# restate them.
precision:
  # FP32 matmuls use TensorFloat-32 kernels unless a model family requires
  # strict IEEE execution. This is independent of parameter/autocast dtype.
  float32_precision: tf32
  training:
    dtype: bf16
  # Rollout compute and prompt encoders inherit training.dtype. SDE/scheduler/
  # log-prob math defaults to fp32. Set rollout.dtype, rollout.quantization,
  # rollout.prompt_encoders.dtype, or diffusion_math.dtype only for a measured
  # override.

actor:
  optim:
    lr: ???

  drop_zero_advantage: true

  # Train loss only on a subset of denoising timesteps (compute saving).
  # Diffusion-RL specific — LLM RL has no analog. Belongs in actor because
  # it controls which timesteps participate in the loss, not which steps
  # are sampled at rollout.
  timestep_fraction: 0.99

  ema:
    enable: true
    decay: 0.9
    update_interval: 8
