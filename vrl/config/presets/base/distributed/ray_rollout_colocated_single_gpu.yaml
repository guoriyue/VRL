# Single-GPU colocated Ray rollout preset for workstation validation runs.
#
# COLOCATED = trainer + rollout (+ a shared reward) live on the SAME GPU and
# TIME-SHARE it in turn (never at the same instant):
#     collect (rollout generates) -> train (backward) -> weight sync -> repeat.
#
# The `auto` rollout pool is spare-first-else-share: on a 1-GPU box trainer and
# rollout both land on GPU 0 (colocated); on a box WITH a spare GPU, `auto`
# prefers the spare (disaggregated). To FORCE colocation regardless of spares,
# use the per-role `gpu_pool` grammar (mirrors reward.gpu_pool):
#
#   distributed:
#     resources:
#       rollout:
#         gpu_pool: trainer        # borrow the trainer GPU = colocated
#
# Shared trainer/rollout GPUs always use on-demand phase handoff: the trainer parks
# during collect and the rollout worker parks before training, so each phase owns
# the whole GPU. Actors/processes stay alive; only their GPU state moves.
distributed:
  resources:
    rollout:
      # Bound the auto pool to ONE worker GPU: without this, a multi-GPU box
      # would hand every spare card to rollout instead of exactly one.
      num_gpus: 1

  rollout:
    cpus_per_worker: 4.0
