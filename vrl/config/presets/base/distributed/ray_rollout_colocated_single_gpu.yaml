# Single-GPU colocated Ray rollout preset for workstation validation runs.
#
# COLOCATED = trainer + rollout (+ a shared reward) live on the SAME GPU and
# TIME-SHARE it in turn (never at the same instant):
#     collect (rollout generates) -> train (backward) -> weight sync -> repeat.
#
# An unpinned rollout always shares the trainer GPU, whatever else the box
# holds. To disaggregate instead, pin the rollout to its own card:
#
#   distributed:
#     resources:
#       rollout:
#         devices: [1]             # rollout on GPU 1, trainer keeps GPU 0
#
# Shared trainer/rollout GPUs always use on-demand phase handoff: the trainer parks
# during collect and the rollout worker parks before training, so each phase owns
# the whole GPU. Actors/processes stay alive; only their GPU state moves.
distributed:
  resources:
    rollout:
      # ONE worker GPU: the shared trainer card.
      num_gpus: 1

  rollout:
    cpus_per_worker: 4.0
