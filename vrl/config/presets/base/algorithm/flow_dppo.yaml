# Flow-DPPO — exact-Gaussian-KL trust region instead of the PPO ratio clip.
#
# Drops high-KL, gap-widening samples (asymmetric trust region) rather than
# clamping the ratio. Reads the rollout proposal mean, so the recipe MUST set
# rollout.return_prev_sample_mean=true (the loss fails fast otherwise).
algorithm:
  kind: flow_dppo
  eps: 1.0e-8
  adv_clip_max: 5.0
  global_std: false

  # Per-sample latent-KL trust-region boundary; tune per model/step count.
  kl_mask_threshold: 1.0
  # Fold the per-step diffusion coefficient sqrt(-dt) into the KL sigma.
  add_kl_coefficient: true
