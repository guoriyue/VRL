# V-GRPO (arXiv:2604.23380): GRPO on the ELBO / flow-matching likelihood
# surrogate of the final sample. No evaluator, no per-step log-probs; the
# behaviour policy is the detached current prediction (ratio == 1, the paper's
# fully on-policy Stage-1 recipe). adv_soft_clip (VGRPOConfig) is the paper's
# eta * tanh(A / eta) advantage clip; null switches it off.
algorithm:
  kind: v_grpo
