# GRPO algorithm hyper-parameters
algorithm:
  kind: grpo
  # Family-neutral, AR-safe trust region (matches GRPOConfig's dataclass
  # default). Flow-matching diffusion needs the much tighter flow_grpo
  # clip_range=1e-4, which the diffusion recipes set explicitly — shipping that
  # flow value in this shared base silently froze every AR policy that inherited
  # it via token_grpo.yaml.
  clip_ratio: 0.2
  kl_coef: 0.0
  eps: 1.0e-8                   # numerical stability for advantage division
  adv_clip_max: 5.0
  global_std: false             # per-prompt std (false) vs global-batch std
  flow_kl_use_dt: false         # false matches flow_grpo SD3 KL denominator

  # Subtract kl_reward_coef * per-step KL from reward before computing advantages.
  # Reward shaping, not loss-side KL — verl: algorithm.use_kl_in_reward.
  kl_reward_coef: 0.0
