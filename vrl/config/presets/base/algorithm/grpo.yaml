# GRPO algorithm hyper-parameters: GRPOConfig's dataclass defaults
# (vrl/algorithms/grpo/continuous.py). The family-neutral clip_ratio 0.2 is
# AR-safe; flow-matching diffusion needs the much tighter flow_grpo
# clip_range=1e-4, which the diffusion recipes set explicitly rather than in
# this shared base.
algorithm:
  kind: grpo
