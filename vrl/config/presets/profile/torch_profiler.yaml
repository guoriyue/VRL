# Short-diagnostic PyTorch profiler overlay (low overhead).
# Keep base experiments profiler-free by default; compose this file only for
# short diagnostic runs. Only keys that differ from the TorchProfilerConfig
# defaults (vrl/utils/profiling.py) appear here — the dataclass is the single
# copy of the tuning defaults. Traces land under <trainer.output_dir>/
# torch_profiler; shape/memory/stack/flops recording is fixed off in
# vrl/utils/profiling.py (_PROFILE_OPTIONS) and is not a key.
trainer:
  profile: true
  torch_profiler:
    enabled: true

rollout:
  torch_profiler:
    enabled: true
    activities:
      # Rollout traces can explode during autoregressive generation. Keep the
      # default focused on CUDA kernels; override activities to add CPU ranges.
      - cuda
