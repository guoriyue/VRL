# Cosmos Predict2 2B Video2World — checkpoint + compile only.
# Sampling shape and denoise defaults live under sampling/.
# LoRA removed 2026-06-10: GRPO runs full-parameter fine-tuning
# (apply_full_finetune), sized for multi-GPU training.
model:
  family: cosmos-predict2
  path: nvidia/Cosmos-Predict2-2B-Video2World
  revision: f50c09f5d8ab133a90cac3f4886a6471e9ba3f18

  # Tiled VAE encode/decode: trades a little latency for peak memory, and is
  # the encode-path unlock for native 1280x704x93f on a single 32GB card.
  memory:
    vae_decode:
      tiling: true

  # Enabled 2026-06-15 (SPRINT_gemm_utilization.md P2): measured 1.37x rollout /
  # 1.25x train speedup on RTX 5090, from inductor fusing ~2.6-2.9x fewer kernel
  # launches (this load is launch-bound). Peak memory ~unchanged. Compile hits the
  # same self.transformer on both rollout and train (backbone.py:152), so the
  # logprob parity path stays equivalent -- confirm the trainer.py:603 drift guard
  # stays green on the next real run. Benefit narrows at full video-length grids.
  torch_compile:
    enable: true
    mode: default
