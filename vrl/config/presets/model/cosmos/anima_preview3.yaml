# Anima Preview3 single-file Cosmos Predict2 Text2Image checkpoint.
# Default model.path is a Hugging Face repo ID. Runtime reuses a matching local
# cache entry when present and otherwise follows the standard Hub download path.
model:
  family: cosmos-predict2-anima
  executor:
    max_sequence_length: 128
  path: circlestone-labs/Anima
  revision: 53eec3898af698b2cf2a11379021fc9c5465d228
  transformer_file: split_files/diffusion_models/anima-preview3-base.safetensors
  text_encoder_file: split_files/text_encoders/qwen_3_06b_base.safetensors
  vae_file: split_files/vae/qwen_image_vae.safetensors
  qwen_tokenizer_path: Qwen/Qwen2.5-0.5B
  qwen_tokenizer_revision: 060db6499f32faf8b98477b0a26969ef7d8b9987
  t5_tokenizer_path: google-t5/t5-base
  t5_tokenizer_revision: a9723ea7f1b39c1eae772870f3b547bf6ef7e6c1
  scheduler_shift: 3.0

  memory:
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 32
    alpha: 16
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out

  torch_compile:
    # Compile remains available for inference and profiling. The Anima training
    # execution templates override it with eager mode for measured replay parity;
    # a compile benchmark alone does not establish on-policy log-prob agreement.
    enable: true
    mode: default
