# Anima Preview3 single-file Cosmos Predict2 Text2Image checkpoint.
# Default model.path is a Hugging Face cache repo id; runtime uses cached files
# only and does not download artifacts.
model:
  family: cosmos-predict2-anima
  executor:
    max_sequence_length: 128
  path: circlestone-labs/Anima
  revision: 53eec3898af698b2cf2a11379021fc9c5465d228
  transformer_file: split_files/diffusion_models/anima-preview3-base.safetensors
  text_encoder_file: split_files/text_encoders/qwen_3_06b_base.safetensors
  vae_file: split_files/vae/qwen_image_vae.safetensors
  qwen_tokenizer_path: Qwen/Qwen2.5-0.5B
  qwen_tokenizer_revision: 060db6499f32faf8b98477b0a26969ef7d8b9987
  t5_tokenizer_path: google-t5/t5-base
  t5_tokenizer_revision: a9723ea7f1b39c1eae772870f3b547bf6ef7e6c1
  scheduler_shift: 3.0

  memory:
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 32
    alpha: 16
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out

  torch_compile:
    # Cosmos DiT compile is validated here (compile_benchmark --family cosmos-predict2.5:
    # 1.31x rollout / 1.33x train, fp32 fwd drift ~2e-6). Flipped on 2026-07-02 per the
    # original condition "flip enable:true when an anima experiment lands" — the two
    # anima_preview3 aesthetic recipes exist now. Compile-both = parity-safe (both paths
    # run the same kernels); mode=default is the only LoRA+grad-ckpt-safe mode.
    enable: true
    mode: default
