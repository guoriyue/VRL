# Cosmos3-Nano Omni vision generator for flow-matching GRPO RL.
# Strictly batch=1: Cosmos3OmniPipeline packs one sample at a time, so the batch
# executor pins samples_per_generation_batch=1 (runtime.py). 16B => single-card LoRA smoke
# only; a trustworthy curve needs multi-GPU FSDP2.
# Requires diffusers>=0.39.0 with the released Cosmos3OmniPipeline.
model:
  family: cosmos3
  path: nvidia/Cosmos3-Nano
  revision: 411f42a8fdfb8c5b2583cb8786e0938f49796eaa
  use_lora: true
  lora:
    rank: 32
    alpha: 64
    target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - ff.net.0.proj
      - ff.net.2
  memory:
    vae_decode:
      tiling: true
  torch_compile:
    enable: false
    mode: default
