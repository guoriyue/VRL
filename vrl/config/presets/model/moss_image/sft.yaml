# MOSS-Image-SFT (OpenMOSS 5B single-stream DiT, Qwen3.5-9B encoder, FLUX.2 VAE)
# — checkpoint, LoRA, compile, memory. Sampling shape and denoise defaults live
# under sampling/. Apache-2.0 weights; the DiT and scheduler code the checkpoint
# ships as remote code is vendored in vrl/models/families/moss_image/upstream.py.
model:
  family: moss_image
  executor:
    # Upstream's prompt ceiling. Prompts are encoded unpadded, so this caps
    # truncation and costs nothing for short prompts.
    max_sequence_length: 4096
  path: OpenMOSS-Team/MOSS-Image-SFT
  revision: 2c7954437269461767f533b006823e8f85973a60

  memory:
    # The 18 GB bf16 Qwen3.5-9B encoder does not fit beside the 10 GB DiT plus
    # LoRA training state on a 32 GB card; it encodes on the host. Drop this on
    # a card with room for both.
    cpu_resident:
      - text_encoder

  use_lora: true
  lora:
    rank: 16
    alpha: 32
    # Each DiT block keeps its projections in one ModuleDict: proj.q/k/v/o are
    # the attention maps, proj.ffn_up_gate / proj.ffn_down the SwiGLU MLP.
    # Attention projections only, as the sibling image families train.
    target_modules:
      - proj.q
      - proj.k
      - proj.v
      - proj.o

  torch_compile:
    # The upstream forward loops over the batch in Python and gathers each
    # sample's valid text tokens by boolean mask, so shapes change per sample
    # and per prompt length; a compiled graph would break and recompile.
    enable: false
