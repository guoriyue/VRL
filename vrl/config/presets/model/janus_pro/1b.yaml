# Janus-Pro-1B — autoregressive image-token generator (DeepSeek).
# Sampling defaults (image_token_num / image_size / guidance_scale / temperature)
# live in sampling/token/*.yaml.
model:
  family: janus_pro
  path: deepseek-ai/Janus-Pro-1B
  revision: 960ab33191f61342a4c60ae74d8dc356a39fafcb

  use_lora: true
  lora:
    rank: 128
    alpha: 256
    dropout: 0.0
    init: gaussian
    # Janus' language-model uses LLaMA-style attention projection names.
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
