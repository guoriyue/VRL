# Emu3-Gen ~9B (BAAI, HF-format checkpoint) — autoregressive image-token
# generator. Sampling defaults (image_area / ratio / guidance_scale /
# temperature / max_text_length) live in sampling/ar/*.yaml. The
# image token count is derived from the latent grid (h*(w+1)+3), so there is
# no image_token_num knob for this family.
model:
  family: emu3
  path: BAAI/Emu3-Gen-hf
  dtype: bfloat16

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    dropout: 0.0
    init: gaussian
    # Emu3's text model uses LLaMA-style attention projection names.
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
