# Wan 2.2 A14B T2V dual-stage transformer.
model:
  family: wan
  executor:
    max_sequence_length: 256
  path: Wan-AI/Wan2.2-T2V-A14B-Diffusers
  revision: 5be7df9619b54f4e2667b2755bc6a756675b5cd7
  trainable_transformers:
    - transformer_2

  memory:
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    target_modules:
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out
      - to_k
      - to_out.0
      - to_q
      - to_v

  torch_compile:
    # OFF until the Wan2.2 dual-stage (transformer_2) base proof run lands
    # (SPRINT_wan_2_2_dual_expert). Compile is the shared wan DiT path (validated
    # parity-safe, ~1.1x); flip enable:true after the base run is validated.
    enable: false
    mode: default
