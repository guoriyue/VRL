# Wan 2.1 1.3B T2V transformer — checkpoint, LoRA, compile, and memory policy.
# Sampling shape and denoise defaults live under sampling/.
model:
  family: wan
  path: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
  revision: 0fad780a534b6463e45facd96134c9f345acfa5b

  # Wan 2.1's text length and native frame rate. Generation already used 512
  # tokens when this was unset (the model's fallback) and never reads fps;
  # eval scripts read both from here to encode prompts and write videos.
  executor:
    max_sequence_length: 512
    fps: 16

  memory:
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    target_modules:
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out
      - to_k
      - to_out.0
      - to_q
      - to_v

  # Off: compile builds separate inference and training graphs, so a compiled
  # rollout and its compiled replay are two computations (LoRA recipe, generation
  # batch 1 replayed as 1: max |dlogprob| 9.1e-2 compiled, 0 eager; 2026-08-28).
  # The online recipes take model.fused_kernels instead (one block kernel on
  # both sides, batch-invariant linears).
  torch_compile:
    enable: false
    mode: default              # 'default' | 'reduce-overhead' | 'max-autotune'
