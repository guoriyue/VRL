# Qwen-Image-Layered — the qwen_image MMDiT (~20B) + 4-channel video VAE, loaded
# through QwenImageLayeredPipeline. One source image -> ``sampling.layers`` RGBA
# layers. LoRA targets follow the layered release's training recipe.
model:
  family: qwen_image_layered
  path: Qwen/Qwen-Image-Layered
  revision: 8f0ca708dfff6ba1dd5f2d85d78f8c108a040bcf

  memory:
    # The ~15 GB Qwen2.5-VL encoder cannot co-reside with the ~20 GB transformer on a 32 GB card.
    cpu_resident:
      - text_encoder
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    target_modules:
      - to_k
      - to_q
      - to_v
      - add_k_proj
      - add_q_proj
      - add_v_proj
      - to_add_out

  torch_compile:
    enable: false
