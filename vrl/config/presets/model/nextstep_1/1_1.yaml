# NextStep-1.1 — 14B continuous-token AR transformer + 157M flow-matching head.
# Paired with the f8ch16 VAE tokenizer (32×32 patches @ 16 channels).
# Sampling defaults (image_token_num / image_size / num_steps / guidance_scale)
# live in sampling/token/*.yaml.
model:
  family: nextstep_1
  path: stepfun-ai/NextStep-1.1
  revision: 05486ff90769ad32109d219fd4659d41671a770a
  vae_path: stepfun-ai/NextStep-1-f8ch16-Tokenizer
  vae_revision: 31c24c8c751e87b02d56ae6a5fe658e7da0b8388

  use_lora: true
  lora:
    rank: 32
    alpha: 64
    dropout: 0.0
    init: gaussian
    # NextStep-1's LLM trunk is Qwen-2 derived — same attention module names.
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

  # Frozen sub-modules
  freeze_vae: true
