# Qwen-Image-2.1 with a wide LoRA: rank 256 on every projection of the 32
# single-stream blocks (attention q/k/v/out + SwiGLU proj/gate/out), 671M
# trainable parameters (1.25 GiB bf16). The single-32GB-card stand-in for
# full-parameter post-training: the 7B weights + grads alone (28 GB) do not
# fit, this does. Shared modulation / txt_in / img_in / proj_out stay frozen.
defaults:
  - /model/qwen_image_21/base

model:
  lora:
    rank: 256
    alpha: 512
    target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - img_mlp.proj
      - img_mlp.gate_layer
      - img_mlp.out

  # Compile OFF. Regional compile measured only 1.13x at batch 8 on the
  # reference pipeline, and the trainer cannot compile at all here: torch.compile
  # forbids activation checkpointing (vrl/config/validation.py), and without
  # checkpointing one 512px replay forward through the 32 blocks plus the 14 GB
  # bf16 base and the fp32 r=256 LoRA state exceeds 32 GB (dry run OOM at
  # 29.15 GiB before the first backward). Eager on BOTH sides keeps rollout and
  # replay on the same kernels, which is what the parity gate needs.
  torch_compile:
    enable: false
