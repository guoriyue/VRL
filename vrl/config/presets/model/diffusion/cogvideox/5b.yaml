# CogVideoX-5b — same family; external RoPE (use_rotary_positional_embeddings)
# is recomputed per request by the model, so 2b and 5b share all code.
model:
  family: cogvideox
  executor:
    num_frames: 49
    max_sequence_length: 226
  path: THUDM/CogVideoX-5b
  revision: 8fc5b281006c82b82d34fd2543d2f0ebb4e7e321

  memory:
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 16
    alpha: 32
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0

  torch_compile:
    enable: false
    mode: default
