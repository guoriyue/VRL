# SANA 1.6B linear-attention DiT + DC-AE — checkpoint, LoRA, compile.
# Sampling shape/denoise defaults live under sampling/.
model:
  family: sana
  executor:
    max_sequence_length: 300
  path: Efficient-Large-Model/Sana_1600M_1024px_diffusers
  revision: d1b54936033cd7d45410ecadd692c5c502a19a38

  use_lora: true
  lora:
    rank: 16
    alpha: 32
    # SANA linear self-attention + vanilla cross-attention share the standard
    # diffusers projection names (verified on SanaTransformer2DModel).
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0

  torch_compile:
    # Off until the GPU parity pass validates compiled linear-attention
    # numerics; flip after the first trustworthy curve.
    enable: false
    mode: default

# The published transformer checkpoint requires native FP16 parameters without
# outer autocast. The family capability rejects BF16 and FP32 denoiser roles;
# Gemma remains a separate frozen BF16 protocol boundary.
precision:
  # SanaLinearAttnProcessor2_0 promotes Q/K/V to FP32 before matmul. Its
  # checkpoint-validated path requires IEEE FP32 kernels in every process.
  float32_precision: ieee
  training:
    dtype: fp16
  rollout:
    dtype: fp16
    prompt_encoders:
      dtype: bf16
