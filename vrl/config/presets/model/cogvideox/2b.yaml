# CogVideoX-2b (v-prediction DDPM DiT) — checkpoint, LoRA.
# Non-flow family: pair with rollout.sde.type: ddim (validated at rollout).
model:
  family: cogvideox
  executor:
    num_frames: 49
    max_sequence_length: 226
  path: THUDM/CogVideoX-2b
  revision: 1137dacfc2c9c012bed6a0793f4ecf2ca8e7ba01

  memory:
    # T5-XXL (~9.5 GB bf16) is parked on the host to leave room for video latents.
    # Runs on the host; drop this on a card with room for both.
    cpu_resident:
      - text_encoder
    vae_decode:
      tiling: true
      slicing: true

  use_lora: true
  lora:
    rank: 16
    alpha: 32
    target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0

  torch_compile:
    enable: false
    mode: default
