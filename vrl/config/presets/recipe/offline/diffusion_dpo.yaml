# Offline diffusion DPO recipe.
defaults:
  - /base/algorithm/dpo

# DPO has its own synchronous trainer surface. Do not inherit the online actor /
# trainer presets: EMA, PPO epochs, rollout orchestration, and total_epochs have
# no DPO consumers.
precision:
  float32_precision: tf32
  training:
    dtype: ???

actor:
  optim:
    lr: ???
  gradient_accumulation_steps: ???
  prediction_type: ???
  scale_lr: ???
  train_batch_size: ???
  use_adafactor: ???

trainer:
  entrypoint: ???
  output_dir: ???
  max_train_steps: ???
  checkpointing_steps: ???
  log_interval: ???

distributed:
  resources:
    rollout:
      # Offline DPO trains from a fixed preference dataset: no generation fleet.
      num_engines: 0
