# Cosmos Predict2 2B online GRPO recipe: the family+algo defaults every
# cosmos_predict2 experiment shared inline. Composes the generic diffusion-GRPO
# recipe and pins the values that are unanimous across all cosmos_predict2 runs
# (entrypoint + the flow-matching clip range + CPS SDE + the rollout group shape),
# so experiments carry only their real per-run diffs (shape, checkpoint, reward,
# lr/ppo_epochs/samples_per_generation_batch when they deviate). Override any of these in an
# experiment when it genuinely differs.
defaults:
  - /recipe/online/denoise_grpo

trainer:
  entrypoint: vrl.scripts.train:train_online

algorithm:
  # cosmos/wan video GRPO wants a tighter clip than the diffusion default (1e-4);
  # set at the family boundary so every cosmos experiment inherits it.
  clip_ratio: 1.0e-3

rollout:
  n_samples_per_prompt: 8
  prompts_per_batch: 1
  sde:
    type: cps

sampling:
  # Predict2's model and executor both use 16 FPS. Keep reward artifact
  # metadata on the same clock even when a geometry preset omits fps.
  fps: 16
