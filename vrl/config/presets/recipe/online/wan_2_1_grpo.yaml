# Wan 2.1 T2V family GRPO recipe: the rollout shape every T2V experiment
# shares. Per-run tuning (lr, KL, SDE type, compile) stays in the experiments —
# the three T2V runs genuinely differ there (ocr is flow_grpo-parity shaped,
# kling/physics are video-reward shaped). Family dispatch comes from
# diffusion_grpo's generic entrypoint via model.family.
defaults:
  - /recipe/online/denoise_grpo

rollout:
  n_samples_per_prompt: 8
  # The SDE path draws each step from the density its log-prob describes.
  # The earlier 'native' path stored the scheduler's deterministic step as the
  # action and scored it under the SDE proposal: the standardized residual of
  # that action had E[z^2] = 0.01 instead of 1 (full_sequence_probe, 1.3B at
  # 240p x 33f), so the "log-prob" was a quadratic in the model output rather
  # than the density of a draw and E[grad log pi] != 0.
  denoise_mode: sde
