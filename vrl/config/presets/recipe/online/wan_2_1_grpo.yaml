# Wan 2.1 T2V family GRPO recipe: the rollout shape every T2V experiment
# shares. Per-run tuning (lr, KL, SDE type, compile) stays in the experiments —
# the three T2V runs genuinely differ there (ocr is flow_grpo-parity shaped,
# kling/physics are video-reward shaped). Family dispatch comes from
# diffusion_grpo's generic entrypoint via model.family.
defaults:
  - /recipe/online/denoise_grpo

rollout:
  n_samples_per_prompt: 8
  # Wan rolls out through its native denoise path; set by every wan experiment.
  denoise_mode: native
