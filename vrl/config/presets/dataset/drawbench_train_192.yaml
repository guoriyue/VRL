# DrawBench prompt subset used by image/video alignment experiments.
data:
  loader: prompt_manifest
  manifest: datasets/drawbench/train_192.txt
  # Fixed, disjoint 64-prompt grid derived from DrawBench test.txt. The
  # trustworthy-curve protocol keeps both this list and its seed grid frozen.
  eval_manifest: datasets/drawbench/eval_64.txt
  preprocessing:
    format: text
  sampler:
    type: random_without_replacement
