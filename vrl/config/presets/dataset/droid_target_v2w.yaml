# Source-backed Video2World target clips from the public LeRobot DROID sample.
# Build with:
#   python -m vrl.scripts.data.setup video-world-targets --repo-id lerobot/droid_100 --name droid_targets
data:
  loader: prompt_manifest
  manifest: data/external/video_world/manifests/droid_targets_train.jsonl
  eval_manifest: data/external/video_world/manifests/droid_targets_eval.jsonl
  source_report: data/external/video_world/droid_targets_report.json
  artifact_data_root: data/external
  task_type: video2world
  preprocessing:
    format: jsonl
    conditioning: reference_image
  sampler:
    type: random_without_replacement
