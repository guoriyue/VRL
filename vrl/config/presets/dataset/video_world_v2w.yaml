# Source-backed Video2World first-frame prompt manifest. Build with:
#   python -m vrl.scripts.data.video_world robot
# Reference images live outside git under data/external or VRL_DATA_ROOT.
data:
  loader: prompt_manifest
  manifest: data/external/video_world/manifests/robot_train.jsonl
  eval_manifest: data/external/video_world/manifests/robot_eval.jsonl
  source_report: data/external/video_world/robot_report.json
  artifact_data_root: data/external
  task_type: video2world
  preprocessing:
    format: jsonl
    conditioning: reference_image
  sampler:
    type: random_without_replacement
