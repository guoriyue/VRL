# VideoPhy2 physics-grounded prompt manifest.
# Built from the public HF datasets `videophysics/videophy2_train` and
# `videophysics/videophy2_test` (caption column): 3,343 train and 599 held-out
# captions with zero overlap (180 held-out captions flagged hard upstream).
# Provenance, revisions and hashes in manifests/videophy/report.json.
data:
  loader: prompt_manifest
  manifest: manifests/videophy/train.txt
  eval_manifest: manifests/videophy/eval.txt
  source_report: manifests/videophy/report.json
  task_type: text_to_video
  preprocessing:
    format: text
  sampler:
    type: random_without_replacement
