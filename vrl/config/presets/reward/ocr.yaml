# OCR reward for text-in-image/video alignment.
reward:
  components:
    ocr: 1.0
  kwargs:
    ocr:
      # Select ocr_match for a 0/1 full-text match with no partial credit.
      # For videos it is the success fraction across all sampled frames.
      score_key: ocr
      # Experiments may opt into auditable OCR frames without inventing a
      # reward-only leaf outside this reusable config boundary.
      debug_dir: null
