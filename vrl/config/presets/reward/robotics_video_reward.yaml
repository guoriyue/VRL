# Audited DROID reward blend for phase-separated, in-process GPU execution.
#
# The reward follows each torchrun rank's logical trainer device. Resource
# topology therefore parks trainer and Wan rollout state before scoring, then
# parks this complete composite before training resumes. All child weights are
# materialized inside one CuMem pool by
# RoboticsVideoRewardModel.prepare_for_inference.

reward:
  components:
    robotics_video_reward: 1.0
  kwargs:
    robotics_video_reward:
      reward_name: robotics_video_reward
      score_key: robotics_blend
      media_type: video
      artifact_format: mp4
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
      worker_config:
        reward_model_version: KlingTeam/VideoReward@main+DINOv2-vits14+RAFT-small+droid-blend-v1
        data_root: ${data.artifact_data_root}
        weights:
          target_dino_similarity: 1.0
          motion_dynamics: 0.2
          kling_text_alignment: 0.3
        kling:
          reward_model_name: KlingTeam/VideoReward@main
          dtype: bfloat16
          local_files_only: true
          min_frame_pixels: 200704
          disable_flash_attn2: true
        dino:
          num_frames: 16
          sequence_weight: 0.4
          final_weight: 0.2
          temporal_weight: 0.4
        motion:
          num_frames: 16
          flow_size: 256
          magnitude_scale: 50.0
