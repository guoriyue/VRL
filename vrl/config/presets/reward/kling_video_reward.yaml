# Kling VideoReward for world-model RL.
distributed:
  resources:
    reward:
      num_gpus: 1
      gpus_per_worker: 1.0
      num_workers: 1

reward:
  components:
    kling_video_reward: 1.0
  kwargs:
    kling_video_reward:
      # Park the 7B reward model off-GPU between scores (in-process sleep/wake,
      # same semantics as the rollout lease): on a shared/single GPU the card
      # belongs to rollout+trainer outside scoring. cumem-only (vLLM required):
      # the model builds inside a tagged CumemPool, sleep releases physical
      # pages, wake remaps without cudaMalloc. Profiled at 14GB weight scale:
      # 0.7s/cycle vs 4.4s naive .to() round trip vs ~8s per-step actor reload
      # the old Ray pool paid; bit-exact across sleep/wake, fragmentation-immune.
      sleep_offload: true
      reward_name: kling_video_reward   # logical tag (request label)
      score_key: overall_reward
      media_type: video
      artifact_format: mp4   # tensor (.pt) is unreadable by decord; every working run uses mp4
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
      # Omit model_path to resolve reward_model_name from the local HF
      # cache; set worker_config.model_path to load a local checkpoint dir.
      worker_config:
        reward_model_name: KlingTeam/VideoReward@main   # which HF checkpoint to load
        dtype: bfloat16
        local_files_only: true
        # Upscale low-res rollout videos to the reward model's training frame
        # budget (checkpoint data_config.max_frame_pixels = 200704 ≈ 448²)
        # before scoring, so 240p training runs are scored in-distribution.
        min_frame_pixels: 200704
