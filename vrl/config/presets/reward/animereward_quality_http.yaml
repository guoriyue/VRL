# AnimeReward visual quality served by an operator-owned HTTP service.
#
# The service owns model placement and lifecycle, so this transport preset must
# not reserve a local reward GPU or include worker/device configuration. The
# service runs from its own transformers-4.x environment because the Idefics2
# regression head comes from Mantis's fork (see vrl/rewards/models/animereward_quality.py).
reward:
  components:
    animereward_quality: 1.0
  kwargs:
    animereward_quality:
      reward_name: animereward_quality
      score_key: animereward_quality
      media_type: image
      artifact_format: tensor
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
  inference:
    animereward_quality:
      kind: http
      endpoint: http://127.0.0.1:8310
      expected_model: animereward-quality
