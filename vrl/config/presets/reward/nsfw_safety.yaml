# NSFW classifier penalty. This reward only returns zero or negative scores.
distributed:
  resources:
    reward:
      # classifier_device below is CPU; mirror that at the resource boundary so
      # lifecycle resolution never invents a trainer-GPU reward lease.
      device: cpu

reward:
  components:
    nsfw_safety: 1.0
  kwargs:
    nsfw_safety:
      model_name: Falconsai/nsfw_image_detection
      classifier_device: cpu
      threshold: 0.35
      penalty_scale: 1.0
      max_penalty: 1.0
      image_sample_count: 1
      aggregation: max
