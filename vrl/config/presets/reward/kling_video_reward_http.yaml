# Kling VideoReward served by an operator-owned HTTP service.
#
# The service owns model placement and lifecycle, so this transport preset must
# not reserve a local reward GPU or include worker/device configuration. The
# shared artifact path is integrity-checked by the service before scoring.
reward:
  components:
    kling_video_reward: 1.0
  kwargs:
    kling_video_reward:
      reward_name: kling_video_reward
      score_key: overall_reward
      media_type: video
      artifact_format: mp4
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
      inference:
        kind: http
        endpoint: http://127.0.0.1:8300
        timeout_s: 1800
        expected_model: kling-video-reward
