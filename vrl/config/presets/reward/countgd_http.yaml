# Text-conditioned exact-count reward served from CountGD's isolated CPU
# environment. The service owns model paths and placement; this preset owns only
# the shared-filesystem artifact and HTTP transport contract.
#
# Each sample supplies metadata.object_class (e.g. "cat") and an integer
# metadata.expected_count >= 0. One service handles different classes per sample.
# Detector agreement is not ground truth: qualify each new domain and audit
# held-out images before treating a higher reward as a better policy.
reward:
  components:
    countgd: 1.0
  kwargs:
    countgd:
      reward_name: countgd
      score_key: countgd
      media_type: image
      artifact_format: tensor
      artifact_dir: ${trainer.output_dir}/reward_artifacts
      debug_dir: ${trainer.output_dir}/reward_debug
  inference:
    countgd:
      kind: http
      endpoint: http://127.0.0.1:8311
      expected_model: countgd
      expected_model_version: CountGD@b6f362b3f5cd20db4a171faa410dfed8f2f466d8+protocol-a22646e78242bc9122a032fb9075d1ca8b175de751bd1a75e910a28994472d51
