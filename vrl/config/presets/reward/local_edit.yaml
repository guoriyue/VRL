# Local-edit reward (vrl/rewards/models/local_edit.py): an operator-run
# EditReward service scores whether the instruction was carried out; DINOv2
# patch tokens outside the row's edit box say whether everything else stayed,
# with a phase-correlation shift guard. local_edit = sqrt(execution * keep) is
# reported, but on blind-labelled held-out edits only the execution score held
# up (done vs not-done AUC 0.94; keep vs collateral 0.70), so experiments train
# on local_edit_execution and keep the keep term as an observation.
# Every prompt row carries metadata.local_edit ({task, box, hint, source_image})
# and one reference image -- manifests/local_edit does (vrl/scripts/data/local_edit.py).
# DINOv2-large runs on the trainer GPU (~1.2 GB); the 7B execution scorer lives
# in its own service (outputs/local_edit/editreward_service.yaml, port 18316).
reward:
  components:
    local_edit: 1.0
  kwargs:
    local_edit:
      score_key: local_edit
      worker_config:
        dino_model: facebook/dinov2-large
        execution_endpoint: http://127.0.0.1:18316
        execution_model: editreward-qwen25-7b
