# Pairwise Qwen3-VL-32B judge (operator-run service, port 8318) plus the
# model-free tonal anchor: the judge is indifferent to a global brightening,
# saturation boost or glow (it prefers those transforms 33-47% of the time,
# docs/rewards/cards/vlm_preference_qwen3vl32b_qwen21_t2i.md), so stage-1
# policies drifted brighter and glossier. The anchor is 0 inside the band a
# healthy policy already occupies (90th percentile of base rollouts: 0.04 luma,
# 0.06 saturation from the reference) and negative outside; weight 2.0 makes
# the +0.10 luma drift of stage 1 (-0.12) outweigh the judge's within-group
# spread (~0.10). Both read metadata.judge_reference.
distributed:
  resources:
    reward:
      device: cpu

reward:
  components:
    vlm_preference: 1.0
    tonal_anchor: 2.0
  kwargs:
    vlm_preference:
      score_key: vlm_preference
    tonal_anchor:
      reference_key: judge_reference
      data_root: /mnt/nvme/data/external
      luma_tolerance: 0.04
      saturation_tolerance: 0.06
  inference:
    vlm_preference:
      kind: http
      endpoint: http://127.0.0.1:8318
      expected_model: vlm-preference-qwen3vl32b
