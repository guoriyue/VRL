# Known-layer decomposition axes, weighted separately (normalized_sum
# standardizes each). Not qualified for a training key yet: run the reward
# qualification gates (.claude/skills/reward/qualification.md) on the policy's
# own outputs before trusting any curve.
reward:
  components:
    layered_hidden_completion: 1.0
    layered_object_match: 1.0
    layered_visible_retention: 0.5
    layered_edit_holes: 0.5
  kwargs:
    layered_hidden_completion: {data_root: data/external}
    layered_object_match: {data_root: data/external}
    layered_visible_retention: {data_root: data/external}
    layered_edit_holes: {data_root: data/external}
